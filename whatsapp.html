<script>
// Same sign-in gate as analytics.html. Who may use the inbox is decided by Ted's Worker on every call.
(function () {
  var ok = false;
  try {
    var s = JSON.parse(localStorage.getItem('sb-recbwmihyinlgxnymcmc-auth-token') || 'null');
    ok = !!(s && s.access_token && (!s.expires_at || s.expires_at * 1000 > Date.now() - 3600e3));
  } catch (e) { ok = false; }
  if (!ok) {
    try { sessionStorage.setItem('vm_next_path', 'whatsapp.html' + location.search); } catch (e) {}
    location.replace('signin.html');
  }
})();

<style>
:root{
  --cream:#FAF5ED; --cream-2:#F4ECDD; --red:#B94A3F; --red-dark:#A13A30; --red-soft:#F3DDD8; --ink:#2B211A; --muted:#7A6B5C;
  --line:#E4DBC9; --green:#5C8A6B; --green-soft:#E2EDDF; --amber:#C8923A; --amber-soft:#F4E5C7; --blue:#3F6E94; --blue-soft:#DCE7F1;
  --surface:#FFFFFF; --serif:"Playfair Display", Georgia, serif; --sans:"Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --shadow-sm: 0 1px 2px rgba(43,33,26,.05); --radius: 14px; --on-red:#fff; --b-green:#3e6049; --b-amber:#8a611f; --b-blue:#2b4f6e;
  --toast:#2B211A; --toast-ink:#FAF5ED;
}
:root[data-theme="dark"]{
  --cream:#1F1A16; --cream-2:#2A231E; --red:#D17262; --red-dark:#B95F50; --red-soft:#5C2B25; --ink:#F4ECDD; --muted:#A89685; --line:#3A302A;
  --green:#85A88E; --green-soft:#2C3E32; --amber:#E5C896; --amber-soft:#4A3C20; --blue:#6F9DC4; --blue-soft:#28394A; --surface:#26201B;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.30); --b-green:#B9D3C0; --b-amber:#F0D9AE; --b-blue:#B7D0E6; --toast:#F4ECDD; --toast-ink:#1F1A16;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --cream:#1F1A16; --cream-2:#2A231E; --red:#D17262; --red-soft:#5C2B25; --ink:#F4ECDD; --muted:#A89685; --line:#3A302A; --surface:#26201B;
    --green-soft:#2C3E32; --amber-soft:#4A3C20; --blue-soft:#28394A; --b-green:#B9D3C0; --b-amber:#F0D9AE; --b-blue:#B7D0E6; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--cream); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button { font: inherit; cursor: pointer; color: inherit; }
[hidden] { display: none !important; }
a { color: var(--red); }
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); flex: none; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--red); color: var(--on-red); display: grid; place-items: center; flex: none; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 15px; text-decoration: none; }
.page-title { font-family: var(--serif); font-weight: 700; font-size: 22px; line-height: 1.1; white-space: nowrap; }
.page-title em { font-style: italic; color: var(--red); font-weight: 600; }
.sp { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; min-height: 32px; border-radius: 999px; font-weight: 600; font-size: 12.5px; border: 1px solid transparent; white-space: nowrap; background: transparent; }
.btn-primary { background: var(--red); color: var(--on-red); } .btn-primary:hover { background: var(--red-dark); }
.btn-ghost { background: var(--surface); border-color: var(--line); } .btn-ghost:hover { background: var(--cream-2); }
.btn-green { background: var(--green-soft); color: var(--b-green); border-color: transparent; }
.btn-sm { min-height: 28px; padding: 2px 10px; font-size: 12px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .row:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.chips { display: inline-flex; gap: 2px; background: var(--cream-2); border-radius: 999px; padding: 3px; }
.chip { border: 0; border-radius: 999px; background: transparent; padding: 0 10px; font-size: 12px; font-weight: 600; min-height: 28px; color: var(--muted); white-space: nowrap; }
.chip.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.chip .n { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--red); color: var(--on-red); font-size: 11px; line-height: 18px; text-align: center; }
input.inp, select.sel, textarea.inp { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); min-height: 34px; padding: 6px 10px; font: inherit; font-size: 14px; outline: 0; min-width: 0; }
input.inp:focus, select.sel:focus, textarea.inp:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.banner { margin: 0 16px 10px; padding: 9px 12px; border-radius: 10px; font-size: 13px; background: var(--amber-soft); color: var(--b-amber); flex: none; }

/* two panes: chat list | open chat */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 12px; padding: 0 16px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.list-head { padding: 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.list { overflow-y: auto; flex: 1; }
.row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 10px 12px; }
.row:hover { background: var(--cream); } .row.on { background: var(--cream-2); }
.row .l1 { display: flex; align-items: center; gap: 6px; } .row .who { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.row .l2 { display: flex; align-items: center; gap: 6px; margin-top: 3px; } .row .snip { flex: 1; min-width: 0; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .unread { min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--green); color: #fff; font-size: 11px; font-weight: 700; line-height: 20px; text-align: center; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 9px; white-space: nowrap; }
.p-needs { background: var(--red-soft); color: var(--red); } .p-urgent { background: var(--red); color: var(--on-red); }
.p-team { background: var(--blue-soft); color: var(--b-blue); } .p-ted { background: var(--green-soft); color: var(--b-green); }
.p-role { background: var(--cream-2); color: var(--muted); }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); }

.th-head { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.th-head .name { font-weight: 800; font-size: 15px; } .back { display: none; }
.th-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.summary { padding: 8px 12px; background: var(--red-soft); color: var(--ink); font-size: 13px; border-bottom: 1px solid var(--line); }
.msgs { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--cream); }
.m { max-width: min(78%, 560px); padding: 7px 10px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; box-shadow: var(--shadow-sm); }
.m .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
.m.contact { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; }
.m.ted { align-self: flex-end; background: var(--green-soft); border-top-right-radius: 4px; }
.m.ted.draft { opacity: .75; border: 1px dashed var(--green); }
.m.team { align-self: flex-end; background: var(--blue-soft); border-top-right-radius: 4px; }
.m.template { align-self: center; background: var(--cream-2); font-size: 12.5px; color: var(--muted); }
.m.note { align-self: center; max-width: 92%; background: var(--amber-soft); color: var(--ink); font-size: 12.5px; }
.m.failed { border: 1px solid var(--red); }
.m img { display: block; max-width: 100%; max-height: 320px; border-radius: 8px; margin-bottom: 4px; cursor: zoom-in; }
.day { align-self: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 0 2px; }
.composer { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.composer .rowc { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 42px; max-height: 160px; }
.wnote { font-size: 12.5px; background: var(--amber-soft); color: var(--b-amber); border-radius: 9px; padding: 7px 10px; }
.queued { font-size: 12.5px; background: var(--cream-2); border-radius: 9px; padding: 7px 10px; }
.drawer { padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--cream-2); display: flex; flex-direction: column; gap: 8px; }
.res { display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
.res button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 9px; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--toast); color: var(--toast-ink); padding: 9px 14px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: grid; place-items: center; z-index: 60; } .lightbox img { max-width: 94vw; max-height: 90vh; border-radius: 8px; }
.settings { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.settings label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; }

@media (max-width: 759px) {
  .top { padding: 10px 12px; } .page-title { font-size: 19px; }
  .app { grid-template-columns: minmax(0, 1fr); padding: 0 8px 8px; }
  .app.open .list-pane { display: none; } .app:not(.open) .th-pane { display: none; }
  .back { display: inline-flex; } .m { max-width: 88%; }
  .banner { margin: 0 8px 8px; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand-mark" href="index.html" aria-label="Back to the portal">V</a>
  <div class="page-title">Homestay <em>WhatsApp</em></div>
  <div class="sp"></div>
  <span class="small muted" id="me"></span>
  <button class="btn btn-ghost btn-sm" id="settingsBtn" hidden>Ted settings</button>
</header>
<div class="banner" id="notConnected" hidden>The WhatsApp line isn’t connected yet. Chats will appear here once Emilio’s number is switched over.</div>
<div class="banner" id="errBanner" hidden></div>
<main class="app" id="app">
  <section class="pane list-pane" aria-label="Chats">
    <div class="list-head">
      <div class="chips" role="tablist">
        <button class="chip on" data-f="needs">Needs you<span class="n" id="nNeeds" hidden></span></button>
        <button class="chip" data-f="team">With team</button>
        <button class="chip" data-f="all">All</button>
      </div>
      <input class="inp" id="q" type="search" placeholder="Search name or number" autocomplete="off" />
    </div>
    <div class="list" id="list"><div class="empty">Loading…</div></div>
  </section>
  <section class="pane th-pane" aria-label="Chat" id="th">
    <div class="empty" id="thEmpty">Choose a chat on the left.</div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  'use strict';
  var API = 'https://vanmates-homestay-agent.talatcan.workers.dev/api/inbox';
  var sb = window.supabase.createClient(window.VM_SUPABASE_URL, window.VM_SUPABASE_KEY, { auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false } });
  var S = { me: null, filter: 'needs', q: '', threads: [], open: null, view: null, mediaUrls: {}, sending: false, drawer: null };
  var LANGS = { en: 'English', es: 'Español', ja: '日本語' };

  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 4500); }
  function when(iso) {
    if (!iso) return '';
    var d = new Date(iso), now = new Date();
    if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' });
    if (now - d < 6 * 864e5) return d.toLocaleDateString('en-CA', { weekday: 'short' });
    return d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
  }
  // WhatsApp formatting (and the model's **bold**) shown as it reads on the phone.
  function fmtWa(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\s)\*([^*\n]+)\*(?=\s|[.,!?]|$)/g, '$1<b>$2</b>').replace(/(^|\s)_([^_\n]+)_(?=\s|[.,!?]|$)/g, '$1<i>$2</i>'); }
  function clock(iso) { return new Date(iso).toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' }); }
  function dayLabel(iso) { return new Date(iso).toLocaleDateString('en-CA', { weekday: 'long', month: 'short', day: 'numeric' }); }

  async function token() {
    var sess = (await sb.auth.getSession()).data.session;
    if (!sess) { location.replace('signin.html'); throw new Error('signed out'); }
    return sess.access_token;
  }
  var ERR = {
    no_inbox_access: 'You don’t have access to Homestay WhatsApp. Ask an admin to tick “Homestay WhatsApp” for you in Team.',
    not_team: 'Your login isn’t a portal team member.', unauthorized: 'Your session expired. Reload the page to sign in again.',
    window_closed: 'More than 24 hours since their last message.', line_not_connected: 'The WhatsApp line isn’t connected yet, so nothing can be sent.', not_found: 'That chat no longer exists.',
  };
  async function api(path, opts) {
    opts = opts || {};
    var r = await fetch(API + path, { method: opts.method || 'GET', headers: Object.assign({ Authorization: 'Bearer ' + (await token()) }, opts.body ? { 'Content-Type': 'application/json' } : {}), body: opts.body ? JSON.stringify(opts.body) : undefined });
    if (opts.raw) { if (!r.ok) throw new Error('HTTP ' + r.status); return r; }
    var j = await r.json().catch(function () { return { error: 'failed' }; });
    if (!r.ok) { var e = new Error(ERR[j.error] || j.detail || j.error || ('HTTP ' + r.status)); e.code = j.error; e.status = r.status; e.data = j; throw e; }
    return j;
  }
  function showErr(e) { var b = $('errBanner'); b.textContent = e.message; b.hidden = false; }

  // ---------------------------------------------------------------- chat list
  function statePill(t) {
    if (t.state === 'needs_team') return '<span class="pill ' + (t.priority === 'urgent' ? 'p-urgent' : 'p-needs') + '">' + (t.priority === 'urgent' ? 'Urgent' : 'Needs you') + '</span>';
    if (t.state === 'team') return '<span class="pill p-team">' + esc(t.owner ? 'With ' + t.owner.split(' ')[0] : 'With team') + '</span>';
    return '<span class="pill p-ted">Ted</span>';
  }
  function displayName(t) { return t.name || (t.label || '').replace(/\s*\(.*$/, '') || ('+' + t.wa_id); }
  function renderList() {
    var f = S.filter, list = S.threads.filter(function (t) { return f === 'all' || (f === 'needs' ? t.state === 'needs_team' : t.state === 'team'); });
    var n = S.threads.filter(function (t) { return t.state === 'needs_team'; }).length;
    $('nNeeds').hidden = !n; $('nNeeds').textContent = n;
    if (!list.length) { $('list').innerHTML = '<div class="empty">' + (f === 'needs' ? 'Nothing waiting for you. Ted is handling the rest.' : f === 'team' ? 'No chats taken over right now.' : 'No chats yet.') + '</div>'; return; }
    $('list').innerHTML = list.map(function (t) {
      var pre = t.last_dir === 'in' ? '' : t.last_dir === 'staff_out' ? 'You: ' : t.last_dir === 'ted_out' ? 'Ted: ' : '';
      return '<button class="row' + (S.open === t.wa_id ? ' on' : '') + '" data-wa="' + esc(t.wa_id) + '">' +
        '<div class="l1"><span class="who">' + esc(displayName(t)) + '</span>' + (t.role !== 'unknown' ? '<span class="pill p-role">' + esc(t.role) + '</span>' : '') + '<span class="t">' + esc(when(t.last_at)) + '</span></div>' +
        '<div class="l2"><span class="snip">' + esc(t.state === 'needs_team' && t.summary ? t.summary : pre + t.last_text) + '</span>' + statePill(t) + (t.unread ? '<span class="unread">' + t.unread + '</span>' : '') + '</div></button>';
    }).join('');
  }
  async function loadList() {
    try { S.threads = (await api('/threads' + (S.q ? '?q=' + encodeURIComponent(S.q) : ''))).threads; renderList(); $('errBanner').hidden = true; }
    catch (e) { showErr(e); }
  }

  // ---------------------------------------------------------------- one chat
  async function mediaUrl(wa, id) {
    if (S.mediaUrls[id]) return S.mediaUrls[id];
    var r = await api('/media/' + wa + '/' + id, { raw: true });
    return (S.mediaUrls[id] = URL.createObjectURL(await r.blob()));
  }
  function bubble(it, wa) {
    var cls = it.who, meta = clock(it.at), body = fmtWa(it.text);
    if (it.who === 'ted') { meta = 'Ted · ' + meta + (it.sent ? '' : ' · not sent'); if (!it.sent) cls += ' draft'; }
    if (it.who === 'team') meta = (it.by ? esc(it.by.split('@')[0]) + ' · ' : '') + meta + (it.status ? ' · ' + esc(it.status) : '');
    if (it.status === 'failed') { cls += ' failed'; meta += ' — ' + esc(it.error || 'not delivered'); }
    if (it.who === 'template') { body = 'Template message sent (the 24-hour window was closed)'; }
    if (it.history) meta += ' · from the WhatsApp app';
    var media = '';
    if (it.media_id) {
      media = /^image\//.test(it.mime || '') ? '<img alt="Photo from the chat" data-media="' + esc(it.media_id) + '" />'
        : '<button class="btn btn-ghost btn-sm" data-file="' + esc(it.media_id) + '">Open ' + esc((it.type || 'file').replace('audio', 'voice note')) + '</button><br>';
      body = fmtWa(String(it.text || '').replace(/^\[[^\]]*\]\s*/, ''));
    }
    return '<div class="m ' + cls + '">' + media + body + '<span class="meta">' + meta + '</span></div>';
  }
  function renderThread() {
    var v = S.view, th = $('th');
    if (!v) { th.innerHTML = '<div class="empty">Choose a chat on the left.</div>'; return; }
    var c = v.contact, name = c.name || c.label.replace(/\s*\(.*$/, '');
    var stateTxt = v.state === 'team' ? 'You have this chat: Ted is quiet until you give it back.' : v.state === 'needs_team' ? 'Ted handed this to the team.' : 'Ted is handling this chat.';
    var html = '<div class="th-head"><button class="btn btn-ghost btn-sm back" id="back" aria-label="Back to chats">‹ Chats</button>' +
      '<div><div class="name">' + esc(name) + '</div><div class="small muted">+' + esc(c.wa_id) + ' · ' + esc(c.role === 'unknown' ? 'not linked to a portal record' : c.role === 'host' ? 'Host' : 'Student') + '</div></div>' +
      '<div class="th-actions">' +
        (v.state === 'team' ? '<button class="btn btn-green btn-sm" id="giveback">Give back to Ted</button>' : '<button class="btn btn-ghost btn-sm" id="takeover">Take over</button>') +
        '<button class="btn btn-ghost btn-sm" id="linkBtn">' + (c.role === 'unknown' ? 'Link to host/student' : 'Change link') + '</button>' +
      '</div></div>';
    if (S.drawer === 'link') html += '<div class="drawer"><input class="inp" id="linkQ" placeholder="Search a host or student name" autocomplete="off" /><div class="res" id="linkRes"></div></div>';
    if (S.drawer === 'giveback') html += '<div class="drawer"><div class="small">Ted answers this chat again. Any open handoffs here are marked done. Optional note for Ted (what you agreed, what to tell them):</div><textarea class="inp" id="gbNote" rows="2"></textarea><div><button class="btn btn-primary btn-sm" id="gbGo">Give back</button> <button class="btn btn-ghost btn-sm" id="gbCancel">Cancel</button></div></div>';
    if (v.state === 'needs_team') html += '<div class="summary"><b>Why Ted handed off:</b> ' + v.cases.map(function (k) { return esc(k.summary || k.case_type) + (k.decision_needed ? ' <i>Decision: ' + esc(k.decision_needed) + '</i>' : ''); }).join('<br>') + '</div>';
    html += '<div class="msgs" id="msgs">';
    var lastDay = '';
    v.items.forEach(function (it) { var d = dayLabel(it.at); if (d !== lastDay) { html += '<div class="day">' + esc(d) + '</div>'; lastDay = d; } html += bubble(it, c.wa_id); });
    if (!v.items.length) html += '<div class="empty">No messages yet.</div>';
    html += '</div><div class="composer">';
    html += '<div class="small muted">' + esc(stateTxt) + (v.ted_replies ? '' : ' (Ted’s replies are not being sent on this line right now.)') + '</div>';
    (v.queued || []).forEach(function (q) { html += '<div class="queued">Waiting to send when they reply: “' + esc(q.text) + '” <button class="btn btn-ghost btn-sm" data-cancel="' + esc(q.id) + '">Cancel</button></div>'; });
    if (!v.window.open) html += '<div class="wnote">It’s been more than 24 hours since their last message, so WhatsApp only allows a short template first. Pick their language: they get “our homestay team has an update”, and your message goes out as soon as they reply.</div>';
    html += '<div class="rowc"><textarea class="inp" id="txt" rows="1" placeholder="' + (v.window.open ? 'Write a reply (sent from the homestay number)' : 'Write the reply to send after they answer') + '"></textarea>' +
      (v.window.open ? '' : '<select class="sel" id="lang" aria-label="Template language">' + v.template_langs.map(function (l) { return '<option value="' + l + '">' + (LANGS[l] || l) + '</option>'; }).join('') + '</select>') +
      '<button class="btn btn-primary" id="send">Send</button></div></div>';
    th.innerHTML = html;
    var msgs = $('msgs'); msgs.scrollTop = msgs.scrollHeight;
    msgs.querySelectorAll('img[data-media]').forEach(function (img) {
      mediaUrl(c.wa_id, img.dataset.media).then(function (u) { img.src = u; img.onload = function () { msgs.scrollTop = msgs.scrollHeight; }; }).catch(function () { img.replaceWith(document.createTextNode('[photo could not be loaded]')); });
    });
    var txt = $('txt'); if (S.draft && S.draft.wa === c.wa_id) txt.value = S.draft.text;
    txt.addEventListener('input', function () { S.draft = { wa: c.wa_id, text: txt.value }; txt.style.height = 'auto'; txt.style.height = Math.min(160, txt.scrollHeight) + 'px'; });
    txt.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); } });
    if (S.drawer === 'link') { $('linkQ').focus(); $('linkQ').addEventListener('input', searchLink); }
  }
  async function openThread(wa, keepDrawer) {
    if (S.open !== wa) { S.drawer = null; S.draft = null; }
    var switching = S.open !== wa || !S.view;
    S.open = wa; $('app').classList.add('open');
    if (switching) { S.view = null; $('th').innerHTML = '<div class="empty">Loading…</div>'; renderList(); }
    try { history.replaceState(null, '', 'whatsapp.html?c=' + wa); } catch (e) {}
    try { S.view = await api('/thread/' + wa); renderThread(); renderList(); }
    catch (e) { showErr(e); }
  }
  async function act(path, body, msg) {
    try { await api('/thread/' + S.open + '/' + path, { method: 'POST', body: body || {} }); if (msg) toast(msg); S.drawer = null; await openThread(S.open); loadList(); }
    catch (e) { toast(e.message); }
  }
  async function send() {
    if (S.sending) return;
    var text = $('txt').value.trim(); if (!text) return;
    var body = { text: text }; if (!S.view.window.open) body.lang = $('lang').value;
    S.sending = true; $('send').disabled = true;
    try {
      var r = await api('/thread/' + S.open + '/reply', { method: 'POST', body: body });
      S.draft = null; toast(r.queued ? 'Template sent. Your reply goes out when they answer.' : 'Sent.');
      await openThread(S.open); loadList();
    } catch (e) { toast(e.message); }
    finally { S.sending = false; var b = $('send'); if (b) b.disabled = false; }
  }
  var linkT = null;
  function searchLink() {
    clearTimeout(linkT);
    linkT = setTimeout(async function () {
      var q = $('linkQ').value.trim(); if (q.length < 2) { $('linkRes').innerHTML = ''; return; }
      try {
        var r = (await api('/directory?q=' + encodeURIComponent(q))).results;
        $('linkRes').innerHTML = r.length ? r.map(function (x) { return '<button data-link=\'' + esc(JSON.stringify(x)) + '\'>' + esc(x.label) + '</button>'; }).join('') : '<div class="small muted">No match.</div>';
      } catch (e) { $('linkRes').innerHTML = '<div class="small muted">' + esc(e.message) + '</div>'; }
    }, 250);
  }

  // ---------------------------------------------------------------- Ted settings (admins)
  function renderSettings() {
    var m = S.me;
    $('th').innerHTML = '<div class="th-head"><button class="btn btn-ghost btn-sm back" id="back">‹ Chats</button><div class="name">Ted on WhatsApp</div></div>' +
      '<div class="settings"><label>Who Ted replies to<select class="sel" id="setMode">' +
      [['off', 'Nobody (Ted drafts only, nothing is sent)'], ['allowlist', 'Test numbers only'], ['known', 'Known hosts and students (linked to the portal)'], ['all', 'Everyone']].map(function (o) { return '<option value="' + o[0] + '"' + (m.wa_send === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      '</select></label><label>Test numbers (with country code, comma-separated)<input class="inp" id="setAllow" value="' + esc(m.wa_send_allow || '') + '" placeholder="16045551234, 16475551234" /></label>' +
      '<label>Alert emails (handoffs and new messages while you have a chat)<input class="inp" id="setAlert" value="' + esc(m.alert_to || '') + '" /></label>' +
      '<div><button class="btn btn-primary" id="setSave">Save</button></div></div>';
    $('app').classList.add('open'); S.open = null; renderList();
  }

  // ---------------------------------------------------------------- events
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, img'); if (!t) return;
    if (t.dataset.wa) return openThread(t.dataset.wa);
    if (t.dataset.f) { S.filter = t.dataset.f; document.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c === t); }); return renderList(); }
    if (t.id === 'back') { $('app').classList.remove('open'); S.open = null; S.view = null; try { history.replaceState(null, '', 'whatsapp.html'); } catch (e2) {} return renderList(); }
    if (t.id === 'send') return send();
    if (t.id === 'takeover') return act('takeover', {}, 'You have this chat. Ted stays quiet.');
    if (t.id === 'giveback') { S.drawer = 'giveback'; return renderThread(); }
    if (t.id === 'gbCancel') { S.drawer = null; return renderThread(); }
    if (t.id === 'gbGo') return act('giveback', { note: $('gbNote').value }, 'Ted has this chat again.');
    if (t.id === 'linkBtn') { S.drawer = S.drawer === 'link' ? null : 'link'; return renderThread(); }
    if (t.dataset.link) { var x = JSON.parse(t.dataset.link); return act('link', x, 'Linked to ' + x.label + '.'); }
    if (t.dataset.cancel) return act('cancel_queued', { id: t.dataset.cancel }, 'Cancelled.');
    if (t.dataset.file) { var w = window.open('', '_blank'); return mediaUrl(S.open, t.dataset.file).then(function (u) { if (w) w.location = u; }).catch(function (er) { if (w) w.close(); toast(er.message); }); }
    if (t.dataset.media && t.src) { var lb = document.createElement('div'); lb.className = 'lightbox'; lb.innerHTML = '<img alt="" src="' + t.src + '">'; lb.onclick = function () { lb.remove(); }; return document.body.appendChild(lb); }
    if (t.id === 'settingsBtn') return renderSettings();
    if (t.id === 'setSave') {
      return api('/settings', { method: 'POST', body: { wa_send: $('setMode').value, wa_send_allow: $('setAllow').value, alert_to: $('setAlert').value } })
        .then(async function () { S.me = await api('/me'); toast('Saved.'); }).catch(function (er) { toast(er.message); });
    }
  });
  var qT = null;
  $('q').addEventListener('input', function () { clearTimeout(qT); qT = setTimeout(function () { S.q = $('q').value.trim(); if (S.q) { S.filter = 'all'; document.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c.dataset.f === 'all'); }); } loadList(); }, 250); });

  async function poll() {
    if (document.hidden) return;
    await loadList();
    var typing = document.activeElement && (document.activeElement.id === 'txt' || document.activeElement.id === 'linkQ' || document.activeElement.id === 'gbNote');
    if (S.open && !typing && !S.drawer) {
      try { var v = await api('/thread/' + S.open); if (JSON.stringify(v.items) !== JSON.stringify(S.view && S.view.items) || v.state !== (S.view && S.view.state)) { S.view = v; renderThread(); } } catch (e) {}
    }
  }

  (async function boot() {
    try {
      S.me = await api('/me');
      $('me').textContent = S.me.name;
      $('notConnected').hidden = !!S.me.connected;
      $('settingsBtn').hidden = !S.me.admin;
      await loadList();
      var c = new URLSearchParams(location.search).get('c');
      if (c) await openThread(c.replace(/\D/g, ''));
      else if (S.threads.length && !S.threads.some(function (t) { return t.state === 'needs_team'; })) { S.filter = 'all'; document.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x.dataset.f === 'all'); }); renderList(); }
      setInterval(poll, 10000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
    } catch (e) {
      showErr(e);
      $('list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    }
  })();
})();
</script>
</body>
</html>
