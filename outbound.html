<script>
// Same sign-in gate as lu.html. Access is decided by the vanmates-outbound Worker (Outbound → Settings roles).
(function () {
  var ok = false;
  try {
    var s = JSON.parse(localStorage.getItem('sb-recbwmihyinlgxnymcmc-auth-token') || 'null');
    ok = !!(s && s.access_token && (!s.expires_at || s.expires_at * 1000 > Date.now()));
  } catch (e) { ok = false; }
  if (!ok) {
    try { sessionStorage.setItem('vm_next_path', 'outbound.html'); } catch (e) {}
    location.replace('signin.html');

})();

<style>

  --cream:#FAF5ED; --cream-2:#F4ECDD; --red:#B94A3F; --red-dark:#A13A30; --red-soft:#F3DDD8; --ink:#2B211A; --muted:#8A7B6C;

}
:root[data-theme="dark"]{

  --green:#85A88E; --green-soft:#2C3E32; --amber:#E5C896; --amber-soft:#4A3C20; --blue:#6F9DC4; --blue-soft:#28394A; --surface:#26201B;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.30); --b-green:#B9D3C0; --b-amber:#F0D9AE; --b-blue:#B7D0E6; --scrim:rgba(0,0,0,.55); --toast:#F4ECDD; --toast-ink:#1F1A16;
}

  display: inline-flex; align-items: center; gap: 6px; }

  border-radius: 999px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: .2s ease; max-width: calc(100vw - 32px); z-index: 80; }

.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }

.h2 { font-family: var(--serif); font-size: 18px; font-weight: 700; margin: 22px 2px 10px; }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--cream); }
.score { display: inline-flex; min-width: 34px; justify-content: center; padding: 2px 7px; border-radius: 999px; font-weight: 800; font-size: 12px; }
.score.high { background: var(--green-soft); color: var(--b-green); }
.score.medium { background: var(--amber-soft); color: var(--b-amber); }
.score.research, .score.none { background: var(--cream-2); color: var(--muted); }
.st { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; background: var(--cream-2); color: var(--muted); }
.st.ok { background: var(--green-soft); color: var(--b-green); }
.st.warn { background: var(--amber-soft); color: var(--b-amber); }

.st.info { background: var(--blue-soft); color: var(--b-blue); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; align-items: end; }
.form label, .fl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
.chk { display: flex; flex-direction: row !important; align-items: flex-start; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink) !important; }
.chk input { margin-top: 3px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--cream); z-index: 60; overflow-y: auto; box-shadow: -8px 0 30px rgba(0,0,0,.15);
  padding: 14px; padding-top: max(14px, env(safe-area-inset-top)); }
.drawer .hd { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
.drawer h2 { font-family: var(--serif); margin: 0; font-size: 22px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.sec { margin-top: 12px; }
.msg { padding: 10px 12px; margin-bottom: 8px; border-left: 3px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.in { border-left-color: var(--green); }
.msg.out { border-left-color: var(--blue); }
.msg .m { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; white-space: normal; }
.ev { font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.ev:last-child { border-bottom: 0; }
.bar { height: 22px; background: var(--red-soft); border-radius: 6px; position: relative; min-width: 2px; }
.bar > span { position: absolute; left: 8px; top: 2px; font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.funnel td:first-child { width: 190px; white-space: nowrap; font-weight: 600; }
.notif { position: relative; }
.notif-panel { position: absolute; right: 0; top: 38px; width: min(380px, 92vw); max-height: 60vh; overflow-y: auto; z-index: 40; padding: 8px; }
.notif-item { padding: 8px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; }
.notif-item:last-child { border-bottom: 0; }
.notif-item.unread { background: var(--amber-soft); border-radius: 8px; }
.banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; background: var(--amber-soft); color: var(--b-amber); }
.banner.red { background: var(--red-soft); color: var(--red); }
.qcard { padding: 16px; margin-bottom: 14px; }
.qhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.qhead h3 { font-family: var(--serif); font-size: 19px; margin: 0; overflow-wrap: anywhere; }
.qmeta { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; margin: 10px 0; }
.qmeta dt { color: var(--muted); font-weight: 600; }
.qmeta dd { margin: 0; overflow-wrap: anywhere; }
.qchecks { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: var(--cream-2); border-radius: 10px; margin-bottom: 10px; }

.qdiff pre { white-space: pre-wrap; font: inherit; font-size: 12.5px; margin: 4px 0 0; padding: 8px 10px; background: var(--cream-2); border-radius: 8px; max-height: 320px; overflow: auto; }

@media (max-width: 720px) { .qdiff { grid-template-columns: 1fr; } }

  .kv { grid-template-columns: 1fr; }
  .tbl .hide-sm { display: none; }

}
</style>

<body>
<div class="top">
  <a class="brand-mark" href="index.html" aria-label="Back to the portal">V</a>
  <span class="page-title">Out<em>bound</em></span>
  <span class="pill" id="modePill" hidden></span>
  <span class="sp"></span>
  <div class="notif">
    <button type="button" class="btn btn-ghost" id="bell" hidden aria-label="Notifications">🔔 <span class="tbadge" id="nUnread" hidden></span></button>
    <div class="card notif-panel" id="notifPanel" hidden></div>
  </div>
  <nav class="tabs" id="tabs" hidden aria-label="Sections">
    <button type="button" class="tab" data-tab="mine" id="mineTab" hidden>My outreach</button>
    <button type="button" class="tab" data-tab="queue" id="queueTab" hidden>To approve <span class="tbadge" id="nQueue" hidden></span></button>
    <button type="button" class="tab on" data-tab="dashboard">Dashboard</button>
    <button type="button" class="tab" data-tab="discover">Discover leads</button>
    <button type="button" class="tab" data-tab="prospects">Prospects</button>
    <button type="button" class="tab" data-tab="campaigns">Campaigns</button>
    <button type="button" class="tab" data-tab="followups">Follow-ups <span class="tbadge" id="nApprove" hidden></span></button>
    <button type="button" class="tab" data-tab="analytics">Analytics</button>
    <button type="button" class="tab" data-tab="settings">Settings</button>
  </nav>
</div>

<main class="wrap" id="app"><div class="empty">Loading…</div></main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Prospect"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  'use strict';
  var API = 'https://outbound.vanmates.com/api/v1/outbound';
  var sb = window.supabase.createClient(window.VM_SUPABASE_URL, window.VM_SUPABASE_KEY,
    { auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false } });
  var S = { tab: 'dashboard', me: null, cats: [], filters: { mine: true, sort: 'score' }, offset: 0, drawer: null, dtab: 'overview', busy: false, settings: null };
  var LIFE = { discovered: 'Discovered', qualified: 'Qualified', approved: 'Approved', contacted: 'Contacted', replied: 'Replied', meeting: 'Meeting', partner: 'Partner', not_interested: 'Not interested', disqualified: 'Disqualified' };
  var STATE_CLS = { DRAFT: '', PENDING_APPROVAL: 'warn', READY_TO_SEND: 'info', ACTIVE: 'ok', REPLIED: 'ok', UNSUBSCRIBED: 'bad', BOUNCED: 'bad', PAUSED: 'warn', STOPPED: '', COMPLETED: '' };
  var STATE_LABEL = { DRAFT: 'Drafting', PENDING_APPROVAL: 'Awaiting approval', READY_TO_SEND: 'Approved, sending', ACTIVE: 'Active', REPLIED: 'Replied', UNSUBSCRIBED: 'Unsubscribed', BOUNCED: 'Bounced', PAUSED: 'Paused', STOPPED: 'Stopped', COMPLETED: 'Completed' };
  var BASES = [['conspicuous_publication', 'Conspicuously published business address (CASL 10(9)(b))'], ['express_consent', 'Express consent'], ['existing_business_relationship', 'Existing business relationship (purchase: 2 years, inquiry: 6 months)'], ['referral', 'Referral (introduced by someone who knows both sides)']];

  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 5000); }
  function when(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  function day(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }); }
  function money(c) { return '$' + Math.round((c || 0) / 100).toLocaleString('en-CA'); }
  function scoreHtml(p) { if (p.ai_score === null || p.ai_score === undefined) return '<span class="score none">–</span>'; return '<span class="score ' + esc(p.priority || 'research') + '">' + esc(p.ai_score) + '</span>'; }
  function st(cls, t) { return '<span class="st ' + (cls || '') + '">' + esc(t) + '</span>'; }
  function isMgr() { return S.me && (S.me.role === 'admin' || S.me.role === 'manager'); }
  function canWrite() { return S.me && S.me.role !== 'viewer'; }
  function link(u, label) { return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(label || u) + '</a>' : ''; }

  async function token() { var s = await sb.auth.getSession(); return s && s.data && s.data.session ? s.data.session.access_token : ''; }
  async function call(method, path, body) {
    var t = await token();
    if (!t) { location.replace('signin.html'); throw new Error('Signed out'); }
    var r = await fetch(API + path, { method: method, headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    var data = null; try { data = await r.json(); } catch (e) {}
    if (!r.ok) { var err = new Error((data && data.error && data.error.message) || ('Error ' + r.status)); err.code = data && data.error && data.error.code; err.status = r.status; err.cid = data && data.error && data.error.correlation_id; throw err; }
    return data;
  }
  function fail(e) { toast(e.message + (e.cid && e.status >= 500 ? ' (' + e.cid.slice(0, 8) + ')' : '')); }

  // ---------------- boot + chrome ----------------
  async function boot() {
    try { S.tab = localStorage.getItem('vm-ob-tab') || 'dashboard'; } catch (e) {}
    var m = /^#p=([0-9a-f-]{36})/.exec(location.hash);
    try { S.me = await call('GET', '/me'); }
    catch (e) {
      var msg = e.code === 'NO_OUTBOUND_ACCESS' ? e.message : e.status === 403 ? 'Outbound is for the sales team. Ask an admin.' : 'The Outbound service is not reachable yet (' + esc(e.message) + ').';
      $('app').innerHTML = '<div class="card lock"><h1>' + (e.status === 403 ? 'No access' : 'Not available') + '</h1><p class="muted">' + esc(msg) + '</p><a class="btn btn-ghost" href="index.html">Back to the portal</a></div>';
      return;
    }
    S.filters.mine = S.me.role === 'rep';
    try { if (S.me.role === 'rep' && !localStorage.getItem('vm-ob-tab-mine1')) { S.tab = 'mine'; localStorage.setItem('vm-ob-tab-mine1', '1'); } } catch (e) {}
    try { S.cats = (await call('GET', '/categories')).categories || []; } catch (e) {}
    $('tabs').hidden = false; $('bell').hidden = false;
    chrome();
    render();
    if (isMgr() && S.tab !== 'queue') call('GET', '/queue').then(function (r) { qBadge((r.cards || []).filter(function (c) { return c.contacts.some(function (x) { return x.needs_manager; }); }).length + (r.strategy_changes || []).length); }).catch(function () {});
    if (m) openProspect(m[1]);
    setInterval(refreshMe, 60000);
  }
  function chrome() {
    var p = $('modePill');
    p.hidden = false;
    if (S.me.sending_off) { p.className = 'pill red'; p.textContent = 'Sending switched off'; }
    else if (S.me.send_mode !== 'live') { p.className = 'pill'; p.textContent = 'Test mode: only test recipients get email'; }
    else { p.className = 'pill green'; p.textContent = 'Live'; }
    $('nUnread').hidden = !S.me.unread; $('nUnread').textContent = S.me.unread;
    $('queueTab').hidden = !isMgr();
    $('mineTab').hidden = !(isMgr() || S.me.role === 'rep');
    if (S.tab === 'queue' && !isMgr()) S.tab = S.me.role === 'rep' ? 'mine' : 'dashboard';
    document.querySelectorAll('#tabs .tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === S.tab); });
  }
  async function refreshMe() { try { S.me = await call('GET', '/me'); chrome(); } catch (e) {} }

  function render() {

    if (b.hasAttribute('data-qretry')) return qDraft(pid, true);
    if (b.hasAttribute('data-qesc')) { var row = el.querySelector('[data-qescrow]'); row.hidden = !row.hidden; if (!row.hidden) row.querySelector('input').focus(); return; }
    if (b.hasAttribute('data-qescgo')) {
      var note = el.querySelector('[data-qnote]').value.trim();
      if (!note) { toast('Say why, so the manager can decide'); return; }
      try { await call('POST', '/queue/escalate', { contact_id: c.id, note: note }); }
      catch (e) { return fail(e); }
      c.compliance = Object.assign({}, c.compliance, { checks: Object.assign({}, (c.compliance || {}).checks, { escalated_by: S.me.name, escalated_note: note }) });
      c.needs_manager = 'Sent to a manager';
      toast('Sent to your manager'); return qRedraw(pid);
    }
    if (S.busy) return;
    if (b.hasAttribute('data-qreject')) {
      if (!confirmTwice(b, 'Press again: never contact ' + (c.email || 'them'))) return;
      S.busy = true;
      try { await call('POST', '/contacts/' + c.id + '/compliance', { decision: 'reject' }); toast('Rejected: ' + c.email + ' will not be contacted'); }
      catch (e) { fail(e); return; } finally { S.busy = false; }
      card.contacts = card.contacts.filter(function (x) { return x.id !== c.id; });
      if (!card.contacts.length) return qRemove(pid);
      card.contact_id = card.contacts[0].id; qRedraw(pid); return qDraft(pid);
    }
    if (b.hasAttribute('data-qapprove')) {
      if (!confirmTwice(b, S.me.send_mode === 'live' ? 'Press again to email ' + c.email : 'Press again to send')) return;
      S.busy = true; b.disabled = true;
      var g = function (k) { var x = el.querySelector('[data-qchk="' + k + '"]'); return x ? x.checked : true; };
      var comp = c.compliance || {};
      try {
        var r = await call('POST', '/queue/approve', {
          enrollment_id: c.enrollment.id, contact_id: c.id, subject: el.querySelector('[data-qsubj]').value, body: el.querySelector('[data-qbody]').value,
          basis_evidence: comp.lawful_basis === 'conspicuous_publication' && comp.basis_evidence ? comp.basis_evidence : 'Published on ' + (comp.evidence_url || c.source_url || card.prospect.website_url || 'their website') + ' (checked by ' + S.me.name + ')',
          evidence_url: comp.evidence_url || c.source_url,
          checks: { published_on_own_site: g('own'), role_relevant: g('role'), no_unsolicited_statement: g('nus') } });
        toast(r.sent ? 'Sent to ' + c.email + ' from ' + (card.prospect.rep_name || 'the rep') + '\'s Gmail' : r.scheduled_for ? 'Approved: goes to ' + c.email + ' ' + when(r.scheduled_for) + ' (their business hours)' : 'Approved, but not sent: ' + ((r.verdict && r.verdict.message) || 'see the prospect'));
        qRemove(pid);
      } catch (e) {
        fail(e);
        if (/^Contact approved/.test(e.message)) { c.compliance = Object.assign({}, comp, { status: 'approved' }); qRedraw(pid); }
        else b.disabled = false;
      } finally { S.busy = false; }
    }
  }

  async function act(fn, ok) { if (S.busy) return; S.busy = true; try { await fn(); if (ok) toast(ok); await reloadProspect(); } catch (e) { fail(e); } finally { S.busy = false; } }

  async function enrollmentAction(eid, a, card) {
    var p = S.drawer.prospect;
    var subj = card.querySelector('[data-ef="subject"]'), body = card.querySelector('[data-ef="body"]');
    if (a === 'approve') {
      if (!confirmTwice(card.querySelector('[data-eact="approve"]'), 'Press again to send')) return;
      return act(async function () {
        var r = await call('POST', '/enrollments/' + eid + '/approve', { subject: subj.value, body: body.value });
        toast(r.sent ? 'Sent from your Gmail. Follow-ups are scheduled.' : 'Approved. It goes out ' + when(r.scheduled_for) + ' (their business hours).');
      });
    }
    if (a === 'save') return act(function () { return call('PATCH', '/enrollments/' + eid + '/draft', { subject: subj.value, body: body.value }); }, 'Draft saved');
    if (a === 'redraft') return act(function () { return call('POST', '/enrollments/' + eid + '/redraft'); }, 'New draft written');
    if (a === 'pause') return act(function () { return call('POST', '/enrollments/' + eid + '/pause', { reason: 'Paused by ' + S.me.name }); }, 'Paused');
    if (a === 'resume') return act(function () { return call('POST', '/enrollments/' + eid + '/resume', {}); }, 'Resumed');
    if (a === 'resume-sent') return act(function () { return call('POST', '/enrollments/' + eid + '/resume', { unknown_step: 'sent' }); }, 'Resumed');
    if (a === 'resume-notsent') return act(function () { return call('POST', '/enrollments/' + eid + '/resume', { unknown_step: 'not_sent' }); }, 'It will be sent again in the next window');
    if (a === 'stop') { if (!confirmTwice(card.querySelector('[data-eact="stop"]'), 'Press again to stop')) return; return act(function () { return call('POST', '/enrollments/' + eid + '/stop', { reason: 'Stopped by ' + S.me.name }); }, 'Stopped'); }
    if (a === 'messages') {
      try {
        var m = (await call('GET', '/enrollments/' + eid + '/messages')).messages || [];
        card.querySelector('[data-msgs]').innerHTML = '<div class="sec">' + (m.length ? m.map(function (x) {
          return '<div class="msg ' + (x.direction === 'in' ? 'in' : 'out') + '"><div class="m">' + (x.direction === 'in' ? 'From ' + esc(x.from_email) : 'Sent by ' + esc(x.from_email)) + ' · ' + esc(when(x.sent_at || x.received_at)) + (x.automatic ? ' · automatic' : '') + ' · ' + esc(x.subject || '') + '</div>' + esc(x.body_text || '') + '</div>';
        }).join('') : '<p class="muted">No emails yet.</p>') + '</div>';
      } catch (e) { fail(e); }
    }
  }

  function confirmTwice(b, label) {
    if (!b) return true;
    if (b.getAttribute('data-armed') === '1') return true;
    var old = b.textContent; b.setAttribute('data-armed', '1'); b.textContent = label;
    setTimeout(function () { if (b.isConnected) { b.removeAttribute('data-armed'); b.textContent = old; } }, 5000);
    return false;
  }

  async function renderAnalytics() {
    var a = await call('GET', '/analytics');
    var max = Math.max.apply(null, a.funnel.map(function (f) { return f.n; }).concat([1]));
    var h = '<div class="h2" style="margin-top:4px">Funnel</div><div class="card pad"><table class="tbl funnel"><tbody>' + a.funnel.map(function (f) {
      return '<tr><td>' + esc(f.stage) + '</td><td><div class="bar" style="width:' + Math.max(1, f.n / max * 100) + '%"><span>' + esc(f.n) + '</span></div></td></tr>';
    }).join('') + '</tbody></table><p class="small muted">Bookings and revenue count each partner booking once, only for partners converted through Outbound and only after the conversion date. Credit stays with the rep at conversion.</p></div>';
    h += '<div class="h2">By sales rep</div><div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Rep</th><th>Prospects</th><th>Emails sent</th><th>Contacted</th><th>Replies</th><th>Positive</th><th>Partners</th><th>Bookings</th><th>Revenue</th></tr></thead><tbody>' +
      (a.reps.length ? a.reps.map(function (r) { return '<tr><td><b>' + esc(r.name) + '</b></td><td>' + r.prospects + '</td><td>' + r.emails_sent + '</td><td>' + r.contacted + '</td><td>' + r.replies + '</td><td>' + r.positive + '</td><td>' + r.partners + '</td><td>' + r.bookings + '</td><td>' + money(r.revenue_cents) + '</td></tr>'; }).join('') : '<tr><td colspan="9" class="empty">No reps.</td></tr>') + '</tbody></table></div>';
    h += '<div class="h2">By campaign</div><div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Campaign</th><th>Enrolled</th><th>Contacted</th><th>Replies</th><th>Reply rate</th><th>Bounced</th><th>Unsubscribed</th></tr></thead><tbody>' +
      (a.campaigns.length ? a.campaigns.map(function (c) { return '<tr><td class="small">' + esc(c.campaign_id.slice(0, 8)) + '</td><td>' + c.enrolled + '</td><td>' + c.contacted + '</td><td>' + c.replies + '</td><td>' + c.reply_rate + '%</td><td>' + c.bounced + '</td><td>' + c.unsubscribed + '</td></tr>'; }).join('') : '<tr><td colspan="7" class="empty">No sequences yet.</td></tr>') + '</tbody></table></div>';
    $('app').innerHTML = h;
  }

  // ---------------- settings ----------------
  async function renderSettings() {
    var r = await call('GET', '/settings'), s = r.settings, team = r.team || [];
    S.settings = s;
    var adm = S.me.role === 'admin', mgr = isMgr(), ro = mgr ? '' : ' disabled';
    var h = '';
    h += '<div class="card pad"><b>Sending</b><p class="note" style="margin-top:6px">' + (r.secrets.sending_off ? 'The SENDING kill switch is off on the server: nothing is sent.' : s.send_mode === 'live' ? 'Live: approved emails go to real prospects.' : 'Test mode: emails only go to the test recipients below, so the whole flow can be tried safely. Going live needs the CASL legal review first.') + '</p>' +
      '<div class="form"><label style="grid-column:1/-1">Test recipients (one per line)<textarea class="inp" id="sTest"' + ro + '>' + esc((s.test_recipients || []).join('\n')) + '</textarea></label>' +
      '<label style="grid-column:1/-1">Sender identification in every email (CASL: name, mailing address)<input class="inp" id="sAddr" placeholder="Legal business name, street, city, province, postal code" value="' + esc(s.sender_address) + '"' + ro + '></label></div>' +
      (adm ? '<div class="actions">' + (s.send_mode === 'live' ? '<button type="button" class="btn btn-warn" id="goTest">Back to test mode</button>' : '<button type="button" class="btn btn-primary" id="goLive">Go live…</button>') + '</div>' : '') + '</div>';
    h += '<div class="h2">Sales team</div><div class="card pad"><p class="note">Reps send from their own Gmail (connected in the portal for lead emails, with read access so replies are seen). City preference steers automatic assignment; workload and round robin decide the rest.</p>' +
      '<div id="repRows">' + (s.reps || []).map(function (rep, i) { return repRow(rep, team, i, adm); }).join('') + '</div>' +
      (adm ? '<div class="actions"><button type="button" class="btn btn-ghost" id="addRep">+ Add rep</button></div>' : '') +
      '<div class="form" style="margin-top:12px"><label>Sales managers (approve compliance, campaigns, discovery)<select class="sel" id="sMgr" multiple size="4"' + (adm ? '' : ' disabled') + '>' + team.map(function (t) { return '<option value="' + esc(t.id) + '"' + ((s.managers || []).indexOf(t.id) >= 0 ? ' selected' : '') + '>' + esc(t.name || t.email) + '</option>'; }).join('') + '</select></label>' +
      '<label>Read-only viewers<select class="sel" id="sView" multiple size="4"' + (adm ? '' : ' disabled') + '>' + team.map(function (t) { return '<option value="' + esc(t.id) + '"' + ((s.viewers || []).indexOf(t.id) >= 0 ? ' selected' : '') + '>' + esc(t.name || t.email) + '</option>'; }).join('') + '</select></label></div>' +
      '<p class="small muted">Admins always have full access.</p><div id="mailboxes" class="small"></div></div>';
    h += '<div class="h2">Discovery</div><div class="card pad"><div class="form">' +
      '<label class="chk"><input type="checkbox" id="sDaily"' + (s.daily_discovery ? ' checked' : '') + ro + '> Run discovery automatically every day (8:00 Vancouver)</label>' +
      '<label class="chk"><input type="checkbox" id="sAuto"' + (s.auto_research ? ' checked' : '') + ro + '> Research and score new prospects automatically</label>' +
      '<label>Max results per search<input class="inp" type="number" id="sMax" value="' + esc(s.max_results_per_query) + '"' + ro + '></label>' +
      '<label>Brave requests per day<input class="inp" type="number" id="sDay" value="' + esc(s.daily_request_budget) + '"' + ro + '></label>' +
      '<label>Brave requests per month<input class="inp" type="number" id="sMon" value="' + esc(s.monthly_request_budget) + '"' + ro + '></label></div>' +
      '<p class="small muted">Used: ' + esc(r.budget.today) + ' today, ' + esc(r.budget.month) + ' this month. Brave key: ' + (r.secrets.brave ? 'set' : '<b>not set</b>') + ' · AI: ' + (r.secrets.ai ? 'on' : '<b>off</b>') + '</p>' +
      '<div class="h2" style="font-size:15px">Cities</div><table class="tbl"><thead><tr><th>On</th><th>City</th><th>Province</th><th>Time zone</th></tr></thead><tbody id="cityRows">' + (s.cities || []).map(cityRow).join('') + '</tbody></table>' +
      (mgr ? '<div class="actions"><button type="button" class="btn btn-ghost" id="addCity">+ Add city</button></div>' : '') +
      '<div class="h2" style="font-size:15px">Categories</div>' + S.cats.map(function (c) {
        return '<div class="form" data-cat="' + esc(c.id) + '" style="margin-bottom:10px"><label>' + esc(c.name) + ' ' + st(c.is_active ? 'ok' : '', c.is_active ? 'active' : 'off') + '<textarea class="inp" data-catq' + (adm ? '' : ' disabled') + '>' + esc((c.search_queries || []).join('\n')) + '</textarea></label>' +
          (adm ? '<label class="chk"><input type="checkbox" data-cata' + (c.is_active ? ' checked' : '') + '> Active</label>' : '') + '</div>';
      }).join('') + (adm ? '<div class="actions"><button type="button" class="btn btn-ghost" id="saveCats">Save categories</button><button type="button" class="btn btn-ghost" id="addCat">+ New category</button></div>' : '') + '</div>';
    if (mgr) h += '<div class="actions" style="margin-top:14px"><button type="button" class="btn btn-primary" id="saveSettings">Save settings</button></div>';
    if (adm) h += '<div class="h2">Failed background jobs</div><div class="card pad" id="failedJobs"><span class="muted">Loading…</span></div><div class="h2">Audit log</div><div class="card pad" id="auditLog"><span class="muted">Loading…</span></div>';
    $('app').innerHTML = h;
    S.team = team;
    call('GET', '/mailboxes').then(function (m) {
      $('mailboxes').innerHTML = '<b>Mailboxes</b>: ' + (m.mailboxes || []).map(function (x) { return esc(x.name) + ' ' + st(x.health.healthy ? 'ok' : 'bad', x.health.healthy ? (x.health.email || 'ok') : (x.health.reason || 'not connected')); }).join(' · ') + (m.mailboxes.length ? '' : 'no reps yet');
    }).catch(function () {});
    if (adm) {
      call('GET', '/failed-jobs').then(function (j) {
        $('failedJobs').innerHTML = (j.jobs || []).length ? j.jobs.map(function (x) { return '<div class="ev">' + esc(x.job.kind) + ' · ' + esc(when(x.created_at)) + ' · ' + esc(x.error) + ' <button type="button" class="btn btn-ghost" data-retry="' + esc(x.id) + '">Retry</button></div>'; }).join('') : '<span class="muted">None.</span>';
      }).catch(function () {});
      call('GET', '/audit?limit=60').then(function (a) {
        $('auditLog').innerHTML = (a.events || []).map(function (ev) { return '<div class="ev"><b>' + esc(ev.event_type) + '</b> ' + esc(ev.entity_type) + ' ' + esc(String(ev.entity_id).slice(0, 8)) + ' <span class="muted small">' + esc(when(ev.created_at)) + ' · ' + esc(ev.actor_id) + '</span></div>'; }).join('') || '<span class="muted">Empty.</span>';
      }).catch(function () {});
    }
  }
  function repRow(rep, team, i, adm) {
    var dis = adm ? '' : ' disabled';
    return '<div class="form" data-rep style="margin-bottom:8px"><label>Team member<select class="sel" data-rf="id"' + dis + '><option value="">Pick…</option>' + team.map(function (t) { return '<option value="' + esc(t.id) + '"' + (rep.member_id === t.id ? ' selected' : '') + '>' + esc(t.name || t.email) + '</option>'; }).join('') + '</select></label>' +
      '<label>Name in emails<input class="inp" data-rf="name" value="' + esc(rep.name || '') + '"' + dis + '></label><label>Preferred cities (comma)<input class="inp" data-rf="cities" value="' + esc((rep.cities || []).join(', ')) + '"' + dis + '></label>' +
      '<label class="chk"><input type="checkbox" data-rf="active"' + (rep.active !== false ? ' checked' : '') + dis + '> Active</label></div>';
  }
  function cityRow(c) {
    var ro = isMgr() ? '' : ' disabled';
    return '<tr data-city><td><input type="checkbox" data-cy="on"' + (c.enabled ? ' checked' : '') + ro + '></td><td><input class="inp" data-cy="name" value="' + esc(c.name) + '"' + ro + '></td><td><input class="inp" data-cy="prov" value="' + esc(c.province) + '"' + ro + ' style="width:70px"></td>' +
      '<td><select class="sel" data-cy="tz"' + ro + '>' + ['America/Vancouver', 'America/Edmonton', 'America/Winnipeg', 'America/Toronto', 'America/Halifax', 'America/St_Johns'].map(function (z) { return '<option' + (z === c.tz ? ' selected' : '') + '>' + z + '</option>'; }).join('') + '</select></td></tr>';
  }
  async function saveSettings(extra) {
    var adm = S.me.role === 'admin';
    var body = {
      test_recipients: $('sTest').value.split(/[\s,]+/).filter(Boolean), sender_address: $('sAddr').value,
      daily_discovery: $('sDaily').checked, auto_research: $('sAuto').checked, max_results_per_query: Number($('sMax').value),
      daily_request_budget: Number($('sDay').value), monthly_request_budget: Number($('sMon').value),
      cities: [].slice.call(document.querySelectorAll('[data-city]')).map(function (r) { return { name: r.querySelector('[data-cy="name"]').value, province: r.querySelector('[data-cy="prov"]').value, tz: r.querySelector('[data-cy="tz"]').value, enabled: r.querySelector('[data-cy="on"]').checked }; }).filter(function (c) { return c.name.trim(); }),
    };
    if (adm) {
      body.reps = [].slice.call(document.querySelectorAll('[data-rep]')).map(function (r) { return { member_id: r.querySelector('[data-rf="id"]').value, name: r.querySelector('[data-rf="name"]').value, cities: r.querySelector('[data-rf="cities"]').value.split(',').map(function (x) { return x.trim(); }).filter(Boolean), active: r.querySelector('[data-rf="active"]').checked }; }).filter(function (x) { return x.member_id; });
      body.managers = [].slice.call($('sMgr').selectedOptions).map(function (o) { return o.value; });
      body.viewers = [].slice.call($('sView').selectedOptions).map(function (o) { return o.value; });
    }
    Object.assign(body, extra || {});
    try { await call('PATCH', '/settings', body); toast('Settings saved'); S.me = await call('GET', '/me'); render(); } catch (e) { fail(e); }
  }

  // ---------------- notifications ----------------
  async function openNotifications() {
    var p = $('notifPanel');
    if (!p.hidden) { p.hidden = true; return; }
    p.hidden = false; p.innerHTML = '<div class="muted small">Loading…</div>';
    try {
      var n = (await call('GET', '/notifications')).notifications || [];
      p.innerHTML = n.length ? n.map(function (x) { return '<div class="notif-item' + (x.read_at ? '' : ' unread') + '"' + (x.prospect_id ? ' data-p="' + esc(x.prospect_id) + '" data-dt="emails"' : '') + '><b>' + esc(x.title) + '</b><div class="small" style="white-space:pre-wrap">' + esc((x.body || '').slice(0, 300)) + '</div><div class="small muted">' + esc(when(x.created_at)) + '</div></div>'; }).join('') : '<div class="muted small">No notifications.</div>';
      if (n.some(function (x) { return !x.read_at; })) { await call('POST', '/notifications/read'); S.me.unread = 0; chrome(); }
    } catch (e) { p.innerHTML = '<div class="muted small">' + esc(e.message) + '</div>'; }
  }

  // ---------------- events ----------------
  document.addEventListener('click', async function (ev) {
    var t = ev.target;
    var tab = t.closest('[data-tab]');
    if (tab) { S.tab = tab.getAttribute('data-tab'); try { localStorage.setItem('vm-ob-tab', S.tab); } catch (x) {} S.offset = 0; return render(); }
    if (t.closest('#bell')) return openNotifications();
    if (!t.closest('.notif')) $('notifPanel').hidden = true;
    var go = t.closest('[data-go]'); if (go) { S.tab = go.getAttribute('data-go'); return render(); }
    if (t.closest('[data-close]') || t.id === 'scrim') return closeDrawer();
    var row = t.closest('[data-p]');
    if (row && !t.closest('button')) { S.dtab = row.getAttribute('data-dt') || 'overview'; $('notifPanel').hidden = true; return openProspect(row.getAttribute('data-p')); }
    var b = t.closest('button'); if (!b) return;
    if (b.hasAttribute('data-goq')) { S.tab = 'queue'; S.qFocus = b.getAttribute('data-goq'); try { localStorage.setItem('vm-ob-tab', S.tab); } catch (x) {} return render(); }
    if (b.closest('[data-qp]') && !b.closest('#drawer')) return qAction(b);
    if (b.hasAttribute('data-qf')) { S.qFilter = b.getAttribute('data-qf'); return render(); }
    if (!b.closest('#drawer') && (b.closest('[data-st]') || b.closest('[data-sc]') || b.hasAttribute('data-scopy')) && await stratAction(b)) return;
    if (b.hasAttribute('data-mine')) { S.filters.mine = b.getAttribute('data-mine') === '1'; S.offset = 0; return render(); }
    if (b.hasAttribute('data-page')) { S.offset = Math.max(0, S.offset + 50 * Number(b.getAttribute('data-page'))); return render(); }
    if (b.id === 'dRun') return runDiscovery();
    if (b.id === 'addP') return addProspectForm();
    if (b.id === 'npSave') return saveProspect();
    if (b.hasAttribute('data-fu')) { S.fuState = b.getAttribute('data-fu'); return render(); }
    if (b.hasAttribute('data-fact')) {
      var eid = b.getAttribute('data-e'), a = b.getAttribute('data-fact');
      try { await call('POST', '/enrollments/' + eid + '/' + a, a === 'pause' ? { reason: 'Paused by ' + S.me.name } : {}); toast(a === 'pause' ? 'Paused' : 'Resumed'); render(); } catch (e) { fail(e); }
      return;
    }
    if (b.hasAttribute('data-csave')) return saveCampaign(b.getAttribute('data-csave'));
    if (b.hasAttribute('data-capprove')) { try { await call('POST', '/campaigns/' + b.getAttribute('data-capprove') + '/approve-templates'); toast('Templates approved'); render(); } catch (e) { fail(e); } return; }
    if (b.id === 'saveSettings') return saveSettings();
    if (b.id === 'goTest') return saveSettings({ send_mode: 'test' });
    if (b.id === 'goLive') {
      var c = prompt('Going live emails real prospects. Only after the CASL legal review.\nType exactly: CASL review done');
      if (c) return saveSettings({ send_mode: 'live', confirm: c });
      return;
    }
    if (b.id === 'addRep') { $('repRows').insertAdjacentHTML('beforeend', repRow({ active: true }, S.team || [], 0, true)); return; }
    if (b.id === 'addCity') { $('cityRows').insertAdjacentHTML('beforeend', cityRow({ name: '', province: '', tz: 'America/Toronto', enabled: true })); return; }
    if (b.id === 'saveCats') {
      try {
        for (const el of [].slice.call(document.querySelectorAll('[data-cat]'))) {
          await call('PATCH', '/categories/' + el.getAttribute('data-cat'), { search_queries: el.querySelector('[data-catq]').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean), is_active: el.querySelector('[data-cata]').checked });
        }
        S.cats = (await call('GET', '/categories')).categories; toast('Categories saved'); render();
      } catch (e) { fail(e); }
      return;
    }
    if (b.id === 'addCat') {
      var name = prompt('New prospect category name (it starts switched off):');
      if (name) { try { await call('POST', '/categories', { name: name }); S.cats = (await call('GET', '/categories')).categories; render(); } catch (e) { fail(e); } }
      return;
    }
    if (b.hasAttribute('data-retry')) { try { await call('POST', '/failed-jobs/' + b.getAttribute('data-retry') + '/retry'); toast('Queued again'); render(); } catch (e) { fail(e); } return; }

    // drawer actions
    if (!S.drawer) return;
    var P = S.drawer.prospect;
    if (b.hasAttribute('data-dtab')) { S.dtab = b.getAttribute('data-dtab'); return drawProspect(); }
    if (b.hasAttribute('data-dedup')) return act(function () { return call('PATCH', '/prospects/' + P.id, { dedup_status: b.getAttribute('data-dedup') }); }, 'Saved');
    if (b.hasAttribute('data-cred')) return act(function () { return call('PATCH', '/prospects/' + P.id, { credential_status: b.getAttribute('data-cred'), credential_note: (b.getAttribute('data-cred') === 'verified' ? 'Confirmed on the CICC register by ' : 'Not found on the CICC register by ') + S.me.name }); }, 'Saved');
    if (b.id === 'claim') return act(function () { return call('POST', '/prospects/' + P.id + '/assign', { rep_id: S.me.id }); }, 'It is yours');
    if (b.id === 'requal') return act(function () { return call('POST', '/prospects/' + P.id + '/qualify'); }, 'Researched and scored again');
    if (b.hasAttribute('data-life')) { if (!confirmTwice(b, 'Press again')) return; return act(function () { return call('PATCH', '/prospects/' + P.id, { lifecycle_status: b.getAttribute('data-life') }); }, 'Saved'); }
    if (b.id === 'convert') {
      var pid = prompt('Partner agency ID from Partners (the agency must exist there first):');
      if (pid) return act(function () { return call('POST', '/prospects/' + P.id + '/convert', { partner_id: pid.trim() }); }, 'Converted to partner');
      return;
    }
    if (b.id === 'ncSave') return act(function () { return call('POST', '/prospects/' + P.id + '/contacts', { full_name: $('ncName').value, job_title: $('ncTitle').value, email: $('ncEmail').value, phone: $('ncPhone').value, source_url: $('ncSrc').value }); }, 'Contact added: review compliance next');
    if (b.hasAttribute('data-enroll')) return act(async function () { await call('POST', '/enrollments', { prospect_id: P.id, contact_id: b.getAttribute('data-enroll') }); S.dtab = 'emails'; }, 'First email drafted: review it');
    if (b.hasAttribute('data-suppress')) { if (!confirmTwice(b, 'Press again: never email them')) return; return act(function () { return call('POST', '/contacts/' + b.getAttribute('data-suppress') + '/suppress'); }, 'Added to the suppression list'); }
    if (b.hasAttribute('data-compact')) {
      var cid = b.getAttribute('data-cid'), f = document.querySelector('[data-comp="' + cid + '"]'), g = function (k) { return f.querySelector('[data-cf="' + k + '"]'); };
      return act(function () {
        return call('POST', '/contacts/' + cid + '/compliance', { decision: b.getAttribute('data-compact'), lawful_basis: g('basis').value, basis_evidence: g('evidence').value, evidence_url: g('url').value, consent_record_id: g('consent').value, referrer_name: g('referrer').value, ebr_kind: g('ebrkind').value, ebr_date: g('ebrdate').value,
          checks: { published_on_own_site: g('own').checked, role_relevant: g('role').checked, no_unsolicited_statement: g('nus').checked } });
      }, 'Compliance saved');
    }
    if (b.id === 'acSave') return act(function () { return call('POST', '/prospects/' + P.id + '/activity', { kind: $('acKind').value, text: $('acText').value }); }, 'Added');
    var card = b.closest('[data-enr]');
    if (card && b.hasAttribute('data-eact')) return enrollmentAction(card.getAttribute('data-enr'), b.getAttribute('data-eact'), card);
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'mineRep') { S.mineRep = t.value; S.qSkip = []; return render(); }
    var qel = t.closest && t.closest('[data-qp]');
    if (qel && t.hasAttribute('data-qchk')) return qSync(qel);
    if (qel && t.hasAttribute('data-qcontact')) { var qc = qCard(qel.getAttribute('data-qp')); qc.contact_id = t.value; qRedraw(qc.prospect.id); return qDraft(qc.prospect.id); }
    if (t.id === 'repSel' && t.value && S.drawer) { var P = S.drawer.prospect; return act(function () { return call('POST', '/prospects/' + P.id + '/assign', { rep_id: t.value, reason: 'manual' }); }, 'Reassigned'); }
    var f = t.getAttribute && t.getAttribute('data-f');
    if (f && S.tab === 'prospects' && !t.closest('#drawer')) { S.filters[f] = t.value; S.offset = 0; render(); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !$('drawer').hidden) closeDrawer();
    if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('tr.click')) ev.target.click();
    if (ev.key === 'Enter' && ev.target.getAttribute && ev.target.getAttribute('data-f') === 'q') { S.filters.q = ev.target.value; S.offset = 0; render(); }
  });
  boot();
})();
</script>
</body>
</html>
