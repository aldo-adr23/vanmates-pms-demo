<script>
// Same sign-in gate as arrivals.html. Access to the hub itself is decided server-side (hr_whoami / RLS).
(function () {
  var ok = false;
  try {
    var s = JSON.parse(localStorage.getItem('sb-recbwmihyinlgxnymcmc-auth-token') || 'null');
    ok = !!(s && s.access_token && (!s.expires_at || s.expires_at * 1000 > Date.now()));
  } catch (e) { ok = false; }
  if (!ok) {
    try { sessionStorage.setItem('vm_next_path', 'hr.html'); } catch (e) {}
    location.replace('signin.html');
  }
})();
</script>
<style>
:root{
  --cream:#FAF5ED; --cream-2:#F4ECDD; --red:#B94A3F; --red-dark:#A13A30; --red-soft:#F3DDD8; --ink:#2B211A; --muted:#8A7B6C;
  --line:#E4DBC9; --green:#5C8A6B; --green-soft:#E2EDDF; --amber:#C8923A; --amber-soft:#F4E5C7; --blue:#3F6E94; --blue-soft:#DCE7F1;
  --surface:#FFFFFF; --serif:"Playfair Display", Georgia, serif; --sans:"Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --shadow-sm: 0 1px 2px rgba(43,33,26,.05); --radius: 14px;
  --on-red:#fff; --b-green:#3e6049; --b-amber:#8a611f; --b-blue:#2b4f6e; --scrim:rgba(43,33,26,.38); --toast:#2B211A; --toast-ink:#FAF5ED;
}
:root[data-theme="dark"]{
  --cream:#1F1A16; --cream-2:#2A231E; --red:#D17262; --red-dark:#B95F50; --red-soft:#5C2B25; --ink:#F4ECDD; --muted:#A89685; --line:#3A302A;
  --green:#85A88E; --green-soft:#2C3E32; --amber:#E5C896; --amber-soft:#4A3C20; --blue:#6F9DC4; --blue-soft:#28394A; --surface:#26201B;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.30); --b-green:#B9D3C0; --b-amber:#F0D9AE; --b-blue:#B7D0E6; --scrim:rgba(0,0,0,.55); --toast:#F4ECDD; --toast-ink:#1F1A16;
}

  font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 15px; text-decoration: none; }
.page-title { font-family: var(--serif); font-weight: 700; font-size: 22px; line-height: 1.1; white-space: nowrap; }
.page-title em { font-style: italic; color: var(--red); font-weight: 600; }

.hcard .actions { margin-top: auto; padding-top: 6px; }
.sec { padding: 16px; margin-bottom: 12px; }

</style>

<body>
<div class="top">
  <a class="brand-mark" href="index.html" aria-label="Back to the portal">V</a>
  <span class="page-title">Employee <em>Hub</em></span>
  <span class="pill" id="hrPill" hidden title="Everyone's records — only Aldo and Elisa see this view. Each employee sees only their own hub, once you switch it on for them.">HR view</span>
  <span class="sp"></span>
  <nav class="tabs" id="tabs" hidden aria-label="Sections">
    <button type="button" class="tab" data-tab="requests">Requests <span class="tbadge" id="rqCount" hidden></span></button>
    <button type="button" class="tab on" data-tab="people">Employees</button>
    <button type="button" class="tab" data-tab="queue">Review queue <span class="tbadge" id="qCount" hidden></span></button>
    <button type="button" class="tab" data-tab="activity">Activity</button>
    <button type="button" class="tab" data-tab="settings">Settings <span class="tbadge" id="lvCount" hidden></span></button>
    <button type="button" class="tab" data-tab="mine" id="mineTab" hidden>My hub</button>
  </nav>
</div>

<main class="wrap" id="app"><div class="empty">Loading…</div></main>

<div class="modal" id="modal"><div class="mcard" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="mTitle"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="hr-core.js?v=2026-10-22-retention3"></script>
<script>
(function () {
  'use strict';
  var sb = window.supabase.createClient(window.VM_SUPABASE_URL, window.VM_SUPABASE_KEY,
    { auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false } });
  var BUCKET = 'hr-docs';
  var MAX_BYTES = 25 * 1024 * 1024;
  var REVIEW = { pending_review: 'Pending review', needs_correction: 'Needs correction', approved: 'Approved' };
  var SIGNED = { signed: 'Signed', unsigned: 'Unsigned', uncertain: 'Uncertain' };
  var CATS = { contract: 'Contract', amendment: 'Amendment', renewal: 'Renewal', offer_letter: 'Offer letter', job_description: 'Job description',
    policy: 'Policy', termination: 'Termination', other: 'Other' };
  var LANGS = { en: 'English', es: 'Spanish', fr: 'French', other: 'Other' };
  var STATUS = { active: 'Active', on_leave: 'On leave', inactive: 'Inactive', terminated: 'Terminated' };
  var S = { tab: 'people', filter: 'all', q: '', emps: [], docs: [], openId: null, audit: [], search: [], busy: false,
    ledger: [], balances: [], settings: {}, leavers: null, requests: [], msgs: [], selfServiceMissing: false, meEmail: '',
    mine: null,   // the signed-in employee's own hub: { h: hr_my_hub(), tab, lang }
    pv: null };   // HR preview of one employee: { h, tab, lang, warn, empId }
  var MY_TABS = { home: 'tHome', time: 'tTime', docs: 'tDocs', details: 'tDetails', ask: 'tAsk' };
  var REQ = { pending: 'sPending', approved: 'sApproved', declined: 'sDeclined', cancelled: 'sCancelled' };
  var KIND = { vacation: 'kVacation', sick: 'kSick', personal: 'kPersonal' };

  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 4000); }
  function opts(map, sel, blank) {
    return (blank !== undefined ? '<option value="">' + esc(blank) + '</option>' : '') +
      Object.keys(map).map(function (k) { return '<option value="' + esc(k) + '"' + (k === sel ? ' selected' : '') + '>' + esc(map[k]) + '</option>'; }).join('');
  }
  function when(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  function day(ymd) { if (!ymd) return ''; var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ymd); if (!m) return ymd; return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).toLocaleDateString([], { timeZone: 'UTC', year: 'numeric', month: 'short', day: 'numeric' }); }
  function name(e) { return e ? (e.preferred_name ? e.preferred_name + ' ' + e.legal_last_name : e.legal_first_name + ' ' + e.legal_last_name) : ''; }
  function empById(id) { return S.emps.filter(function (e) { return e.id === id; })[0] || null; }
  function docsOf(id) { return S.docs.filter(function (d) { return d.employee_id === id; }); }
  function currentContract(id) { return docsOf(id).filter(function (d) { return d.is_current_contract; })[0] || null; }
  function errText(e) {
    var m = (e && e.message) || 'Not saved.';
    if (/stale/i.test(m)) return 'Someone else changed this record. Reloaded — check and try again.';
    if (/not found/i.test(m)) return 'Not allowed.';
    return m;
  }

  // ------------------------------------------------------------- data
  async function loadAll() {
    var r = await Promise.all([
      sb.from('hr_employees').select('*').order('legal_last_name'),
      sb.from('hr_documents').select('*').order('imported_at', { ascending: false }),
      sb.from('hr_leave_ledger').select('*').order('effective_date', { ascending: false }).order('id', { ascending: false }),
      sb.from('hr_leave_balances').select('*'),
      sb.from('hr_settings').select('key,value'),
    ]);
    var bad = r.filter(function (x) { return x.error; })[0];
    if (bad) { toast('Could not load: ' + bad.error.message); return; }
    S.emps = r[0].data || []; S.docs = r[1].data || []; S.ledger = r[2].data || []; S.balances = r[3].data || [];
    S.settings = {}; (r[4].data || []).forEach(function (x) { S.settings[x.key] = x.value; });
    // Part 3 tables (hr-hub-self-service SQL). Until that file is applied the rest of the hub still works.
    var p3 = await Promise.all([
      sb.from('hr_leave_requests').select('*').order('start_date', { ascending: true }).limit(1000),
      sb.from('hr_messages').select('*').order('created_at', { ascending: true }).limit(3000),
    ]);
    S.selfServiceMissing = !!(p3[0].error || p3[1].error);
    S.requests = p3[0].data || []; S.msgs = p3[1].data || [];
  }

    var r = await sb.from('hr_audit').select('*').order('at', { ascending: false }).limit(200);
    if (S.tab !== 'activity') return;
    var byId = {}; S.emps.forEach(function (e) { byId[e.id] = name(e); }); S.docs.forEach(function (d) { byId[d.id] = d.title; });
    $('app').innerHTML = '<p class="note">Every change, document open and download in the hub (latest 200). Field names only — no document text.</p>' +
      '<div class="card" style="padding:6px 14px;max-width:860px"><ul class="hist">' + ((r.data || []).map(function (a) {
        return '<li><span>' + esc(a.action) + (a.detail && a.detail.fields ? ': ' + esc(a.detail.fields.join(', ')) : '') + ' — <b>' + esc(byId[a.entity_id] || a.entity_id || '') + '</b> <span class="muted">· ' + esc(a.actor || '') + '</span></span><span>' + esc(when(a.at)) + '</span></li>';
      }).join('') || '<li><span class="muted">Nothing yet.</span></li>') + '</ul></div>';
  }

  // ------------------------------------------------------------- actions
  async function openEmployee(id) {
    S.openId = id; S.audit = []; S.search = [];
    render();
    await loadEmployeeExtras(id);
    if (S.openId === id && S.tab === 'people') $('panel').innerHTML = panelHtml(empById(id));
  }
  async function refresh(keepOpen) {
    await loadAll();
    if (keepOpen && S.openId && empById(S.openId)) await loadEmployeeExtras(S.openId);
    render();
  }
  function formJson(form) {
    var out = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (!el.name) return;
      out[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim();
    });
    if ('day_hours' in out) {   // shown in hours, stored in minutes
      var dm = HR.hoursToMinutes(out.day_hours); out.day_minutes_raw = out.day_hours; delete out.day_hours;
      out.day_minutes = dm === null ? out.day_minutes_raw : String(dm);   // junk goes to the server, which refuses it
      delete out.day_minutes_raw;
    }
    return out;
  }
  async function guarded(fn) {
    if (S.busy) return; S.busy = true;
    try { await fn(); } catch (e) { toast(errText(e)); if (/stale/i.test((e && e.message) || '')) await refresh(true); }
    finally { S.busy = false; }
  }

  async function saveEmployee(form) {
    var e = empById(S.openId), p = formJson(form);
    p.id = e.id;
    await guarded(async function () {
      await call('hr_save_employee', { p: p, expected_version: e.version });
      toast('Saved.'); await refresh(true);
    });
  }
  async function review(status) {
    var e = empById(S.openId), notes = $('rvNotes').value;
    if (status === 'needs_correction' && !notes.trim()) { toast('Add a note saying what needs correcting.'); $('rvNotes').focus(); return; }
    await guarded(async function () {
      await call('hr_set_review', { emp_id: e.id, new_status: status, notes: notes, expected_version: e.version });
      toast(REVIEW[status] + '.'); await refresh(true);
    });
  }
  async function saveDoc(form) {
    var d = S.docs.filter(function (x) { return x.id === form.dataset.doc; })[0], p = formJson(form);
    await guarded(async function () {
      await call('hr_update_document', { doc_id: d.id, p: p, expected_version: d.version });
      toast(p.employee_id ? 'Saved.' : 'Saved — in the review queue.'); await refresh(true);
    });
  }
  async function openDoc(id) {
    var d = S.docs.filter(function (x) { return x.id === id; })[0];
    var w = window.open('', '_blank');   // opened in the click so it is not blocked as a popup
    try {
      await call('hr_log', { action: 'view_document', entity: 'hr_documents', entity_id: d.id, detail: {} });
      var r = await sb.storage.from(BUCKET).createSignedUrl(d.storage_path, 60);
      if (r.error) throw r.error;
      if (w) { w.opener = null; w.location = r.data.signedUrl; } else location.href = r.data.signedUrl;
    } catch (e) { if (w) w.close(); toast('Could not open: ' + errText(e)); }
  }
  function safeName(n) { return String(n || 'file').normalize('NFKD').replace(/[^\w.-]+/g, '_').replace(/^[._]+/, '').slice(-120) || 'file'; }
  async function sha256Hex(buf) {
    var h = await crypto.subtle.digest('SHA-256', buf);
    return Array.prototype.map.call(new Uint8Array(h), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  async function upload(file) {
    if (!file) return;
    if (file.size > MAX_BYTES) { toast('That file is over 25 MB.'); return; }
    var empId = S.openId;
    await guarded(async function () {
      toast('Uploading…');
      var sha = await sha256Hex(await file.arrayBuffer());
      var path = 'employees/' + empId + '/' + sha + '/' + safeName(file.name);
      if (!S.docs.some(function (d) { return d.sha256 === sha; })) {
        var up = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });
        if (up.error && !/exists/i.test(up.error.message || '')) throw up.error;
      }
      var r = await call('hr_add_document', { p: { employee_id: empId, storage_path: path, file_name: file.name, mime_type: file.type, size_bytes: file.size,
        sha256: sha, title: file.name.replace(/\.[^.]+$/, ''), category: 'other', source: { kind: 'upload' } } });
      toast(r.duplicate ? 'Already in the hub — not added twice.' : 'Uploaded. Set its category and signed status below.');
      await refresh(true);
    });
  }
  async function openPreview(id) {
    var e = empById(id); if (!e) return;
    if (S.openId !== id) { S.openId = id; await loadEmployeeExtras(id); }
    S.pv = { h: hubFor(e), tab: 'home', lang: HR.previewLang(e), preview: true, name: name(e), empId: id,
      warn: HR.previewWarnings(e, S.settings, S.docs, S.balances).concat(e.hub_enabled ? [] : ['Their hub is off — they can’t open any of this yet.']) };
    $('modalCard').classList.add('wide');
    renderPreview();
    $('modal').classList.add('open');
  }

  // Employee actions (their own hub). Each reloads hr_my_hub so the page shows what the server stored.
  async function myRequest(form) {
    var p = formJson(form), me = S.mine.h.me || {}, L = function (k) { return HR.t(S.mine.lang, k); };
    var r = HR.requestMinutes(p.start_date, p.end_date || p.start_date, me.day_minutes, p.hours);
    var errs = { dates: 'eDates', order: 'eOrder', hours: 'eHours', needHours: 'eNeedHours', weekend: 'eWeekend' };
    if (r.error) { toast(L(errs[r.error])); return; }
    await guarded(async function () {
      await call('hr_request_leave', { p: { leave_type: p.leave_type, start_date: p.start_date, end_date: p.end_date || p.start_date,
        hours: p.hours, note: p.note, idem_key: p.idem_key } });
      toast(L('sent')); await loadMine(); renderMine();
    });
  }
  async function myCancel(id) {
    await guarded(async function () {
      await call('hr_cancel_leave_request', { req_id: Number(id) });
      toast(HR.t(S.mine.lang, 'cancelled')); await loadMine(); renderMine();
    });
  }
  async function myDetails(form) {
    await guarded(async function () {
      await call('hr_update_my_details', { p: formJson(form) });
      toast(HR.t(S.mine.lang, 'saved')); await loadMine(); renderMine();
    });
  }
  async function myMessage(form) {
    var body = form.elements.body.value.trim(); if (!body) { form.elements.body.focus(); return; }
    await guarded(async function () {
      await call('hr_send_message', { body: body });
      await loadMine(); renderMine();
    });
  }
  async function openMyDoc(id) {
    var d = (S.mine.h.documents || []).filter(function (x) { return x.id === id; })[0]; if (!d) return;
    var w = window.open('', '_blank');
    try {
      var r = await sb.storage.from(BUCKET).createSignedUrl(d.storage_path, 60);
      if (r.error) throw r.error;
      if (w) { w.opener = null; w.location = r.data.signedUrl; } else location.href = r.data.signedUrl;
    } catch (e) { if (w) w.close(); toast(errText(e)); }
  }

  // HR actions on requests, messages and the per-employee switch.
  async function decide(id, decision) {
    var why = ($('why-' + id) || {}).value || '';
    if (decision === 'declined' && !why.trim()) { toast('Add a reason so they know why.'); $('why-' + id).focus(); return; }
    await guarded(async function () {
      await call('hr_decide_leave_request', { req_id: Number(id), decision: decision, why: why });
      toast(decision === 'approved' ? 'Approved — taken off their balance.' : 'Declined.'); await refresh(false);
    });
  }
  async function reply(empId, withBody) {
    var body = withBody ? ($('reply-' + empId).value || '').trim() : '';
    if (withBody && !body) { $('reply-' + empId).focus(); return; }
    await guarded(async function () {
      await call('hr_reply_message', { emp_id: empId, body: body || null });
      toast(body ? 'Sent — they’ll see it in their hub.' : 'Marked handled.'); await refresh(false);
    });
  }
  async function setHub(on) {
    var e = empById(S.openId);
    await guarded(async function () {
      await call('hr_set_hub_access', { emp_id: e.id, enabled: on });
      toast(on ? 'Hub switched on for ' + name(e) + '.' : 'Hub switched off.'); await refresh(true);
    });
  }
  async function addLeave(form) {
    var e = empById(S.openId), p = formJson(form), m = HR.hoursToMinutes(p.hours);
    if (m === null || m === 0) { toast('Enter the hours, e.g. 7.5 (negative only for an adjustment).'); return; }
    if (!p.effective_date) { toast('Enter the date it applies from.'); return; }
    if (!p.reason) { toast('Say where the number comes from.'); return; }
    await guarded(async function () {
      await call('hr_add_leave_entry', { p: { employee_id: e.id, entry_type: p.entry_type, leave_type: p.leave_type, minutes: m,
        effective_date: p.effective_date, reason: p.reason, idem_key: p.idem_key } });
      toast('Posted — profile is back to Pending review.'); await refresh(true);
    });
  }
  async function reverseLeave(form) {
    var p = formJson(form);
    if (!p.reason) { toast('Say why it is being reversed.'); return; }
    await guarded(async function () {
      await call('hr_add_leave_entry', { p: { employee_id: S.openId, entry_type: 'reversal', reverses_id: Number(form.dataset.entry), reason: p.reason, idem_key: p.idem_key } });
      toast('Reversed.'); await refresh(true);
    });
  }
  async function saveSettings(form) {
    var p = formJson(form), st = S.settings;
    var oc = p.oc_name ? { name: p.oc_name, email: p.oc_email, role: p.oc_role || undefined } : null;
    if (oc && !oc.role) delete oc.role;
    var want = { vacation_pay_method: p.vacation_pay_method, outside_contact: oc, payroll_link: p.payroll_link || null, review_cadence: p.review_cadence };
    await guarded(async function () {
      var changed = Object.keys(want).filter(function (k) { return JSON.stringify(want[k]) !== JSON.stringify(st[k] === undefined ? null : st[k]); });
      for (var i = 0; i < changed.length; i++) await call('hr_save_setting', { k: changed[i], v: want[changed[i]] });
      toast(changed.length ? 'Settings saved.' : 'Nothing changed.'); await refresh(false);
    });
  }
  function addEmployeeModal() {
    var blank = { id: '', legal_first_name: '', legal_last_name: '', entity: 'Vanmates Consulting Corporation', country: 'CA', status: 'active', locale: 'en' };
    $('modalCard').classList.remove('wide');
    $('modalCard').innerHTML = '<h2 id="mTitle">Add employee</h2>' + profileForm(blank).replace('Save profile', 'Add') +
      '<div class="actions"><button type="button" class="btn btn-ghost" id="mClose">Cancel</button></div>';
    $('modal').classList.add('open');
    var f = $('modalCard').querySelector('form'); f.id = 'newEmpForm';
    f.querySelector('[name=legal_first_name]').focus();
  }
  async function addEmployee(form) {
    var p = formJson(form);
    if (!p.legal_first_name || !p.legal_last_name || !p.entity) { toast('First name, last name and entity are needed.'); return; }
    await guarded(async function () {
      var r = await call('hr_save_employee', { p: p });
      $('modal').classList.remove('open');
      toast('Added — Pending review.'); await refresh(false); openEmployee(r.id);
    });
  }

  // ------------------------------------------------------------- events
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button, [data-emp]'); if (!t) return;
    var inPv = !!t.closest('#modal');
    // Employee hub (theirs, or HR's preview of it in the modal)
    var ctx = inPv ? S.pv : S.mine;
    var reMy = function () { if (inPv) renderPreview(); else renderMine(); };
    if (t.dataset.mytab || t.dataset.mygo) { ctx.tab = t.dataset.mytab || t.dataset.mygo; reMy(); return; }
    if (t.dataset.mylang) { ctx.lang = t.dataset.mylang; if (!inPv) saveLang(ctx.lang); reMy(); return; }
    if (inPv && t.dataset.pvblock) { toast(HR.t('en', 'previewNote')); return; }
    if (t.dataset.mycancel) { myCancel(t.dataset.mycancel); return; }
    if (t.dataset.mydoc) { openMyDoc(t.dataset.mydoc); return; }
    // HR
    if (t.dataset.tab) { S.tab = t.dataset.tab; render(); if (S.tab === 'settings') loadLeavers().then(function () { if (S.tab === 'settings') render(); });
      if (S.tab === 'mine') loadMine().then(function () { if (S.tab === 'mine') render(); }, function (e) { toast(errText(e)); }); return; }
    if (t.dataset.preview) { openPreview(t.dataset.preview); return; }
    if (t.dataset.filter) { S.filter = t.dataset.filter; render(); return; }
    if (t.dataset.goPeople) { S.tab = 'people'; }
    if (t.dataset.emp) { openEmployee(t.dataset.emp); return; }
    if (t.dataset.review) { review(t.dataset.review); return; }
    if (t.dataset.openDoc) { openDoc(t.dataset.openDoc); return; }
    if (t.dataset.hub) { setHub(t.dataset.hub === 'on'); return; }
    if (t.dataset.decide) { decide(t.dataset.req, t.dataset.decide); return; }
    if (t.dataset.reply) { reply(t.dataset.reply, true); return; }
    if (t.dataset.handled) { reply(t.dataset.handled, false); return; }
    if (t.id === 'upBtn') { $('upFile').click(); return; }
    if (t.id === 'addEmp') { addEmployeeModal(); return; }
    if (t.id === 'mClose') { $('modal').classList.remove('open'); return; }
  });
  document.addEventListener('change', function (ev) { if (ev.target.id === 'upFile') upload(ev.target.files[0]); });
  document.addEventListener('toggle', function (ev) { if (ev.target.id === 'profileFold') S.profileOpen = ev.target.open; }, true);
  document.addEventListener('input', function (ev) {
    var f = ev.target.form;
    if (f && f.id === 'myReq') {
      // Last day follows the first day until it is set on its own.
      if (ev.target.name === 'start_date' && (!f.elements.end_date.value || f.elements.end_date.value < ev.target.value)) f.elements.end_date.value = ev.target.value;
      if (ev.target.name === 'start_date') f.elements.end_date.min = ev.target.value;
      var inPv = !!ev.target.closest('#modal');
      updateEstimate(inPv ? $('modalCard') : $('app'), inPv ? S.pv : S.mine); return;
    }
    if (ev.target.id !== 'q') return;
    S.q = ev.target.value; var pos = ev.target.selectionStart; render();
    var q = $('q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {}
  });
  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = ev.target;
    if (f.dataset.pvblock) { toast(HR.t('en', 'previewNote')); return; }
    if (f.id === 'myReq') myRequest(f);
    else if (f.id === 'myDetails') myDetails(f);
    else if (f.id === 'myMsg') myMessage(f);
    else if (f.id === 'empForm') saveEmployee(f);
    else if (f.id === 'newEmpForm') addEmployee(f);
    else if (f.classList.contains('docForm')) saveDoc(f);
    else if (f.id === 'leaveForm') addLeave(f);
    else if (f.classList.contains('revForm')) reverseLeave(f);
    else if (f.id === 'setForm') saveSettings(f);
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') $('modal').classList.remove('open'); });

  // ------------------------------------------------------------- boot
  (async function boot() {
    var who = null;
    try { who = await call('hr_whoami', {}); } catch (e) { who = null; }
    if (who && !who.allowed && who.employee) {   // an employee: only their own hub, no HR tabs
      try { await loadMine(); } catch (e) { toast(errText(e)); }
      renderMine();
      return;
    }
    if (!who || !who.allowed) {
      var lang = (navigator.language || '').slice(0, 2) === 'es' ? 'es' : 'en';
      $('app').innerHTML = '<div class="card lock"><h1>' + esc(HR.t(lang, 'lockTitle')) + '</h1><p class="muted">' + esc(HR.t(lang, 'lockBody')) + '</p>' +
        '<a class="btn btn-ghost" href="index.html">' + esc(HR.t(lang, 'backPortal')) + '</a></div>';
      return;
    }
    $('tabs').hidden = false; $('hrPill').hidden = false; $('mineTab').hidden = !who.employee;
    try { var u = await sb.auth.getUser(); S.meEmail = ((u.data && u.data.user && u.data.user.email) || '').toLowerCase(); } catch (e) {}
    await loadAll();
    loadLeavers();
    if (waitingCount()) S.tab = 'requests';
    var m = /[#&]e=([0-9a-f-]{36})/.exec(location.hash);
    if (m && empById(m[1])) { S.tab = 'people'; openEmployee(m[1]); } else render();
  })();
})();
</script>
</body>
</html>
