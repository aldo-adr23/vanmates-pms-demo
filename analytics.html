<style>
:root{
  --cream:#FAF5ED; --cream-2:#F4ECDD; --red:#B94A3F; --red-dark:#A13A30; --red-soft:#F3DDD8; --ink:#2B211A; --muted:#7A6B5C;
  --line:#E4DBC9; --green:#5C8A6B; --green-soft:#E2EDDF; --amber:#C8923A; --amber-soft:#F4E5C7; --blue:#3F6E94; --blue-soft:#DCE7F1;
  --surface:#FFFFFF; --serif:"Playfair Display", Georgia, serif; --sans:"Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --shadow-sm: 0 1px 2px rgba(43,33,26,.05); --radius: 14px; --on-red:#fff; --b-green:#3e6049; --b-amber:#8a611f; --b-blue:#2b4f6e;
  --scrim:rgba(43,33,26,.38); --toast:#2B211A; --toast-ink:#FAF5ED;
  /* chart roles (validated: dataviz validate_palette light) */
  --grid:#EFE8DA; --axis:#9A8B7B; --p-instagram:#e87ba4; --p-facebook:#2a78d6; --p-threads:#1baf7a; --p-tiktok:#eda100;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --ord1:#1c5cab; --ord2:#2a78d6; --ord3:#5598e7; --ord4:#86b6ef;
}
:root[data-theme="dark"]{
  --cream:#1F1A16; --cream-2:#2A231E; --red:#D17262; --red-dark:#B95F50; --red-soft:#5C2B25; --ink:#F4ECDD; --muted:#A89685; --line:#3A302A;
  --green:#85A88E; --green-soft:#2C3E32; --amber:#E5C896; --amber-soft:#4A3C20; --blue:#6F9DC4; --blue-soft:#28394A; --surface:#26201B;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.30); --b-green:#B9D3C0; --b-amber:#F0D9AE; --b-blue:#B7D0E6; --scrim:rgba(0,0,0,.55); --toast:#F4ECDD; --toast-ink:#1F1A16;
  --grid:#342B25; --axis:#8C7B6B; --p-instagram:#d55181; --p-facebook:#3987e5; --p-threads:#199e70; --p-tiktok:#c98500;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ord1:#86b6ef; --ord2:#5598e7; --ord3:#2a78d6; --ord4:#1c5cab;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --cream:#1F1A16; --cream-2:#2A231E; --red:#D17262; --ink:#F4ECDD; --muted:#A89685; --line:#3A302A; --surface:#26201B; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--cream); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; color: inherit; }
[hidden] { display: none !important; }
a { color: var(--red); }
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--red); color: var(--on-red); display: grid; place-items: center; flex: none; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 15px; text-decoration: none; }
.page-title { font-family: var(--serif); font-weight: 700; font-size: 22px; line-height: 1.1; white-space: nowrap; }
.page-title em { font-style: italic; color: var(--red); font-weight: 600; }
.sp { flex: 1; min-width: 0; }

.tab { border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; min-height: 30px; display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; min-height: 32px; border-radius: 999px; font-weight: 600; font-size: 12.5px; border: 1px solid transparent; white-space: nowrap; background: transparent; }
.btn-primary { background: var(--red); color: var(--on-red); } .btn-primary:hover { background: var(--red-dark); }

.pad { padding: 14px; }
.muted { color: var(--muted); } .small { font-size: 12px; }

.filters { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 2px 0 12px; position: sticky; top: 0; z-index: 5; background: var(--cream); padding: 8px 0; }

.chip.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
input.inp, select.sel, textarea.inp { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); min-height: 32px; padding: 5px 9px; font: inherit; font-size: 13px; outline: 0; min-width: 0; }
input.inp:focus, select.sel:focus, textarea.inp:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
textarea.inp { width: 100%; resize: vertical; min-height: 70px; }
.grid { display: grid; gap: 12px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpi { padding: 12px 14px; position: relative; }

.kpi .k-d { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .k-s { font-size: 11px; color: var(--muted); margin-top: 3px; }
.up { color: var(--b-green); } .down { color: var(--red); } .flat { color: var(--muted); }
.info { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); background: var(--cream); color: var(--muted); font-size: 10px; font-weight: 800; display: inline-grid; place-items: center; padding: 0; flex: none; }
.info:hover, .info:focus-visible { border-color: var(--red); color: var(--red); outline: 0; }
.pop { position: fixed; z-index: 60; max-width: 320px; background: var(--toast); color: var(--toast-ink); border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.2); pointer-events: none; }
.pop b { display: block; margin-bottom: 3px; font-size: 12.5px; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.cols3 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 999px) { .cols2, .cols3 { grid-template-columns: minmax(0, 1fr); } }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tt { position: absolute; pointer-events: none; background: var(--toast); color: var(--toast-ink); border-radius: 8px; padding: 7px 9px; font-size: 11.5px; line-height: 1.4; white-space: nowrap; z-index: 3; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.chart .tt i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.chead .sub { font-size: 12px; color: var(--muted); }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.n, table.t th.n { text-align: right; }
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.sortable { cursor: pointer; user-select: none; } .sortable.on { color: var(--ink); }
.na { color: var(--muted); font-size: 11.5px; font-weight: 600; }
.thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--cream-2); display: block; }
.cap { max-width: 320px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 700; background: var(--cream-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--green-soft); color: var(--b-green); } .pill.warn { background: var(--amber-soft); color: var(--b-amber); }
.pill.err { background: var(--red-soft); color: var(--red); } .pill.info2 { background: var(--blue-soft); color: var(--b-blue); }
.pdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.bar-row { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0, 1fr) 64px; gap: 10px; align-items: center; padding: 5px 0; font-size: 12.5px; }
.bar-row .track { height: 14px; background: var(--cream-2); border-radius: 4px; position: relative; overflow: hidden; }
.bar-row .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
.bar-row .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 13px; }
.banner.warn { background: var(--amber-soft); color: var(--b-amber); } .banner.err { background: var(--red-soft); color: var(--red); } .banner.info2 { background: var(--blue-soft); color: var(--b-blue); }
.banner b { font-weight: 800; }
.warns { margin: 0 0 12px; padding: 0; list-style: none; display: grid; gap: 4px; }
.warns li { font-size: 12px; color: var(--b-amber); background: var(--amber-soft); padding: 6px 10px; border-radius: 9px; }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); }
.acct { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.acct img, .acct .ph { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--cream-2); flex: none; }
.acct b { display: block; } .acct small { color: var(--muted); font-size: 12px; }
.prog { height: 8px; border-radius: 999px; background: var(--cream-2); overflow: hidden; margin: 8px 0 6px; position: relative; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--s1); }
.prog u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .45; }
.goal { padding: 14px; }
.goal .gv { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.modal { position: fixed; inset: 0; background: var(--scrim); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal.open { display: flex; }
.mcard { background: var(--surface); border-radius: 16px; width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.form { display: grid; gap: 10px; } .form label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mfoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); background: var(--toast); color: var(--toast-ink); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; opacity: 0; transition: .2s; pointer-events: none; z-index: 70; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.ask { display: flex; gap: 8px; } .ask textarea { min-height: 44px; }
.answer { font-size: 13.5px; line-height: 1.55; } .answer p { margin: 0 0 8px; } .answer ul { margin: 0 0 8px; padding-left: 20px; }
.answer table { border-collapse: collapse; margin: 6px 0 10px; font-size: 12.5px; } .answer th, .answer td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.answer h4 { margin: 10px 0 4px; font-size: 13px; }
td.nw { white-space: nowrap; } code.id { display: inline-block; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
.sugs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.sug { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.sug:hover { border-color: var(--red); }
.funnel .fs { display: grid; grid-template-columns: 150px minmax(0,1fr) 80px; gap: 10px; align-items: center; padding: 4px 0; }
.funnel .fb { height: 26px; border-radius: 0 6px 6px 0; min-width: 2px; }
.funnel .conv { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); padding-left: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.sec-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
@media (max-width: 640px) {
  .page-title { font-size: 19px; } .kpi .k-v { font-size: 20px; } .bar-row { grid-template-columns: 96px minmax(0,1fr) 54px; }
  .funnel .fs { grid-template-columns: 96px minmax(0,1fr) 60px; } .form .row2 { grid-template-columns: 1fr; } .filters { position: static; }
}
@media print {
  .top .tabs, .filters .no-print, .btn, .info, .banner .btn { display: none !important; }
  body { background: #fff; } .card { box-shadow: none; break-inside: avoid; } .filters { position: static; }
  .wrap { max-width: none; padding: 0; } .print-head { display: block !important; }
}
.print-head { display: none; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
</style>

<body>
<div class="top">
  <a class="brand-mark" href="index.html" aria-label="Back to the portal">V</a>
  <span class="page-title">Marketing <em>analytics</em></span>
  <span class="pill warn" id="stagingBadge" hidden title="Social numbers on this page are seeded demo data">STAGING · demo social data</span>
  <span class="sp"></span>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" class="tab on" data-tab="overview">Overview</button>
    <button type="button" class="tab" data-tab="instagram"><span class="dot" style="background:var(--p-instagram)"></span>Instagram</button>
    <button type="button" class="tab" data-tab="facebook"><span class="dot" style="background:var(--p-facebook)"></span>Facebook</button>
    <button type="button" class="tab" data-tab="threads"><span class="dot" style="background:var(--p-threads)"></span>Threads</button>
    <button type="button" class="tab" data-tab="tiktok"><span class="dot" style="background:var(--p-tiktok)"></span>TikTok</button>

    <button type="button" class="tab" data-tab="goals">Goals</button>
    <button type="button" class="tab" data-tab="ask">Ask AI</button>
    <button type="button" class="tab" data-tab="settings">Settings</button>
  </nav>
</div>

<main class="wrap">
  <div class="print-head" id="printHead"></div>
  <div class="filters" id="filters" hidden>
    <span class="chips" id="unitChips" role="group" aria-label="Market"></span>
    <span class="chips" id="rangeChips" role="group" aria-label="Date range">
      <button type="button" class="chip" data-days="7">7 days</button>
      <button type="button" class="chip on" data-days="30">30 days</button>
      <button type="button" class="chip" data-days="90">90 days</button>
      <button type="button" class="chip" data-days="custom">Custom</button>

      <input class="inp" type="date" id="fromDate" aria-label="From" /> – <input class="inp" type="date" id="toDate" aria-label="To" />

    <select class="sel" id="basisSel" aria-label="Revenue basis" title="Revenue basis">
      <option value="fee">Revenue: Vanmates fee</option>
      <option value="value">Revenue: contract value</option>
    </select>
    <select class="sel" id="modelSel" aria-label="Attribution model" title="Attribution model">
      <option value="last">Attribution: last non-direct touch</option>
      <option value="first">Attribution: first touch</option>
    </select>
    <span class="sp"></span>
    <span class="muted small" id="periodLbl"></span>
    <button type="button" class="btn btn-ghost btn-sm no-print" id="exportBtn">Export CSV</button>
    <button type="button" class="btn btn-ghost btn-sm no-print" id="pdfBtn" title="Print or save as PDF">Management PDF</button>
  </div>
  <div id="alertBanner"></div>
  <div id="app"><div class="empty">Loading…</div></div>

<div class="modal" id="modal"><div class="mcard" id="modalCard" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="pop" id="pop" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  'use strict';
  var API = 'https://vanmates-analytics.talatcan.workers.dev/api';
  // ?api=staging → the isolated staging Worker (seeded demo social data; CRM still read with your own login).
  var STAGING = /[?&]api=staging\b/.test(location.search);
  if (STAGING) API = 'https://vanmates-analytics-staging.talatcan.workers.dev/api';
  var sb = window.supabase.createClient(window.VM_SUPABASE_URL, window.VM_SUPABASE_KEY, { auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false } });
  var PL = { instagram: 'Instagram', facebook: 'Facebook', threads: 'Threads', tiktok: 'TikTok', meta_ads: 'Meta Ads' };
  var PCOL = { instagram: 'var(--p-instagram)', facebook: 'var(--p-facebook)', threads: 'var(--p-threads)', tiktok: 'var(--p-tiktok)', meta_ads: 'var(--s2)' };
  var UNIT = { CA: 'Canada', MX: 'Mexico', ALL: 'All markets' };
  var ROLE = { super_admin: 'Super Admin', marketing_admin: 'Marketing Admin', analyst: 'Marketing Analyst', executive: 'Read-only Executive' };
  var S = { me: null, tab: 'overview', unit: null, days: '30', from: '', to: '', basis: 'fee', model: 'last', sort: 'published', offset: 0, metric: 'views', leadCh: '', goalPeriod: '', cache: {} };
  try { var saved = JSON.parse(localStorage.getItem('vm-analytics') || '{}'); ['unit', 'days', 'from', 'to', 'basis', 'model'].forEach(function (k) { if (saved[k]) S[k] = saved[k]; }); } catch (e) {}

  function $(id) { return document.getElementById(id); }

  // Small, safe markdown subset for AI answers: text is escaped first; only **bold**, headings, bullets and pipe tables.
  function md(src) {
    var lines = esc(src).split(/\r?\n/), out = [], list = false, table = [];
    var inline = function (t) { return t.replace(/\\\*/g, '&#42;').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>'); };
    var flushTable = function () {
      if (!table.length) return;
      var rows = table.filter(function (r) { return !/^\s*\|?\s*:?-{2,}/.test(r); }).map(function (r) { return r.replace(/^\s*\||\|\s*$/g, '').split('|').map(function (c) { return inline(c.trim()); }); });
      out.push('<table><thead><tr>' + rows[0].map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.slice(1).map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
      table = [];
    };
    lines.forEach(function (l) {
      if (/^\s*\|.*\|\s*$/.test(l)) { if (list) { out.push('</ul>'); list = false; } table.push(l); return; }
      flushTable();
      var m;
      if ((m = /^\s*[-*•]\s+(.*)/.exec(l))) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
      if (list) { out.push('</ul>'); list = false; }
      if ((m = /^\s*#{1,4}\s+(.*)/.exec(l))) { out.push('<h4>' + inline(m[1]) + '</h4>'); return; }
      if (l.trim()) out.push('<p>' + inline(l) + '</p>');
    });
    flushTable(); if (list) out.push('</ul>');
    return out.join('');
  }

    h += '<div class="card pad" style="margin-top:12px"><h3>Metric availability matrix</h3><p class="note">What each platform can provide (by design) and what the live API actually returned for your accounts. “Not available” is shown instead of zero everywhere in the dashboard.</p><div class="tw"><table class="t"><thead><tr><th>Metric</th>' + ['instagram', 'facebook', 'threads', 'tiktok'].map(function (p) { return '<th>' + PL[p] + '</th>'; }).join('') + '</tr></thead><tbody>' + MATRIX_ROWS.map(function (m) {
      return '<tr><td>' + esc(MLABEL[m] || (m === 'followers' ? 'Followers' : m)) + '</td>' + ['instagram', 'facebook', 'threads', 'tiktok'].map(function (p) {
        var can = (h0.matrix[p] || []).indexOf(m) >= 0;
        var live = h0.availability.filter(function (a) { return a.platform === p && a.metric_code === m; });
        var ok = live.some(function (a) { return a.status === 'available'; }), bad = live.find(function (a) { return a.status !== 'available'; });
        if (!can) return '<td><span class="na">not offered</span></td>';
        if (ok) return '<td><span class="pill ok">✓ live</span></td>';
        if (bad) return '<td><span class="pill warn"' + tip(bad.provider_metric, [bad.status, bad.note]) + '>' + esc(bad.status) + '</span></td>';
        return '<td><span class="pill">expected</span></td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div></div>';
    // Access + settings
    if (S.me.can.manageAccess) {
      var gr = (await api('/access')).grants;
      h += '<div class="cols2" style="margin-top:12px"><div class="card pad"><h3>Who can see analytics</h3><p class="note">Portal admins are Super Admins. Everyone else needs a role here, limited to the markets you pick (and never wider than their portal countries).</p>' +
        (gr.length ? '<div class="tw"><table class="t"><thead><tr><th>Teammate</th><th>Role</th><th>Markets</th><th></th></tr></thead><tbody>' + gr.map(function (g) { return '<tr><td>' + esc(g.email) + '</td><td>' + esc(ROLE[g.role]) + '</td><td>' + esc(JSON.parse(g.units).join(', ')) + '</td><td><button type="button" class="btn btn-ghost btn-sm" data-ungrant="' + esc(g.email) + '">Remove</button></td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="note">No marketing roles granted yet.</p>') +
        '<form class="form" id="grantForm" style="margin-top:10px"><div class="row2"><label>Teammate email<input class="inp" name="email" type="email" required placeholder="name@vanmates.com"></label><label>Role<select class="sel" name="role"><option value="marketing_admin">Marketing Admin</option><option value="analyst" selected>Marketing Analyst</option><option value="executive">Read-only Executive</option></select></label></div><label>Markets<span style="display:flex;gap:12px;font-weight:500;color:var(--ink)"><span><input type="checkbox" name="u" value="CA" checked> Canada</span><span><input type="checkbox" name="u" value="MX"> Mexico</span></span></label><div><button class="btn btn-primary btn-sm">Grant access</button></div></form></div>';
      var st = await api('/settings');
      h += '<div class="card pad"><h3>Reporting settings</h3><form class="form" id="setForm"><div class="row2"><label>Attribution lookback (days)<input class="inp" type="number" min="1" max="180" name="lookback_days" value="' + st.lookback_days + '"></label><label>Default revenue basis<select class="sel" name="revenue_basis"><option value="fee"' + (st.revenue_basis === 'fee' ? ' selected' : '') + '>Vanmates fee revenue</option><option value="value"' + (st.revenue_basis === 'value' ? ' selected' : '') + '>Booked contract value</option></select></label></div>' +
        '<label>MXN per CAD (combined view conversion)<input class="inp" type="number" step="0.01" min="1" name="fx_rate" value="' + esc(st.fx.rate) + '"></label><p class="note">Current: ' + esc(st.fx.rate) + ' MXN/CAD as of ' + esc(st.fx.as_of) + ' (' + esc(st.fx.source) + '). The combined view reports in CAD at this rate.</p>' +
        '<p class="note">Lookback: a website visit older than this many days before the lead was created is not credited (the lead falls back to its CRM source).</p><div><button class="btn btn-primary btn-sm">Save settings</button></div></form></div></div>';
    }
    h += '<p class="note" style="margin-top:12px">Signed in as ' + esc(S.me.email) + ' · ' + esc(ROLE[S.me.role]) + ' · markets: ' + esc(S.me.units.join(', ')) + ' · AI analyst: ' + esc(S.me.providers.ai === 'claude' ? 'Claude' : 'Workers AI') + '</p>';
    return h;
  }
  document.addEventListener('click', async function (e) {
    var t = e.target.closest && e.target.closest('[data-connect],[data-sync],[data-backfill],[data-disc],[data-ungrant]'); if (!t) return;
    try {
      if (t.dataset.connect) { var sel = document.querySelector('[data-cunit="' + t.dataset.connect + '"]'); var r = await api('/connect', { method: 'POST', body: { platform: t.dataset.connect, unit_id: sel ? sel.value : S.me.units[0] } }); location.href = r.url; return; }
      if (t.dataset.sync || t.dataset.backfill) { t.disabled = true; t.textContent = 'Syncing…'; var s = await api('/accounts/sync', { method: 'POST', body: { id: t.dataset.sync || t.dataset.backfill, backfillDays: t.dataset.backfill ? 90 : 0 } }); toast(s.status === 'error' ? 'Sync failed: ' + s.error : 'Synced ' + s.rows + ' rows'); render(); return; }
      if (t.dataset.disc) {
        var id = t.dataset.disc;
        openModal('<h2>Disconnect account</h2><p class="note">Data refreshes stop immediately and the stored token is deleted. Child accounts (e.g. the Instagram account linked to this Page) are disconnected too.</p><form class="form" id="discForm"><label style="flex-direction:row;display:flex;gap:8px;color:var(--ink)"><input type="checkbox" name="purge"> Also delete stored post content (captions, thumbnails, per-post metrics)</label><label style="flex-direction:row;display:flex;gap:8px;color:var(--ink)"><input type="checkbox" name="purgeAll"> …and delete all historical daily metrics for it</label><div class="mfoot"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger">Disconnect</button></div></form>');
        $('discForm').addEventListener('submit', async function (ev) { ev.preventDefault(); var fd = new FormData(this); try { await api('/accounts/disconnect', { method: 'POST', body: { id: id, purge: !!fd.get('purge') || !!fd.get('purgeAll'), purgeAll: !!fd.get('purgeAll') } }); closeModal(); toast('Disconnected'); render(); } catch (err) { toast(err.message); } });
        return;
      }
      if (t.dataset.ungrant) { await api('/access', { method: 'POST', body: { email: t.dataset.ungrant, remove: true } }); toast('Access removed'); render(); }
    } catch (err) { toast(err.message); t.disabled = false; }
  });
  document.addEventListener('change', async function (e) {
    if (!e.target.dataset || !e.target.dataset.assign) return;
    try { await api('/accounts/assign', { method: 'POST', body: { id: e.target.dataset.assign, unit_id: e.target.value } }); toast('Market updated'); } catch (err) { toast(err.message); }
  });
  document.addEventListener('submit', async function (e) {
    if (e.target.id === 'grantForm') { e.preventDefault(); var fd = new FormData(e.target); try { await api('/access', { method: 'POST', body: { email: fd.get('email'), role: fd.get('role'), units: fd.getAll('u') } }); toast('Access granted'); render(); } catch (err) { toast(err.message); } }
    if (e.target.id === 'setForm') { e.preventDefault(); var f2 = new FormData(e.target); try { await api('/settings', { method: 'POST', body: { lookback_days: Number(f2.get('lookback_days')), revenue_basis: f2.get('revenue_basis'), fx_rate: Number(f2.get('fx_rate')) } }); toast('Settings saved'); S.me = await api('/me'); render(); } catch (err) { toast(err.message); } }
  });

  // ------------------------------------------------------------- modal
  function openModal(html) { $('modalCard').innerHTML = html; $('modal').classList.add('open'); var f = $('modalCard').querySelector('input,select,textarea'); if (f) f.focus(); }
  function closeModal() { $('modal').classList.remove('open'); }
  $('modal').addEventListener('click', function (e) { if (e.target.id === 'modal' || (e.target.closest && e.target.closest('[data-close]'))) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  // ------------------------------------------------------------- boot
  (async function boot() {
    try {
      S.me = await api('/me');
    } catch (e) {
      $('tabs').hidden = true;
      $('app').innerHTML = '<div class="card pad"><h2>Marketing analytics</h2><p class="note" style="margin-top:6px">' + esc(e.message) + '</p><a class="btn btn-ghost btn-sm" href="index.html">Back to the portal</a></div>';
      return;
    }
    if (!S.unit || (S.unit === 'ALL' ? S.me.units.length < 2 : S.me.units.indexOf(S.unit) < 0)) S.unit = S.me.units[0];
    if (!saved || !saved.basis) S.basis = S.me.settings.revenue_basis;
    syncFilters();
    if (STAGING) $('stagingBadge').hidden = false;
    var h = (location.hash || '#overview').slice(1).split('?')[0];
    loadAlerts();
    setTab(['overview', 'instagram', 'facebook', 'threads', 'tiktok', 'campaigns', 'goals', 'ask', 'settings'].indexOf(h) >= 0 ? h : 'overview', false);
  })();
})();
</script>
</body>
