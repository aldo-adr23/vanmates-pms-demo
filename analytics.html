<style>
:root{
  --cream:#FAF5ED; --cream-2:#F4ECDD; --red:#B94A3F; --red-dark:#A13A30; --red-soft:#F3DDD8; --ink:#2B211A; --muted:#7A6B5C;

  --grid:#EFE8DA; --axis:#9A8B7B; --p-instagram:#e87ba4; --p-facebook:#2a78d6; --p-threads:#1baf7a; --p-tiktok:#eda100;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --ord1:#1c5cab; --ord2:#2a78d6; --ord3:#5598e7; --ord4:#86b6ef;
}
:root[data-theme="dark"]{
  --cream:#1F1A16; --cream-2:#2A231E; --red:#D17262; --red-dark:#B95F50; --red-soft:#5C2B25; --ink:#F4ECDD; --muted:#A89685; --line:#3A302A;
  --green:#85A88E; --green-soft:#2C3E32; --amber:#E5C896; --amber-soft:#4A3C20; --blue:#6F9DC4; --blue-soft:#28394A; --surface:#26201B;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.30); --b-green:#B9D3C0; --b-amber:#F0D9AE; --b-blue:#B7D0E6; --scrim:rgba(0,0,0,.55); --toast:#F4ECDD; --toast-ink:#1F1A16;
  --grid:#342B25; --axis:#8C7B6B; --p-instagram:#d55181; --p-facebook:#3987e5; --p-threads:#199e70; --p-tiktok:#c98500;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --ord1:#86b6ef; --ord2:#5598e7; --ord3:#2a78d6; --ord4:#1c5cab;

}
* { box-sizing: border-box; }

.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--red); color: var(--on-red); display: grid; place-items: center; flex: none; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 15px; text-decoration: none; }

.linkbtn { border: 0; background: none; padding: 0; font-size: 12px; font-weight: 600; color: var(--red); cursor: pointer; white-space: nowrap; } .linkbtn:hover { text-decoration: underline; }
.dnote { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--b-amber); background: var(--amber-soft); padding: 7px 12px; border-radius: 9px; margin-bottom: 12px; } .dnote span { flex: 1; min-width: 200px; }
.covcell { display: flex; align-items: center; gap: 8px; } .covbar { flex: 1; min-width: 60px; height: 6px; border-radius: 3px; background: var(--cream-2); overflow: hidden; } .covbar i { display: block; height: 100%; }
.dlist { margin: 0; padding-left: 18px; font-size: 12.5px; display: grid; gap: 5px; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.kpi .k-p { display: inline-block; font-size: 11px; font-weight: 700; color: var(--b-amber); background: var(--amber-soft); padding: 2px 7px; border-radius: 7px; margin-top: 4px; }
.kpi.partial .k-v { color: var(--muted); }

.pop b { display: block; margin-bottom: 3px; font-size: 12.5px; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.cols3 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 999px) { .cols2, .cols3 { grid-template-columns: minmax(0, 1fr); } }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 700; background: var(--cream-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--green-soft); color: var(--b-green); } .pill.warn { background: var(--amber-soft); color: var(--b-amber); }
.pill.err { background: var(--red-soft); color: var(--red); } .pill.info2 { background: var(--blue-soft); color: var(--b-blue); }

.banner.warn { background: var(--amber-soft); color: var(--b-amber); } .banner.err { background: var(--red-soft); color: var(--red); } .banner.info2 { background: var(--blue-soft); color: var(--b-blue); }
.banner b { font-weight: 800; }
.warns { margin: 0 0 12px; padding: 0; list-style: none; display: grid; gap: 4px; }

.empty { padding: 30px 16px; text-align: center; color: var(--muted); }
.acct { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }

.acct b { display: block; } .acct small { color: var(--muted); font-size: 12px; }

.goal { padding: 14px; }
.goal .gv { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.modal { position: fixed; inset: 0; background: var(--scrim); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal.open { display: flex; }
.mcard { background: var(--surface); border-radius: 16px; width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.form { display: grid; gap: 10px; } .form label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mfoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); background: var(--toast); color: var(--toast-ink); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; opacity: 0; transition: .2s; pointer-events: none; z-index: 70; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.ask { display: flex; gap: 8px; } .ask textarea { min-height: 44px; }
.answer { font-size: 13.5px; line-height: 1.55; } .answer p { margin: 0 0 8px; } .answer ul { margin: 0 0 8px; padding-left: 20px; }

.sug:hover { border-color: var(--red); }

.funnel .conv { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); padding-left: 4px; }

<body>
<div class="top">
  <a class="brand-mark" href="index.html" aria-label="Back to the portal">V</a>
  <span class="page-title">Marketing <em>analytics</em></span>
  <span class="pill warn" id="stagingBadge" hidden title="Social numbers on this page are seeded demo data">STAGING · demo social data</span>
  <span class="sp"></span>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" class="tab on" data-tab="overview">Overview</button>
    <button type="button" class="tab" data-tab="leads">Leads</button>
    <button type="button" class="tab" data-tab="social">Social</button>
    <button type="button" class="tab" data-tab="campaigns">Paid &amp; campaigns</button>
    <button type="button" class="tab" data-tab="goals">Goals</button>
    <button type="button" class="tab" data-tab="data">Data</button>
    <button type="button" class="tab" data-tab="ask">Ask AI</button>
    <button type="button" class="tab" data-tab="settings">Settings</button>
  </nav>
</div>

<main class="wrap">
  <div class="print-head" id="printHead"></div>
  <div class="filters" id="filters" hidden>
    <span class="chips" id="unitChips" role="group" aria-label="Market"></span>
    <span class="chips" id="rangeChips" role="group" aria-label="Date range">
      <button type="button" class="chip" data-days="7">7 days</button>
      <button type="button" class="chip on" data-days="30">30 days</button>
      <button type="button" class="chip" data-days="90">90 days</button>
      <button type="button" class="chip" data-days="custom">Custom</button>
    </span>
    <span id="customRange" hidden>
      <input class="inp" type="date" id="fromDate" aria-label="From" /> – <input class="inp" type="date" id="toDate" aria-label="To" />
    </span>
    <select class="sel" id="basisSel" aria-label="Revenue basis" title="Revenue basis">
      <option value="fee">Revenue: Vanmates fee</option>
      <option value="value">Revenue: contract value</option>
    </select>
    <select class="sel" id="modelSel" aria-label="Attribution model" title="Attribution model">
      <option value="last">Attribution: last non-direct touch</option>
      <option value="first">Attribution: first touch</option>
    </select>
    <span class="sp"></span>
    <span class="muted small" id="periodLbl"></span>
    <button type="button" class="btn btn-ghost btn-sm no-print" id="exportBtn">Export CSV</button>
    <button type="button" class="btn btn-ghost btn-sm no-print" id="pdfBtn" title="Print or save as PDF">Management PDF</button>
  </div>
  <div id="alertBanner"></div>
  <div id="app"><div class="empty">Loading…</div></div>
</main>

<div class="modal" id="modal"><div class="mcard" id="modalCard" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="pop" id="pop" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  'use strict';
  var API = 'https://vanmates-analytics.talatcan.workers.dev/api';
  // ?api=staging → the isolated staging Worker (seeded demo social data; CRM still read with your own login).
  var STAGING = /[?&]api=staging\b/.test(location.search);
  if (STAGING) API = 'https://vanmates-analytics-staging.talatcan.workers.dev/api';

  // Small, safe markdown subset for AI answers: text is escaped first; only **bold**, headings, bullets and pipe tables.
  function md(src) {
    var lines = esc(src).split(/\r?\n/), out = [], list = false, table = [];
    var inline = function (t) { return t.replace(/\\\*/g, '&#42;').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>'); };
    var flushTable = function () {
      if (!table.length) return;
      var rows = table.filter(function (r) { return !/^\s*\|?\s*:?-{2,}/.test(r); }).map(function (r) { return r.replace(/^\s*\||\|\s*$/g, '').split('|').map(function (c) { return inline(c.trim()); }); });
      out.push('<table><thead><tr>' + rows[0].map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.slice(1).map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
      table = [];
    };
    lines.forEach(function (l) {
      if (/^\s*\|.*\|\s*$/.test(l)) { if (list) { out.push('</ul>'); list = false; } table.push(l); return; }
      flushTable();
      var m;
      if ((m = /^\s*[-*•]\s+(.*)/.exec(l))) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
      if (list) { out.push('</ul>'); list = false; }
      if ((m = /^\s*#{1,4}\s+(.*)/.exec(l))) { out.push('<h4>' + inline(m[1]) + '</h4>'); return; }
      if (l.trim()) out.push('<p>' + inline(l) + '</p>');
    });
    flushTable(); if (list) out.push('</ul>');
    return out.join('');
  }

    if (!saved || !saved.basis) S.basis = S.me.settings.revenue_basis;
    syncFilters();
    if (STAGING) $('stagingBadge').hidden = false;
    var h = (location.hash || '#overview').slice(1).split('?')[0];
    loadAlerts();
    setTab(h, false);
  })();
})();
</script>
</body>
