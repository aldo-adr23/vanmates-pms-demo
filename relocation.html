<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>Relocation · Vanmates</title>
<script>
try { document.documentElement.setAttribute('data-theme', localStorage.getItem('vm-theme') || 'light'); } catch (e) {}
</script>
<script>
// Same sign-in gate as lu.html: not signed in to the portal -> sign in, then come back here (index.html vm_next_path).
(function () {
  var ok = false;
  try {
    var s = JSON.parse(localStorage.getItem('sb-recbwmihyinlgxnymcmc-auth-token') || 'null');
    ok = !!(s && s.refresh_token);
  } catch (e) { ok = false; }
  if (!ok) {
    try { sessionStorage.setItem('vm_next_path', 'relocation.html' + location.search); } catch (e) {}
    location.replace('signin.html');
  }
})();
</script>
<style>
:root{ --cream:#FAF5ED; --ink:#2B211A; --muted:#8A7B6C; --line:#E4DBC9; --red:#B94A3F; --surface:#FFFFFF;
  --sans:"Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
:root[data-theme="dark"]{ --cream:#1F1A16; --ink:#F4ECDD; --muted:#A89685; --line:#3A302A; --red:#D17262; --surface:#26201B; }
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans)}
.box{max-width:460px;margin:12vh auto 0;padding:28px 24px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
h1{font-size:20px;margin:0 0 8px}
p{color:var(--muted);line-height:1.5;margin:8px 0}
a.btn{display:inline-block;margin-top:14px;padding:9px 16px;border-radius:999px;background:var(--red);color:#fff;text-decoration:none;font-weight:600}
@media (max-width:520px){ .box{margin:8vh 16px 0} }
</style>
</head>
<body>
<main class="box" id="box" aria-live="polite">
  <h1>Opening Relocation…</h1>
  <p>Signing you in to the relocation workspace with your portal account.</p>
</main>
<!-- Hidden form: a top-level POST, so the relocation site sets its own first-party session cookie. -->
<form id="sso" method="post" action="https://relocation.vanmates.com/api/relocation/staff/sso" hidden>
  <input type="hidden" name="access_token" />
  <input type="hidden" name="next" />
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var box = document.getElementById('box');
  var REASONS = {
    no_relocation_page: 'Your portal account doesn’t have the Relocation page. Ask an admin to tick Relocation under Team → your name → page access.',
    not_team_member: 'This account isn’t on the Vanmates team in the portal.',
    signed_out: 'Your portal session has ended. Sign in again.',
    portal_unavailable: 'The relocation workspace couldn’t check your account just now. Try again in a minute.',
    bad_request: 'Something went wrong opening Relocation. Try again.'
  };
  function show(title, msg, link) {
    box.innerHTML = '';
    var h = document.createElement('h1'); h.textContent = title; box.appendChild(h);
    var p = document.createElement('p'); p.textContent = msg; box.appendChild(p);
    var a = document.createElement('a'); a.className = 'btn'; a.href = link.href; a.textContent = link.text; box.appendChild(a);
  }

  // Back from the relocation workspace lands here: go to the portal instead of signing in again.
  var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
  if (nav.type === 'back_forward') { location.replace('index.html'); return; }
  window.addEventListener('pageshow', function (e) { if (e.persisted) location.replace('index.html'); });

  var denied = params.get('denied');
  if (denied) {
    if (denied === 'signed_out') {
      try { sessionStorage.setItem('vm_next_path', 'relocation.html'); } catch (e) {}
      show('Sign in again', REASONS.signed_out, { href: 'signin.html', text: 'Sign in' });
    } else {
      show('Can’t open Relocation', REASONS[denied] || REASONS.bad_request, { href: 'index.html', text: 'Back to the portal' });
    }
    return;
  }

  // Only a path inside the staff workspace (the relocation server checks this too).
  var next = params.get('next') || '';
  if (!/^\/relocation\/staff\.html(#[A-Za-z0-9\/_-]{0,120})?$/.test(next)) next = '/relocation/staff.html';

  var sb = window.supabase.createClient(window.VM_SUPABASE_URL, window.VM_SUPABASE_KEY,
    { auth: { autoRefreshToken: false, persistSession: true, detectSessionInUrl: false } });
  // getSession refreshes an expired access token, so the relocation server always gets a valid one.
  sb.auth.getSession().then(function (r) {
    var token = r && r.data && r.data.session && r.data.session.access_token;
    if (!token) {
      try { sessionStorage.setItem('vm_next_path', 'relocation.html'); } catch (e) {}
      location.replace('signin.html');
      return;
    }
    var f = document.getElementById('sso');
    f.elements.access_token.value = token;
    f.elements.next.value = next;
    f.submit();
  }).catch(function () {
    show('Can’t open Relocation', REASONS.bad_request, { href: 'relocation.html', text: 'Try again' });
  });
})();
</script>
</body>
</html>
