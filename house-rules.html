<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#FAF5ED" />
<meta name="robots" content="noindex,nofollow" />
<title>House rules · Vanmates</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script>
try { document.documentElement.setAttribute('data-theme', localStorage.getItem('vm-theme') || 'light'); } catch (e) {}
</script>
<script>
// Same sign-in gate as analytics.html. Who may read the agreements is decided by RLS (Arrivals or Tenants access).
(function () {
  var ok = false;
  try {
    var s = JSON.parse(localStorage.getItem('sb-recbwmihyinlgxnymcmc-auth-token') || 'null');
    ok = !!(s && s.access_token && (!s.expires_at || s.expires_at * 1000 > Date.now() - 3600e3));
  } catch (e) { ok = false; }
  if (!ok) {
    try { sessionStorage.setItem('vm_next_path', 'house-rules.html' + location.search); } catch (e) {}
    location.replace('signin.html');
  }
})();
</script>
<style>
:root{
  --cream:#FAF5ED; --cream-2:#F4ECDD; --red:#B94A3F; --red-dark:#A13A30; --red-soft:#F3DDD8; --ink:#2B211A; --muted:#7A6B5C;
  --line:#E4DBC9; --green:#5C8A6B; --green-soft:#E2EDDF; --amber:#C8923A; --amber-soft:#F4E5C7; --blue:#3F6E94; --blue-soft:#DCE7F1;
  --surface:#FFFFFF; --serif:"Playfair Display", Georgia, serif; --sans:"Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --shadow-sm: 0 1px 2px rgba(43,33,26,.05); --radius: 14px; --on-red:#fff; --b-green:#3e6049; --b-amber:#8a611f; --b-blue:#2b4f6e;
  --toast:#2B211A; --toast-ink:#FAF5ED;
}
:root[data-theme="dark"]{
  --cream:#1F1A16; --cream-2:#2A231E; --red:#D17262; --red-dark:#B95F50; --red-soft:#5C2B25; --ink:#F4ECDD; --muted:#A89685; --line:#3A302A;
  --green:#85A88E; --green-soft:#2C3E32; --amber:#E5C896; --amber-soft:#4A3C20; --blue:#6F9DC4; --blue-soft:#28394A; --surface:#26201B;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.30); --b-green:#B9D3C0; --b-amber:#F0D9AE; --b-blue:#B7D0E6; --toast:#F4ECDD; --toast-ink:#1F1A16;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --cream:#1F1A16; --cream-2:#2A231E; --red:#D17262; --red-soft:#5C2B25; --ink:#F4ECDD; --muted:#A89685; --line:#3A302A; --surface:#26201B;
    --green-soft:#2C3E32; --amber-soft:#4A3C20; --blue-soft:#28394A; --b-green:#B9D3C0; --b-amber:#F0D9AE; --b-blue:#B7D0E6; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--cream); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button { font: inherit; cursor: pointer; color: inherit; }
[hidden] { display: none !important; }
a { color: var(--red); }
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); flex: none; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--red); color: var(--on-red); display: grid; place-items: center; flex: none; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 15px; text-decoration: none; }
.page-title { font-family: var(--serif); font-weight: 700; font-size: 22px; line-height: 1.1; white-space: nowrap; }
.page-title em { font-style: italic; color: var(--red); font-weight: 600; }
.sp { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; min-height: 32px; border-radius: 999px; font-weight: 600; font-size: 12.5px; border: 1px solid transparent; white-space: nowrap; background: transparent; }
.btn-primary { background: var(--red); color: var(--on-red); } .btn-primary:hover { background: var(--red-dark); }
.btn-ghost { background: var(--surface); border-color: var(--line); } .btn-ghost:hover { background: var(--cream-2); }
.btn-green { background: var(--green-soft); color: var(--b-green); border-color: transparent; }
.btn-sm { min-height: 28px; padding: 2px 10px; font-size: 12px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .row:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.chips { display: inline-flex; gap: 2px; background: var(--cream-2); border-radius: 999px; padding: 3px; }
.chip { border: 0; border-radius: 999px; background: transparent; padding: 0 10px; font-size: 12px; font-weight: 600; min-height: 28px; color: var(--muted); white-space: nowrap; }
.chip.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.chip .n { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--red); color: var(--on-red); font-size: 11px; line-height: 18px; text-align: center; }
input.inp, select.sel, textarea.inp { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); min-height: 34px; padding: 6px 10px; font: inherit; font-size: 14px; outline: 0; min-width: 0; }
input.inp:focus, select.sel:focus, textarea.inp:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.banner { margin: 0 16px 10px; padding: 9px 12px; border-radius: 10px; font-size: 13px; background: var(--amber-soft); color: var(--b-amber); flex: none; }

/* two panes: agreements | open agreement */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); gap: 12px; padding: 0 16px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.list-head { padding: 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.list-head .cnt { font-size: 12px; color: var(--muted); }
.list { overflow-y: auto; flex: 1; }
.row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 10px 12px; }
.row:hover { background: var(--cream); } .row.on { background: var(--cream-2); }
.row .l1 { display: flex; align-items: center; gap: 6px; } .row .who { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.row .l2 { margin-top: 3px; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 9px; white-space: nowrap; }
.p-web { background: var(--green-soft); color: var(--b-green); } .p-tf { background: var(--cream-2); color: var(--muted); }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); }
.detail { overflow-y: auto; padding: 16px 18px 24px; }
.d-head { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.d-name { font-family: var(--serif); font-weight: 700; font-size: 22px; line-height: 1.15; flex: 1; min-width: 0; }
.back { display: none; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 13.5px; margin: 0 0 16px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; overflow-wrap: anywhere; }
.rules { white-space: pre-wrap; font-size: 13px; line-height: 1.55; background: var(--cream); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.sec { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--toast); color: var(--toast-ink); padding: 9px 14px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
@media (max-width: 759px) {
  .top { padding: 10px 12px; } .page-title { font-size: 19px; }
  .app { grid-template-columns: minmax(0, 1fr); padding: 0 8px 8px; }
  .app.open .list-pane { display: none; } .app:not(.open) .d-pane { display: none; }
  .back { display: inline-flex; }
  .banner { margin: 0 8px 8px; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand-mark" href="index.html" aria-label="Back to the portal">V</a>
  <div class="page-title">House <em>rules</em></div>
  <div class="sp"></div>
  <a class="btn btn-ghost btn-sm" href="https://vanmates.com/cherry-house-rules" target="_blank" rel="noopener">Open the form</a>
  <button class="btn btn-ghost btn-sm" id="csvBtn" disabled>Download CSV</button>
</header>
<div class="banner" id="errBanner" hidden></div>
<main class="app" id="app">
  <section class="pane list-pane" aria-label="Agreements">
    <div class="list-head">
      <input class="inp" id="q" type="search" placeholder="Search name, email or unit" autocomplete="off" />
      <div class="cnt" id="cnt"></div>
    </div>
    <div class="list" id="list"><div class="empty">Loading…</div></div>
  </section>
  <section class="pane d-pane" aria-label="Agreement" id="detail">
    <div class="empty">Choose an agreement on the left.</div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  'use strict';
  var sb = window.supabase.createClient(window.VM_SUPABASE_URL, window.VM_SUPABASE_KEY, { auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false } });
  var COLS = 'id,created_at,property,rules_version,full_name,email,move_in,building,unit_room,initials_1,initials_2,source';
  var S = { rows: [], q: '', open: null };

  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 4500); }
  function day(d) { if (!d) return '—'; var t = new Date(String(d).length === 10 ? d + 'T12:00:00Z' : d); return isNaN(t) ? String(d) : t.toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric', timeZone: String(d).length === 10 ? 'UTC' : undefined }); }
  function stamp(iso) { var t = new Date(iso); return isNaN(t) ? '' : t.toLocaleString('en-CA', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }
  function banner(t) { var b = $('errBanner'); b.textContent = t; b.hidden = !t; }

  function matches(r) {
    if (!S.q) return true;
    var hay = [r.full_name, r.email, r.unit_room, r.building].join(' ').toLowerCase();
    return S.q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }
  function renderList() {
    var rows = S.rows.filter(matches);
    $('cnt').textContent = rows.length === S.rows.length ? S.rows.length + ' agreements' : rows.length + ' of ' + S.rows.length + ' agreements';
    if (!rows.length) { $('list').innerHTML = '<div class="empty">' + (S.rows.length ? 'Nothing matches.' : 'No agreements yet.') + '</div>'; return; }
    $('list').innerHTML = rows.map(function (r) {
      return '<button class="row' + (S.open === r.id ? ' on' : '') + '" data-id="' + esc(r.id) + '">' +
        '<div class="l1"><span class="who">' + esc(r.full_name) + '</span><span class="t">' + esc(day(r.created_at)) + '</span></div>' +
        '<div class="l2">' + esc(r.building || r.property) + ' · ' + esc(r.unit_room) + ' · moving in ' + esc(day(r.move_in)) + '</div></button>';
    }).join('');
  }
  async function openRow(id) {
    S.open = id; renderList(); $('app').classList.add('open');
    var r = S.rows.find(function (x) { return x.id === id; }); if (!r) return;
    var res = await sb.from('house_rules_agreements').select('rules_text,ip').eq('id', id).maybeSingle();
    var more = (res && res.data) || {};
    var src = r.source === 'typeform' ? '<span class="pill p-tf">Typeform</span>' : '<span class="pill p-web">Website</span>';
    $('detail').innerHTML = '<div class="detail">' +
      '<div class="d-head"><button class="btn btn-ghost btn-sm back" id="backBtn">← All</button><div class="d-name">' + esc(r.full_name) + '</div>' + src + '</div>' +
      '<dl class="facts">' +
        '<dt>Agreed</dt><dd>' + esc(stamp(r.created_at)) + '</dd>' +
        '<dt>Residence</dt><dd>' + esc(r.building || r.property) + '</dd>' +
        '<dt>Unit and room</dt><dd>' + esc(r.unit_room) + '</dd>' +
        '<dt>Moving in</dt><dd>' + esc(day(r.move_in)) + '</dd>' +
        '<dt>Email</dt><dd><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></dd>' +
        '<dt>Initials</dt><dd>Part 1: ' + esc(r.initials_1) + ' · Part 2: ' + esc(r.initials_2) + '</dd>' +
        '<dt>Rules version</dt><dd>' + esc(r.rules_version) + '</dd>' +
      '</dl>' +
      '<div class="sec">Rules agreed to</div><div class="rules">' + esc(more.rules_text || '—') + '</div></div>';
    var bb = $('backBtn'); if (bb) bb.onclick = function () { $('app').classList.remove('open'); };
  }
  function csv() {
    var head = ['agreed_at', 'name', 'email', 'residence', 'unit_room', 'move_in', 'initials_1', 'initials_2', 'rules_version', 'source'];
    var q = function (v) { v = String(v === null || v === undefined ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [head.join(',')].concat(S.rows.filter(matches).map(function (r) {
      return [r.created_at, r.full_name, r.email, r.building || r.property, r.unit_room, r.move_in, r.initials_1, r.initials_2, r.rules_version, r.source].map(q).join(',');
    }));
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
    a.download = 'house-rules-agreements.csv'; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  async function load() {
    var sess = (await sb.auth.getSession()).data.session;
    if (!sess) { location.replace('signin.html'); return; }
    var all = [], from = 0;
    for (;;) {
      var res = await sb.from('house_rules_agreements').select(COLS).order('created_at', { ascending: false }).range(from, from + 999);
      if (res.error) {
        banner(/does not exist|schema cache/i.test(res.error.message) ? 'The agreements table isn’t set up yet (SQL house-rules-2026-11-19.sql).' : 'Couldn’t load agreements: ' + res.error.message);
        $('list').innerHTML = '<div class="empty">—</div>'; return;
      }
      all = all.concat(res.data || []);
      if (!res.data || res.data.length < 1000) break;
      from += 1000;
    }
    S.rows = all; $('csvBtn').disabled = !all.length; renderList();
  }
  $('q').addEventListener('input', function (e) { S.q = e.target.value.trim().toLowerCase(); renderList(); });
  $('list').addEventListener('click', function (e) { var b = e.target.closest('.row'); if (b) openRow(b.getAttribute('data-id')); });
  $('csvBtn').addEventListener('click', csv);
  load().catch(function (e) { banner('Couldn’t load agreements: ' + (e && e.message || e)); });
})();
</script>
</body>
</html>
