<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sign in · Vanmates</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FAF5ED; --cream-2:#F4ECDD;
    --red:#B94A3F; --red-dark:#A13A30; --red-deep:#6E271F; --red-soft:#F3DDD8;
    --ink:#2B211A; --muted:#7A6B5D; --line:#E4DBC9;
    --green-soft:#E3EEE6;
    --serif:"Playfair Display", Georgia, serif;
    --sans:"Plus Jakarta Sans", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:var(--sans);color:var(--ink)}
  body{
    min-height:100vh; background:var(--red-dark);
    display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center;
    position:relative; overflow-x:hidden;
  }

  /* ── Red side ── */
  .brand{
    position:absolute;left:56px;top:44px;z-index:2;
    display:flex;align-items:center;gap:12px;color:#fff;
    font-family:var(--serif);font-weight:700;font-size:23px;
  }
  .brand-mark{
    width:40px;height:40px;border-radius:11px;background:#fff;color:var(--red);
    display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:21px;
  }
  .hero{position:relative;z-index:2;padding:140px 56px 240px;color:#fff;max-width:640px}
  .hero h1{
    font-family:var(--serif);font-weight:600;font-size:clamp(40px,4.4vw,60px);line-height:1.06;
    letter-spacing:-1.2px;margin:0 0 20px;text-wrap:balance;
  }
  .hero .small{
    font-size:13px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;opacity:.78;
  }
  .roofs{position:fixed;left:0;right:0;bottom:0;width:100%;height:230px;z-index:1;pointer-events:none}

  /* ── Card ── */
  .card{
    position:relative;z-index:2;width:440px;margin:48px 96px 48px 24px;
    background:var(--cream);border-radius:18px;padding:40px 40px 34px;
    box-shadow:0 40px 80px #3b0f0a55;
  }
  .form-title{font-family:var(--serif);font-weight:700;font-size:32px;letter-spacing:-.5px;margin:0}
  .form-sub{color:var(--muted);font-size:14.5px;margin:6px 0 26px;line-height:1.5}

  #gis-button-host{min-height:44px;display:flex;justify-content:center}
  .btn-google{
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:12px 18px;font-family:inherit;font-size:14.5px;font-weight:600;
    color:var(--ink);cursor:pointer;transition:.12s ease;
  }
  .btn-google:hover{border-color:#c9bca5;background:#fffdf9}
  .btn-google svg{width:20px;height:20px}

  .divider{
    display:flex;align-items:center;gap:14px;margin:22px 0;
    color:var(--muted);font-size:12.5px;font-weight:500;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:7px}
  .field-row{display:flex;justify-content:space-between;align-items:baseline}
  .input-wrap{position:relative}
  .field input{
    width:100%;height:46px;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:0 14px;font-family:inherit;font-size:14.5px;color:var(--ink);
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  .field input::placeholder{color:#b3a593}
  .field input:hover{border-color:#d4c8b2}
  .field input:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
  .input-wrap input{padding-right:64px}
  .toggle-pw{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    border:0;background:transparent;color:var(--muted);font:600 12.5px var(--sans);
    padding:8px 10px;border-radius:7px;cursor:pointer;
  }
  .toggle-pw:hover{color:var(--ink);background:var(--cream-2)}
  .forgot-link{font-size:12.5px;color:var(--red);font-weight:600;text-decoration:none}
  .forgot-link:hover{text-decoration:underline}
  a:focus-visible,button:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--red);outline-offset:2px}

  .checkbox-row{display:flex;align-items:center;gap:9px;margin:4px 0 20px}
  .checkbox-row input{width:16px;height:16px;margin:0;accent-color:var(--red)}
  .checkbox-row label{font-size:13.5px;color:var(--muted);cursor:pointer}

  .btn-primary{
    width:100%;height:48px;background:var(--red);color:#fff;border:0;border-radius:10px;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
    transition:background .12s ease, transform .05s ease;
  }
  .btn-primary:hover{background:var(--red-dark)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-primary:disabled{opacity:.7;cursor:progress}

  .msg{
    display:none;margin:0 0 18px;padding:11px 14px;border-radius:10px;font-size:13.5px;line-height:1.45;
    border:1px solid;
  }
  .msg.show{display:block}
  .msg.error{background:#FBEDEA;border-color:#EFC9C2;color:#8E2F25}
  .msg.ok{background:var(--green-soft);border-color:#C6DCCC;color:#2F5A3D}

  @media (max-width:1100px){
    .card{margin-right:48px}
    .hero{padding-right:24px}
  }
  @media (max-width:860px){
    body{display:block;min-height:100vh}
    .brand{position:static;padding:24px 20px 0}
    .hero{padding:28px 20px 36px}
    .hero h1{font-size:34px;margin-bottom:12px}
    .roofs{display:none}
    .card{width:auto;margin:0 16px 32px;padding:28px 22px 24px}
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="brand-mark">V</div>
    <div>Vanmates</div>
  </div>

  <div class="hero">
    <h1>This world is more than ordinary.</h1>
    <div class="small">Employee invite-only portal</div>
  </div>

  <svg class="roofs" viewBox="0 0 1200 230" preserveAspectRatio="none" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="2" aria-hidden="true">
    <path d="M0 230V170h60v-30l45-40 45 40v90M150 230V150h40l50-55 50 55v80M290 230V180h70v-40l38-34 38 34v90M436 230V160l60-60 60 60v70M556 230V185h50v-45l42-38 42 38v90M690 230V150h30l55-58 55 58v80M830 230V175h60v-35l40-36 40 36v90M970 230V160l58-56 58 56v70M1086 230V180h40v-30l37-33 37 33"/>
    <path d="M80 230v-40h24v40M215 230v-50h28v50M380 230v-34h22v34M480 230v-46h30v46M630 230v-36h22v36M760 230v-52h30v52M910 230v-38h22v38M1010 230v-48h30v48"/>
    <path d="M168 200h22v-22h-22zM318 210h24v-20h-24zM708 196h22v-22h-22zM850 206h24v-20h-24zM1104 206h20v-20h-20z"/>
  </svg>

  <main class="card">
    <h2 class="form-title">Sign in</h2>
    <p class="form-sub">Use your Vanmates Google account or work email.</p>

    <div id="signin-msg" class="msg" role="alert" aria-live="polite"></div>

    <!-- Google's official rendered button replaces this container on load -->
    <div id="gis-button-host"></div>
    <button type="button" class="btn-google" id="gis-fallback-btn" onclick="signInWithGoogle()" style="display:none">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A10.997 10.997 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09 0-.73.13-1.43.35-2.09V7.07H2.18A10.997 10.997 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or with email</div>

    <form onsubmit="signIn(event)">
      <div class="field">
        <label for="email">Work email</label>
        <input type="email" id="email" name="email" placeholder="you@vanmates.com" autocomplete="username" required />
      </div>
      <div class="field">
        <div class="field-row">
          <label for="password">Password</label>
          <a class="forgot-link" href="#" onclick="requestPasswordReset(event)">Forgot password?</a>
        </div>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required />
          <button type="button" class="toggle-pw" onclick="togglePassword(this)" aria-label="Show password">Show</button>
        </div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="remember" checked /> <label for="remember">Keep me signed in for 30 days</label>
      </div>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
  </main>

<!-- Google Identity Services (loaded async) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Supabase JS client (Phase 1: real auth backend) -->
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
const GOOGLE_CLIENT_ID = "802991869168-0dpre0q2b939vmdi6einvlurgkif9h7o.apps.googleusercontent.com";

// Initialize Supabase client. Without it nobody can sign in: the portal only
// trusts a real Supabase session (there is no client-side fallback any more).
const sb = (window.VM_SUPABASE_URL && window.VM_SUPABASE_KEY && window.supabase)
  ? window.supabase.createClient(window.VM_SUPABASE_URL, window.VM_SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    })
  : null;

// Inline status under the title (replaces browser alert() pop-ups).
function showMsg(text, kind){
  const el = document.getElementById("signin-msg");
  if(!el) return;
  el.textContent = text;
  el.className = "msg show " + (kind === "ok" ? "ok" : "error");
}
function clearMsg(){
  const el = document.getElementById("signin-msg");
  if(el){ el.className = "msg"; el.textContent = ""; }
}
function togglePassword(btn){
  const input = document.getElementById("password");
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  btn.textContent = show ? "Hide" : "Show";
  btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
}

function decodeJwt(token){
  try {
    const payload = token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(decodeURIComponent(escape(atob(payload))));
  } catch(e){ return null; }
}

// Is this email on the team? Asked of the team table, not of a hardcoded list.
// Returns true, false, or null when the question could not be answered (no
// client, RLS refusal, network error). Callers treat null as "do not block":
// a policy quirk must never lock the team out of their own portal.
async function isTeamMember(email){
  if(!sb) return null;
  try {
    const { data, error } = await sb
      .from("team_members")
      .select("id")
      .ilike("email", email)
      .limit(1);
    if(error){
      console.warn("[signin] team_members lookup failed:", error.message);
      return null;
    }
    if(Array.isArray(data) && data.length > 0) return true;
    // No match. Before calling that a "no", check whether this session can see
    // the table at all — if RLS hides every row, an empty result says nothing
    // about membership, and blocking on it would lock real staff out.
    const probe = await sb.from("team_members").select("id").limit(1);
    if(probe.error || !Array.isArray(probe.data) || probe.data.length === 0){
      console.warn("[signin] team_members is unreadable for this session — not blocking");
      return null;
    }
    return false;
  } catch(err){
    console.warn("[signin] team_members lookup threw:", err.message);
    return null;
  }
}

// opts.verified — a real Supabase session was just created for this identity.
// Verified identities are checked against the team table, which is what
// "invite-only" actually means. An unverified one (the demo prompt in
// signInWithGoogle below) proves nothing about who is typing, so it stays on
// the legacy allowlist.
async function finishSignIn(profile, opts){
  // profile = { email, name, picture, sub }
  if(!profile || !profile.email){
    showMsg("We couldn't read your Google account info. Please try again.");
    return;
  }
  // Only a verified identity (a real Supabase session) may sign in. The old
  // unverified path let a typed email through on a hardcoded allowlist, and
  // its demo prompt came pre-filled with aldo@vanmates.com.
  if(!(opts && opts.verified)){
    showMsg("Google sign-in couldn't be completed. Please try again, or sign in with your email and password.");
    return;
  }
  const email = profile.email.toLowerCase();
  const onTeam = await isTeamMember(email);
  if(onTeam === false){
    // Google authenticated them, so a Supabase session exists — drop it, or a
    // rejected visitor keeps a live session and lands in an empty portal shell.
    if(sb){ try { await sb.auth.signOut(); } catch(err){ /* best effort */ } }
    showMsg(
      `${profile.email} isn't on the Vanmates team yet. ` +
      `The portal is invite-only: ask a workspace admin (aldo@vanmates.com) to send you an invite.`
    );
    return;
  }
  // Persist for the PMS to read on load
  sessionStorage.setItem("vm_session", JSON.stringify({
    email: profile.email,
    name: profile.name,
    picture: profile.picture || null,
    sub: profile.sub || null,
    signedInAt: new Date().toISOString(),
    via: "google"
  }));
  window.location.href = "index.html";
}

async function handleCredentialResponse(resp){
  const profile = decodeJwt(resp.credential);

  // Try to also create a real Supabase session so RLS allows reads + writes
  // in the PMS. This requires Google to be enabled as an Auth provider in
  // Supabase (Auth → Providers → Google) using the same Client ID. If that's
  // not configured yet, signInWithIdToken returns an error and we fall through
  // to the legacy sessionStorage-only flow (the portal still works for reads
  // via the defensive hydrate; writes will silently fail until Supabase is
  // wired up).
  let verified = false;
  if(sb){
    try {
      const { error } = await sb.auth.signInWithIdToken({
        provider: "google",
        token: resp.credential
      });
      if(error){
        console.warn("[signin] Supabase Google sign-in not configured yet:", error.message);
      } else {
        verified = true;
        console.log("[signin] Supabase session created via Google ID token");
      }
    } catch(err){
      console.warn("[signin] Supabase Google sign-in threw:", err.message);
    }
  }

  await finishSignIn(profile, { verified });
}

function signInWithGoogle(){
  // Real Google Identity Services requires HTTPS. If we're on HTTP (e.g. while
  // the Let's Encrypt cert is still provisioning for portal.vanmates.com),
  // GIS silently refuses to initialize — then we say so (no demo prompt).
  const isSecure = location.protocol === "https:";
  const haveRealId = GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.startsWith("REPLACE_ME");
  const gisReady = !!window.google?.accounts?.id;

  if(isSecure && haveRealId && gisReady){
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse,
      ux_mode: "popup",
      auto_select: false,
    });
    google.accounts.id.prompt();
    return;
  }

  // No demo fallback: it asked for an email (pre-filled with Aldo's) and
  // signed in whoever was typed, with no proof of identity.
  showMsg("Google sign-in didn't load. Reload the page, or sign in with your email and password.");
}

async function signIn(e){
  e.preventDefault();
  const email = (document.querySelector('input[type="email"]')?.value || "").trim().toLowerCase();
  const password = (document.getElementById("password")?.value || "");
  clearMsg();

  // Real auth via Supabase
  if(sb){
    const submitBtn = e.target.querySelector('button[type="submit"]');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Signing in…"; }
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error){
        showMsg("Sign-in failed: " + error.message + ". " +
                "If you haven't set a password yet, click \"Forgot password?\" to get a reset link.");
        if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Sign in"; }
        return;
      }
      // The PMS reads the Supabase session on load (see vanmates-pms.html).
      // Also write a vm_session shim for backwards compatibility.
      sessionStorage.setItem("vm_session", JSON.stringify({
        email: data.user.email,
        name: data.user.user_metadata?.name || data.user.email.split("@")[0],
        picture: data.user.user_metadata?.avatar_url || null,
        sub: data.user.id,
        signedInAt: new Date().toISOString(),
        via: "password"
      }));
      window.location.href = "index.html";
      return;
    } catch(err){
      showMsg("Couldn't reach the sign-in server (" + err.message + "). Check your connection and try again.");
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Sign in"; }
      return;
    }
  }

  // No Supabase client means no way to prove who this is — refuse.
  showMsg("Sign-in is unavailable right now (couldn't reach the auth service). Please reload and try again.");
}

// "Forgot password?" handler — sends Supabase password-reset email
async function requestPasswordReset(e){
  e.preventDefault();
  const email = (document.querySelector('input[type="email"]')?.value || "").trim().toLowerCase();
  if(!email){ showMsg("Enter your work email above first, then click \"Forgot password?\"."); document.getElementById("email")?.focus(); return; }
  if(!sb){
    // Fall back to mailto if Supabase isn't reachable
    window.location.href = `mailto:aldo@vanmates.com?subject=${encodeURIComponent("Password reset — Vanmates Portal")}&body=${encodeURIComponent("Hi Aldo,\n\nI need a password reset for " + email + ".\n\nThanks!")}`;
    return;
  }
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + "/reset-password.html"
  });
  if(error){
    showMsg("Couldn't send the reset email: " + error.message);
  } else {
    showMsg("Reset link sent to " + email + ". Check your inbox (and spam folder).", "ok");
  }
}

// Initialize GIS once on page load and render the official Google button.
// Using renderButton (instead of prompt/One Tap) avoids the FedCM
// "AbortError: signal is aborted" that breaks the One Tap flow in some
// browsers and when third-party cookies/credentials APIs are restricted.
window.addEventListener("load", () => {
  const isSecure = location.protocol === "https:";
  const haveRealId = GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.startsWith("REPLACE_ME");
  const fallbackBtn = document.getElementById("gis-fallback-btn");
  const host = document.getElementById("gis-button-host");

  // No HTTPS or no real client id → show the plain button; signInWithGoogle()
  // retries GIS and otherwise says so (no demo flow).
  if(!isSecure || !haveRealId){
    if(fallbackBtn){ fallbackBtn.style.display = ""; host.style.display = "none"; }
    return;
  }

  let attempts = 0;
  const tryRender = () => {
    attempts++;
    if(!window.google?.accounts?.id){
      if(attempts < 25) return setTimeout(tryRender, 200);
      // GIS never loaded — show the legacy fallback button
      if(fallbackBtn){ fallbackBtn.style.display = ""; host.style.display = "none"; }
      return;
    }
    try {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        ux_mode: "popup",
        auto_select: false,
      });
      google.accounts.id.renderButton(host, {
        theme: "outline",
        size: "large",
        type: "standard",
        text: "continue_with",
        shape: "rectangular",
        logo_alignment: "left",
        width: Math.min(400, Math.max(240, host.clientWidth || 400)),
      });
    } catch(err) {
      console.warn("[signin] renderButton failed, using legacy fallback:", err.message);
      if(fallbackBtn){ fallbackBtn.style.display = ""; host.style.display = "none"; }
    }
  };
  tryRender();
});
</script>
</body>
</html>
