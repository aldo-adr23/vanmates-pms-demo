.crow:last-child { border-bottom: 0; } .crow:hover { background: var(--cream); }
.crow .cm { flex: 1; min-width: 0; } .crow b, .crow small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .crow small { color: var(--muted); font-size: 12px; }
.cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; } .cdot.ok { background: var(--green); } .cdot.cur { background: var(--blue); } .cdot.warn { background: var(--amber); } .cdot.bad { background: var(--red); }
.dempty { padding: 22px 14px; text-align: center; color: var(--muted); font-size: 13px; }
.stop-on { background: var(--red); color: var(--on-red); padding: 8px 14px; border-radius: 10px; font-weight: 700; margin: 0 0 10px; }
</style>
</head>
<body>
<div class="top">
  <a class="brand-mark" href="index.html" aria-label="Back to the portal">V</a>
  <span class="page-title">Email <em>marketing</em></span>
  <select class="sel" id="scopeSel" style="width:auto;min-width:160px" hidden aria-label="Business area"></select>
  <span class="sp"></span>
  <nav class="tabs" id="tabs" hidden aria-label="Sections">
    <button type="button" class="tab on" data-tab="overview">Overview</button>
    <button type="button" class="tab" data-tab="lists">Lists &amp; contacts</button>
    <button type="button" class="tab" data-tab="templates">Templates</button>
    <button type="button" class="tab" data-tab="campaigns">Campaigns</button>
    <button type="button" class="tab" data-tab="automations">Automations</button>
    <button type="button" class="tab" data-tab="reports">Reports</button>
    <button type="button" class="tab" data-tab="access" id="tabAccess" hidden>Access &amp; settings</button>
  </nav>
</div>

<main class="wrap" id="app"><div class="empty">Loading…</div></main>

<div class="modal" id="modal"><div class="mcard" id="modalCard" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="marketing-core.js?v=2026-10-15-furows1"></script>
<script>
(function () {
  'use strict';
  var HM = 'https://vanmates-homestay-matching.talatcan.workers.dev';
  var sb = window.supabase.createClient(window.VM_SUPABASE_URL, window.VM_SUPABASE_KEY,
    { auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false } });
  var TZS = ['America/Vancouver', 'America/Edmonton', 'America/Winnipeg', 'America/Toronto', 'America/Halifax', 'America/Mexico_City', 'UTC'];
  var LANGS = { en: 'English', fr: 'French', es: 'Spanish', ja: 'Japanese', ko: 'Korean', pt: 'Portuguese', zh: 'Chinese' };
  var CONSENT = { express: 'Express', implied: 'Implied (2 years)', unknown: 'Unknown', withdrawn: 'Withdrawn' };
  var S = { me: null, scope: null, tab: 'overview', lists: [], listId: null, contacts: [], ctTotal: 0, q: '', consent: '', templates: [], tplId: null, tpl: null,
    campaigns: [], campId: null, camp: null, view: 'calendar', month: null, emailId: null, report: null, reportCamp: null, rfilter: 'all', rsusp: false, poll: null };

  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 4500); }
  function st(s) { return '<span class="st st-' + MK.statusTone(s) + '">' + esc(MK.statusLabel(s)) + '</span>'; }
  function opts(map, sel, blank) {
    return (blank !== undefined ? '<option value="">' + esc(blank) + '</option>' : '') + Object.keys(map).map(function (k) {
      return '<option value="' + esc(k) + '"' + (String(k) === String(sel) ? ' selected' : '') + '>' + esc(map[k]) + '</option>'; }).join('');
  }
  function can(a) { var s = (S.me && S.me.scopes || []).find(function (x) { return x.id === S.scope; }); return !!(s && s.actions.indexOf(a) >= 0); }
  function scopeName(id) { var s = (S.me.scopes || []).find(function (x) { return x.id === id; }); return s ? s.name : id; }

  async function api(action, body) {
    var sess = (await sb.auth.getSession()).data.session;
    if (!sess) { location.replace('signin.html'); throw new Error('signed out'); }
    var r = await fetch(HM + '/mk/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + sess.access_token }, body: JSON.stringify(body || {}) });
    var j = await r.json().catch(function () { return { error: 'failed' }; });
    if (!r.ok) { var e = new Error(MK.errorText(j.error, j.detail)); e.code = j.error; e.detail = j.detail; e.status = r.status; throw e; }
    return j;
  }
  async function act(fn, okMsg) {
    try { var r = await fn(); if (okMsg) toast(okMsg); return r; }
    catch (e) { toast(e.message); if (Array.isArray(e.detail)) showProblems('Not saved', e.detail); return null; }
  }
  function modal(html, wide) { $('modalCard').className = 'mcard' + (wide ? ' wide' : ''); $('modalCard').innerHTML = html; $('modal').classList.add('open'); }
  function closeModal() { $('modal').classList.remove('open'); $('modalCard').innerHTML = ''; }
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  function showProblems(title, list) {
    modal('<h2>' + esc(title) + '</h2><div class="warnbox"><ul>' + list.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div><div class="actions"><button class="btn btn-ghost" data-x="close">Close</button></div>');
  }

  // ---------- boot ----------
  async function boot() {
    try { S.me = await api('me'); }
    catch (e) { $('app').innerHTML = '<div class="card lock"><h1>Email marketing</h1><p class="muted">' + esc(e.message) + '</p><a class="btn btn-ghost" href="index.html">Back to the portal</a></div>'; return; }
    if (!S.me.scopes.length) {
      $('app').innerHTML = '<div class="card lock"><h1>No access yet</h1><p class="muted">Email marketing is opened per business area. Ask an administrator to give you access.</p><a class="btn btn-ghost" href="index.html">Back to the portal</a></div>';
      return;
    }
    var saved = null; try { saved = localStorage.getItem('mk-scope'); } catch (e) {}
    S.scope = S.me.scopes.some(function (s) { return s.id === saved; }) ? saved : S.me.scopes[0].id;
    var sel = $('scopeSel');
    sel.innerHTML = S.me.scopes.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === S.scope ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('');
    sel.hidden = S.me.scopes.length < 2;
    sel.addEventListener('change', function () { S.scope = sel.value; try { localStorage.setItem('mk-scope', S.scope); } catch (e) {} S.listId = S.campId = S.camp = S.tplId = S.tpl = S.report = null; go(S.tab); });
    $('tabs').hidden = false;
    $('tabAccess').hidden = !S.me.admin;
    $('tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) go(b.dataset.tab); });
    var h = (location.hash || '').replace('#', '');
    go(['overview', 'lists', 'templates', 'campaigns', 'automations', 'reports', 'access'].indexOf(h) >= 0 ? h : 'overview');
  }
  function go(tab) {
    S.tab = tab;
    clearInterval(S.poll); S.poll = null;
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('on', t.dataset.tab === tab); });
    try { history.replaceState(null, '', '#' + tab); } catch (e) {}
    $('app').innerHTML = '<div class="empty">Loading…</div>';
    ({ overview: overview, lists: lists, templates: templates, campaigns: campaigns, automations: automations, reports: reports, access: access })[tab]();
  }

  // ---------- overview: campaign builder + dashboard ----------
  // Step 1 context (what the campaign is about), step 2 look (a saved template as the model, or let the AI design it),
  // step 3 audience (pick lists or make one). "Write it with AI" creates the draft and starts generation; nothing is sent.
  var IDEAS = [
    { k: 'avail', name: 'Availability push', months: 2, per: 2, text: 'Ask everyone to update their availability for the coming season. Keep it short and make the button the main thing.' },
    { k: 'year', name: 'Year-round engagement', months: 12, per: 2, text: 'A 12-month campaign, two emails a month: availability check-ins, practical tips, referrals and appreciation. Vary the topics with the seasons.' },
    { k: 'welcome', name: 'Welcome series', months: 1, per: 4, text: 'Welcome new people: what to expect, how we support them, who to contact, and the one thing to do first.' },
    { k: 'recruit', name: 'Recruit new people', months: 3, per: 2, text: 'Invite people to join: why it is worth it, how it works, what support they get, and a clear button to apply.' },
    { k: 'reengage', name: 'Win back quiet contacts', months: 2, per: 2, text: 'Reconnect with people who have gone quiet: a friendly check-in, what is new, and an easy way to reply or update their details.' },
    { k: 'one', name: 'One announcement', months: 1, per: 1, text: 'A single email announcing ' }
  ];
  function wizNew() { return { step: 1, idea: '', ideaK: '', name: '', months: 3, per: 2, start: '', lang: 'en', tz: 'America/Vancouver', tplId: 0, listIds: [] }; }
  async function overview() {
    if (!S.wiz || S.wiz.scope !== S.scope) { S.wiz = wizNew(); S.wiz.scope = S.scope; }
    S.tplCache = S.tplCache || {};
    var res = await Promise.all([
      act(function () { return api('overview', { scope: S.scope }); }),
      can('edit') ? api('lists.list', { scope: S.scope }).catch(function () { return null; }) : null,
      can('edit') ? api('templates.list', { scope: S.scope }).catch(function () { return null; }) : null
    ]);
    if (!res[0]) return;
    S._ov = res[0];
    if (res[1]) S.lists = res[1].lists;
    S._ovTpls = res[2] ? res[2].templates : [];
    var o = S._ov, s = o.scopes[0] || {};
    $('app').innerHTML = (o.emergency_stop ? '<div class="stop-on">Emergency stop is ON: no marketing email is being sent.</div>' : '') +
      (can('edit') ? '<section class="hero card" id="wiz"></section>' : '') +
      '<section class="dash">' + dashboard(s) + '</section>';
    if (can('edit')) drawWiz();
  }
  function drawWiz() {
    var w = S.wiz, host = $('wiz');
    if (!host) return;
    var names = ['What it’s about', 'Look & template', 'Who gets it'];
    var steps = '<div class="steps" role="list">' + names.map(function (n, i) {
      var k = i + 1, cls = k === w.step ? ' on' : (k < w.step ? ' done' : '');
      return '<button type="button" role="listitem" class="stp' + cls + '" data-wstep="' + k + '"' + (k > w.step && !wizOk(k - 1) ? ' disabled' : '') + '><span class="n">' + (k < w.step ? '✓' : k) + '</span><span class="sl">' + n + '</span></button>'; }).join('') + '</div>';
    var body = w.step === 1 ? wizContext() : w.step === 2 ? wizTemplate() : wizAudience();
    host.innerHTML = '<div class="hero-hd"><div><h1>Start a campaign</h1><p>Tell the AI what you want, pick a look, choose who gets it. You review every email before anything is sent.</p></div></div>' + steps + '<div class="wbody">' + body + '</div>';
    if (w.step === 2) loadTplPreviews();
  }
  function wizOk(step) {
    var w = S.wiz;
    if (step === 1) return w.idea.trim().length >= 10;
    if (step === 2) return true;
    return w.listIds.length > 0;
  }
  function wizNav(back, nextLabel, nextX) {
    return '<div class="wnav">' + (back ? '<button class="btn btn-ghost" data-wstep="' + (S.wiz.step - 1) + '">← Back</button>' : '') + '<span class="sp"></span>' +
      '<button class="btn btn-primary btn-lg" data-x="' + nextX + '"' + (wizOk(S.wiz.step) ? '' : ' disabled') + ' id="wNext">' + nextLabel + '</button></div>';
  }
  function wizContext() {
    var w = S.wiz;
    var dur = { '1x1': 'One email', '1': '1 month', '2': '2 months', '3': '3 months', '6': '6 months', '12': '12 months' };
    var durV = w.months === 1 && w.per === 1 ? '1x1' : String(w.months);
    return '<div class="ideas" aria-label="Ideas">' + IDEAS.map(function (i) { return '<button class="idea' + (w.ideaK === i.k ? ' on' : '') + '" data-idea="' + i.k + '">' + esc(i.name) + '</button>'; }).join('') + '</div>' +
      '<label class="f full big">Describe the campaign: goal, audience, what you want people to do<textarea class="inp" rows="4" data-wf="idea" id="wIdea" placeholder="e.g. Ask our hosts to update their availability for January arrivals, share two hosting tips, and thank them for hosting this fall.">' + esc(w.idea) + '</textarea></label>' +
      '<div class="wgrid">' +
        '<label class="f">Length<select class="sel" data-wf="dur">' + opts(dur, durV) + '</select></label>' +
        '<label class="f"' + (durV === '1x1' ? ' hidden' : '') + '>Emails per month<select class="sel" data-wf="per">' + opts({ 1: '1', 2: '2', 3: '3', 4: '4' }, w.per) + '</select></label>' +
        '<label class="f">First send<input class="inp" type="date" data-wf="start" value="' + esc(w.start) + '"></label>' +
        '<label class="f">Language<select class="sel" data-wf="lang">' + opts(LANGS, w.lang) + '</select></label>' +
      '</div>' + wizNav(false, 'Next: choose a look →', 'w-next');
  }
  function wizTemplate() {
    var w = S.wiz;
    var tiles = '<button class="tile' + (!w.tplId ? ' on' : '') + '" data-wtpl="0"><div class="thumb ai"><span class="spark">✨</span><b>AI designs it</b><small>Layout and wording written fresh for each email</small></div><div class="meta"><b>Let the AI decide</b><small>Recommended</small></div></button>' +
      (S._ovTpls || []).map(function (t) {
        return '<button class="tile' + (w.tplId === t.id ? ' on' : '') + '" data-wtpl="' + t.id + '"><div class="thumb" id="tth' + t.id + '">' + thumb(S.tplCache[t.id]) + '</div><div class="meta"><b>' + esc(t.name) + '</b><small>' + esc(t.folder) + '</small></div></button>'; }).join('');
    return '<p class="wlead">Pick a saved template as the model. The AI keeps its structure and style and writes new content for every email. ' +
      (can('templates') ? '<button class="linkbtn" data-go="templates">Edit templates</button>' : '') + '</p><div class="tiles">' + tiles + '</div>' + wizNav(true, 'Next: choose who gets it →', 'w-next');
  }
  function thumb(v) {
    if (!v) return '<div class="tsk"></div><div class="tsk s"></div><div class="tsk"></div>';
    var h = '', btn = '';
    (v.blocks || []).forEach(function (b) {
      if (b.type === 'heading' && !h) h = '<div class="th">' + esc(b.text) + '</div>';
      else if (b.type === 'text') h += '<div class="tt">' + esc(b.text) + '</div>';
      else if (b.type === 'list') h += '<ul class="tl2">' + (b.items || []).slice(0, 3).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
      else if (b.type === 'button' && !btn) btn = '<span class="tb">' + esc(b.label) + '</span>';
    });
    return '<div class="tsub">' + esc(v.subject) + '</div>' + h.replace(/\{\{(\w+)\|?([^}]*)\}\}/g, function (m, k, f) { return f || k; }) + btn;
  }
  async function loadTplPreviews() {
    var want = (S._ovTpls || []).filter(function (t) { return !S.tplCache[t.id]; });
    await Promise.all(want.map(function (t) {
      return api('templates.get', { id: t.id }).then(function (r) {
        var v = r.versions[0]; S.tplCache[t.id] = { name: r.template.name, subject: v.subject, preheader: v.preheader, blocks: v.blocks };
        var el = $('tth' + t.id); if (el) el.innerHTML = thumb(S.tplCache[t.id]);
      }).catch(function () {});
    }));
  }
  function wizAudience() {
    var w = S.wiz;
    var tiles = S.lists.map(function (l) {
      var on = w.listIds.indexOf(l.id) >= 0;
      return '<button class="tile lt' + (on ? ' on' : '') + '" data-wlist="' + l.id + '" aria-pressed="' + on + '"><div class="meta"><span class="ck">' + (on ? '✓' : '') + '</span><b>' + esc(l.name) + '</b><small>' + MK.num(l.members) + ' people · ' + (l.type === 'dynamic' ? 'updates itself' : 'fixed list') + (l.city ? ' · ' + esc(l.city) : '') + '</small></div></button>'; }).join('');
    var n = S.lists.filter(function (l) { return w.listIds.indexOf(l.id) >= 0; }).reduce(function (a, l) { return a + (l.members || 0); }, 0);
    var ai = S.me.ai_ready && can('ai');
    return '<p class="wlead">Choose one or more lists. People in several lists get each email once; anyone unsubscribed or without consent is skipped automatically.</p>' +
      '<div class="tiles lists">' + tiles + '<button class="tile lt add" data-x="w-newlist"><div class="meta"><span class="ck plus">+</span><b>New list</b><small>Saved rules or people you add</small></div></button></div>' +
      (w.listIds.length ? '<p class="note" style="margin-top:10px">Up to ' + MK.num(n) + ' people before consent and duplicates are checked.</p>' : '') +
      '<label class="f" style="max-width:420px;margin-top:6px">Campaign name<input class="inp" data-wf="name" value="' + esc(w.name) + '" placeholder="' + esc(wizName()) + '"></label>' +
      wizNav(true, ai ? '✨ Write it with AI' : 'Create draft', 'w-create') +
      (ai ? '<p class="note" style="text-align:right;margin:6px 0 0">The AI drafts every email. Nothing is scheduled until you review and activate.</p>' : '');
  }
  function wizName() {
    var w = S.wiz, i = IDEAS.find(function (x) { return x.k === w.ideaK; });
    return w.name.trim() || (i ? i.name : w.idea.trim().split(/[.\n]/)[0].slice(0, 60)) || 'New campaign';
  }
  function tplNotes(id) {
    var v = S.tplCache[id];
    if (!v) return '';
    var parts = (v.blocks || []).map(function (b) {
      return b.type === 'button' ? 'button "' + b.label + '" -> ' + b.url : b.type === 'list' ? 'list: ' + (b.items || []).join('; ') : b.type + ': ' + (b.text || b.label || b.alt || '');
    });
    return ('Use the saved template "' + v.name + '" as the model for structure and style; adapt the content to each email. Subject style: "' + v.subject + '". Preview text style: "' + v.preheader + '". Blocks in order: ' + parts.join(' | ')).slice(0, 1900);
  }
  async function wizCreate(btn) {
    var w = S.wiz;
    btn.disabled = true; btn.textContent = 'Creating…';
    if (w.tplId && !S.tplCache[w.tplId]) await loadTplPreviews();
    var topics = S.me.topics.filter(function (t) { return t.scope === S.scope; });
    var r = await act(function () { return api('campaigns.create', { scope: S.scope, kind: 'broadcast', name: wizName(), list_ids: w.listIds, topic: topics[0] ? topics[0].id : undefined, timezone: w.tz, language: w.lang }); });
    if (!r) { btn.disabled = false; btn.textContent = 'Try again'; return; }
    if (S.me.ai_ready && can('ai')) {
      var brief = { name: wizName(), months: w.months, per_month: w.per, start_date: w.start || undefined, language: w.lang, timezone: w.tz, notes: w.tplId ? tplNotes(w.tplId) : undefined };
      var g = await act(function () { return api('campaigns.generate', { id: r.id, prompt: w.idea, brief: brief }); });
      if (g) toast(g.slots.length + ' emails planned from ' + g.slots[0].local_date + '. The AI is writing them now.');
    } else toast('Draft created.');
    S.wiz = null; S.emailId = null; S.tab = 'campaigns';
    document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x.dataset.tab === 'campaigns'); });
    try { history.replaceState(null, '', '#campaigns'); } catch (e) {}
    openCampaign(r.id);
  }
  function wizInput(el) {
    var w = S.wiz, k = el.dataset.wf, v = el.value;
    if (k === 'dur') { if (v === '1x1') { w.months = 1; w.per = 1; } else { w.months = +v; if (w.per === 1 && w.months > 1) w.per = 2; } return drawWiz(); }
    if (k === 'per') w.per = +v; else w[k] = v;
    if (k === 'idea') { var b = $('wNext'); if (b) b.disabled = !wizOk(1); }
  }
  document.addEventListener('input', function (e) { if (e.target.dataset && e.target.dataset.wf && S.wiz) wizInput(e.target); });

  function dashboard(s) {
    var m = s.metrics_90d || {};
    var anySent = (s.weeks || []).some(function (w) { return w.sent; });
    var max = Math.max.apply(null, (s.weeks || []).map(function (w) { return w.sent; }).concat([1]));
    var stat = function (v, l, sub, tone) { return '<div class="stat"><div class="sv' + (tone ? ' ' + tone : '') + '">' + esc(v) + '</div><div class="sl2">' + esc(l) + '</div><div class="ss">' + esc(sub) + '</div></div>'; };
    var camps = s.campaigns || [];
    return '<div class="dash-hd"><h2>Dashboard</h2><span class="muted small">' + esc(scopeName(S.scope)) + ' · last 90 days</span><span class="sp"></span>' +
        '<span class="hint" title="Opens are tracked opens: privacy features open images without a person, and blocked images hide real opens.">About open rates</span></div>' +
      (s.failures ? '<div class="warnbox">' + s.failures + ' send(s) failed or have an unknown outcome. <button class="btn btn-warn btn-sm" data-go="reports">Review</button></div>' : '') +
      '<div class="card stats">' +
        stat(MK.num(s.contacts), 'Contacts', MK.num(s.eligible) + ' can receive marketing') +
        stat(MK.num(m.sent), 'Emails sent', MK.num(m.reached_people) + ' people reached') +
        stat(MK.pct(m.open_rate), 'Open rate', MK.num(m.unique_opens) + ' unique opens') +
        stat(MK.pct(m.click_rate), 'Click rate', MK.num(m.unique_clicks) + ' unique clicks') +
        stat(MK.num(m.conversions), 'Actions completed', m.conversions ? MK.pct(m.conversion_rate) + ' of delivered' : 'forms submitted from emails', m.conversions ? 'good' : '') +
      '</div>' +
      '<div class="dgrid"><div class="card dcard"><div class="dch"><b>Campaigns</b><span class="sp"></span><button class="linkbtn" data-go="campaigns">See all</button></div>' +
        (camps.length ? camps.map(function (c) {
          return '<button class="crow" data-open-camp="' + c.id + '"><span class="cdot ' + MK.statusTone(c.status) + '"></span><span class="cm"><b>' + esc(c.name) + '</b><small>' + esc(c.kind === 'sequence' ? 'Automation' : 'Campaign') + (c.start_date ? ' · ' + esc(c.start_date) + ' → ' + esc(c.end_date || '') : '') + '</small></span>' + st(c.status) + '</button>'; }).join('')
          : '<div class="dempty">No campaigns yet. Your first one starts above.</div>') + '</div>' +

  // Import: parse in the browser (CSV, or XLSX via SheetJS), map columns, preview on the server, then commit.
  function importDialog() {
    modal('<h2>Import contacts</h2><p class="note">CSV or Excel (.xlsx). Every contact needs a source and a consent status: express, implied, unknown or withdrawn. Unknown consent can\'t receive marketing. Unsubscribes and bounces are kept, whatever the file says.</p>' +
      '<input type="file" id="impFile" accept=".csv,.xlsx,.xls,text/csv"><div id="impMap" style="margin-top:10px"></div>' +
      '<div class="actions"><button class="btn btn-ghost" data-x="close">Close</button></div>', true);
    $('impFile').addEventListener('change', async function (e) {
      var f = e.target.files[0]; if (!f) return;
      var parsed;
      if (/\.xlsx?$/i.test(f.name)) {
        await loadXlsx();
        var wb = window.XLSX.read(await f.arrayBuffer(), { type: 'array' });
        var rows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: false });
        parsed = { headers: rows.length ? Object.keys(rows[0]) : [], rows: rows };
      } else parsed = MK.parseCsv(await f.text());
      S._imp = parsed; S._map = MK.guessMapping(parsed.headers);
      drawImportMap();
    });
  }
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    return new Promise(function (ok, bad) { var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
  }

      return '<label class="f">' + esc(f[1]) + '<select class="sel" data-map="' + f[0] + '">' + opts(h, S._map[f[0]], '— none —') + '</select></label>'; }).join('') + '</div>' +

        var lsel = $('nLists') ? Array.from($('nLists').selectedOptions).map(function (o) { return +o.value; }) : [];
        var r5 = await act(function () { return api('campaigns.create', { scope: S.scope, kind: d.kind, name: $('nName').value, list_ids: lsel, topic: $('nTopic').value, timezone: $('nTz').value, language: $('nLang').value }); }, 'Draft created.');
        if (r5) { closeModal(); S.emailId = null; openCampaign(r5.id); }
        return;
      }
      case 'camp-back': { var back = S.camp && S.camp.campaign.kind === 'sequence' ? 'automations' : 'campaigns'; S.campId = null; S.camp = null; S.emailId = null; return go(back); }
      case 'camp-settings': {
        var c2 = S.camp.campaign;
        var lists2 = Object.fromEntries(S.lists.map(function (l) { return [l.id, l.name]; }));
        modal('<h2>Campaign settings</h2><div class="grid2"><label class="f full">Name<input class="inp" id="sName" value="' + esc(c2.name) + '"></label>' + (c2.kind === 'broadcast' ? '<label class="f full">Lists<select class="sel" id="sLists" multiple size="5">' + Object.keys(lists2).map(function (k) { return '<option value="' + k + '"' + (c2.list_ids.indexOf(+k) >= 0 ? ' selected' : '') + '>' + esc(lists2[k]) + '</option>'; }).join('') + '</select></label>' : '') +
          '<label class="f">Topic<select class="sel" id="sTopic">' + opts(Object.fromEntries(S.me.topics.filter(function (x) { return x.scope === c2.scope; }).map(function (x) { return [x.id, x.name]; })), c2.topic, 'Choose…') + '</select></label>' +
          '<label class="f">Timezone<select class="sel" id="sTz">' + opts(Object.fromEntries(TZS.map(function (z) { return [z, z]; })), c2.timezone) + '</select></label></div><div class="actions"><button class="btn btn-primary" data-x="camp-settings-go">Save</button><button class="btn btn-ghost" data-x="close">Cancel</button></div>');
        return;
      }
      case 'camp-settings-go': {
        var c3 = S.camp.campaign;
        var body2 = { id: c3.id, expected_revision: c3.revision, name: $('sName').value, topic: $('sTopic').value, timezone: $('sTz').value };
        if ($('sLists')) body2.list_ids = Array.from($('sLists').selectedOptions).map(function (o) { return +o.value; });
        if (await act(function () { return api('campaigns.save', body2); }, 'Saved.')) { closeModal(); openCampaign(c3.id); }
        return;
      }
      case 'camp-generate': {
        var brief = { months: +$('bMonths').value || undefined, per_month: +$('bPer').value || undefined, start_date: $('bStart').value || undefined, send_time: $('bTime').value || undefined,
          tone: $('bTone').value || undefined, cta: $('bCta').value || undefined, objective: $('bObj').value || undefined, notes: $('bNotes').value || undefined, timezone: S.camp.campaign.timezone, language: S.camp.campaign.language };
        var r6 = await act(function () { return api('campaigns.generate', { id: S.campId, prompt: $('bPrompt').value, brief: brief }); });
        if (r6) { toast(r6.slots.length + ' emails planned from ' + r6.slots[0].local_date + ' to ' + r6.slots[r6.slots.length - 1].local_date + '. The AI is writing them now.'); openCampaign(S.campId); }
        return;
      }
      case 'camp-revise':
        modal('<h2>Revise with AI</h2><p class="note">Describe the change. By default only emails nobody edited by hand are rewritten; you\'ll see the list before it runs.</p><textarea class="inp" id="rvIns" rows="3"></textarea><label class="f" style="margin-top:8px">Only these email numbers (optional, comma separated)<input class="inp" id="rvSeqs"></label><div class="actions"><button class="btn btn-primary" data-x="camp-revise-check">Show affected emails</button><button class="btn btn-ghost" data-x="close">Cancel</button></div>');
        return;
      case 'camp-revise-check':
      case 'camp-revise-go': {
        var seqs = ($('rvSeqs').value || '').split(',').map(function (x) { return +x.trim(); }).filter(Boolean);
        var r7 = await act(function () { return api('campaigns.revise', { id: S.campId, instruction: $('rvIns').value, seqs: seqs, confirm: d.x === 'camp-revise-go' }); });
        if (!r7) return;
        if (r7.confirm_needed) {
          $('modalCard').insertAdjacentHTML('beforeend', '<div class="warnbox" style="margin-top:10px">Will rewrite: ' + (r7.affected.map(function (a) { return '#' + a.seq; }).join(', ') || 'nothing') + (r7.kept_manual.length ? '<br>Kept (edited by hand): #' + r7.kept_manual.join(', #') : '') + '</div><div class="actions"><button class="btn btn-primary" data-x="camp-revise-go">Rewrite these</button></div>');
          return;
        }
        closeModal(); toast('The AI is revising ' + r7.affected.length + ' email(s).'); openCampaign(S.campId);
        return;
      }
      case 'facts': return factsModal();
      case 'fact-save': if (await act(function () { return api('facts.save', { scope: S.scope, key: $('fKey').value, value: $('fVal').value, volatile: $('fVol').checked }); }, 'Fact saved.')) factsModal(); return;
      case 'fact-del': if (await act(function () { return api('facts.delete', { scope: S.scope, key: d.k }); }, 'Removed.')) factsModal(); return;
      case 'email-add': if (await act(function () { return api('emails.add', { campaign_id: S.campId }); }, 'Email added.')) openCampaign(S.campId); return;
      case 'email-dup': if (await act(function () { return api('emails.duplicate', { id: S.emailId }); }, 'Duplicated.')) openCampaign(S.campId); return;
      case 'email-skip': if (await act(function () { return api('emails.skip', { id: S.emailId }); }, 'Skipped.')) openCampaign(S.campId); return;
      case 'email-unskip': if (await act(function () { return api('emails.unskip', { id: S.emailId }); }, 'Unskipped: review and save it.')) openCampaign(S.campId); return;
      case 'email-save': {
        var m = S._ed.m, v3 = edValues();
        var body3 = Object.assign({ id: m.id, expected_revision: m.revision }, v3);
        if ($('eDate')) { body3.local_date = $('eDate').value; body3.local_time = $('eTime').value; }
        if ($('eDelay')) body3.delay_days = +$('eDelay').value;
        if ($('eConfirm') && $('eConfirm').checked) body3.confirm_facts = true;
        var r8 = await act(function () { return api('emails.save', body3); });
        if (r8) { toast(r8.blockers.length ? 'Saved, with ' + r8.blockers.length + ' thing(s) to fix.' : 'Saved.'); openCampaign(S.campId); }
        return;
      }
      case 'email-test': {
        var r9 = await act(function () { return api('emails.test', { id: S.emailId }); });
        if (r9) toast('Test sent to ' + r9.to + '. Save first if you changed something: the test uses the saved version.');
        return;
      }
      case 'auto-save': {
        var tr = { type: $('aType').value, list_id: +$('aList').value || undefined, source_campaign_id: +$('aSrc').value || undefined, after_hours: +$('aHrs').value || 48, include_existing: $('aInc').checked, stop_action: $('aStop').value, action: $('aStop').value };
        if (await act(function () { return api('automations.save', { campaign_id: S.campId, trigger: tr, reentry: $('aRe').checked }); }, 'Trigger saved.')) openCampaign(S.campId);
        return;
      }
      case 'camp-preflight': {
        var pf = await act(function () { return api('campaigns.preflight', { id: S.campId }); });
        if (!pf) return;
        var c4 = S.camp.campaign;
        modal('<h2>Activate “' + esc(c4.name) + '”?</h2><table class="t"><tr><td>Sender</td><td>' + esc(pf.sender || '—') + '</td></tr>' +
          '<tr><td>Audience now</td><td><b>' + pf.eligible + '</b> can receive it (of ' + pf.total + ' in the lists). ' + Object.keys(pf.excluded).map(function (k) { return pf.excluded[k] + ' ' + esc(k); }).join(', ') + '</td></tr>' +
          (c4.kind === 'broadcast' ? '<tr><td>Dates</td><td>' + esc(MK.when(pf.first_send, pf.timezone)) + ' → ' + esc(MK.when(pf.last_send, pf.timezone)) + ' (' + esc(pf.timezone) + ')</td></tr>' : '') +
          '<tr><td>Emails</td><td>' + pf.emails + '</td></tr></table>' +
          (c4.kind === 'broadcast' ? '<p class="note">Lists are re-checked before every send: people who join later get the remaining emails, people who unsubscribe or lose eligibility get none.</p>' : '<p class="note">Each person enters at step 1 when the trigger happens.</p>') +
          (pf.problems.length ? '<div class="warnbox"><b>Fix these first</b><ul>' + pf.problems.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div>' : '') +
          '<div class="actions">' + (pf.problems.length ? '' : '<button class="btn btn-primary" data-x="camp-activate">Activate and schedule ' + pf.emails + ' email(s)</button>') + '<button class="btn btn-ghost" data-x="close">Not yet</button></div>', true);
        return;
      }
      case 'camp-activate': if (await act(function () { return api('campaigns.activate', { id: S.campId, expected_revision: S.camp.campaign.revision }); }, 'Activated. Emails are scheduled.')) { closeModal(); openCampaign(S.campId); } return;
      case 'camp-pause': if (await act(function () { return api('campaigns.pause', { id: S.campId }); }, 'Paused. Nothing more is sent until you resume.')) openCampaign(S.campId); return;
      case 'camp-resume':
      case 'camp-resume-go': {
        var r10 = await act(function () { return api('campaigns.resume', { id: S.campId, overdue: d.o, days: 1 }); });
        if (!r10) return;
        if (r10.choose_needed) {
          modal('<h2>Some emails are overdue</h2><p class="note">These were due while the campaign was paused:</p><ul class="tl">' + r10.overdue.map(function (o) { return '<li>#' + o.seq + ' ' + esc(o.subject) + ' <span>' + esc(MK.when(o.send_at)) + '</span></li>'; }).join('') + '</ul>' +
            '<div class="actions"><button class="btn btn-ghost" data-x="camp-resume-go" data-o="skip">Skip them</button><button class="btn btn-ghost" data-x="camp-resume-go" data-o="reschedule">Move them to tomorrow</button><button class="btn btn-primary" data-x="camp-resume-go" data-o="send_now">Send them now</button></div>');
          return;
        }
        closeModal(); toast('Resumed.'); openCampaign(S.campId);
        return;
      }
      case 'camp-cancel':
        modal('<h2>Cancel this campaign?</h2><p class="note">Every email not yet sent is cancelled for good. Messages Gmail already accepted can\'t be recalled and stay in the report.</p><div class="actions"><button class="btn btn-danger" data-x="camp-cancel-go">Cancel campaign</button><button class="btn btn-ghost" data-x="close">Keep it</button></div>');
        return;
      case 'camp-cancel-go': if (await act(function () { return api('campaigns.cancel', { id: S.campId }); }, 'Cancelled.')) { closeModal(); openCampaign(S.campId); } return;
      case 'camp-dup': { var r11 = await act(function () { return api('campaigns.duplicate', { id: S.campId }); }, 'Copied as a new draft.'); if (r11) { S.emailId = null; openCampaign(r11.id); } return; }
      case 'grant-new': return grantForm(null, null);
      case 'grant-save': {
        var acts = Array.from(document.querySelectorAll('[data-ga]')).filter(function (x) { return x.checked; }).map(function (x) { return x.dataset.ga; });
        if (await act(function () { return api('grants.save', { user_id: $('gUser').value, scope: $('gScope').value, actions: acts, city: $('gCity').value, country: $('gCountry').value }); }, 'Access saved.')) { closeModal(); access(); }
        return;
      }
      case 'settings-save': {
        var r12 = await act(function () { return api('settings.save', { cap_count: +$('sCap').value, cap_days: +$('sDays').value, attribution_days: +$('sAttr').value, sends_per_tick: +$('sTick').value, postal_address: $('sAddr').value, allow_implied: $('sImpl').checked }); }, 'Settings saved.');
        if (r12) { S.me = await api('me'); access(); }
        return;
      }
      case 'stop-on': case 'stop-off': {
        if (await act(function () { return api('settings.save', { emergency_stop: d.x === 'stop-on' }); }, d.x === 'stop-on' ? 'Emergency stop is on.' : 'Sending is back on.')) { S.me = await api('me'); access(); }
        return;
      }
    }
  });

  boot();
})();
</script>
</body>
</html>
