  function drawTemplates() {

      case 'add-contact-go': {
        var r2 = await act(function () { return api('contacts.save', { scope: S.scope, email: $('aEmail').value, name: $('aName').value, first_name: ($('aName').value || '').split(' ')[0], city: $('aCity').value, consent: $('aCons').value, consent_evidence: $('aEv').value, source: $('aSrc').value, list_id: S.listId || undefined }); }, 'Contact added.');
        if (r2) { closeModal(); lists(); }
        return;
      }
      case 'contact-save': {
        var b = { id: +d.id, tags: $('cTags').value, consent: $('cConsent').value, consent_evidence: $('cEv').value };
        if ($('cName')) Object.assign(b, { name: $('cName').value, city: $('cCity').value, language: $('cLang').value });
        if (await act(function () { return api('contacts.save', b); }, 'Saved.')) { closeModal(); loadContacts(); }
        return;
      }
      case 'contact-archive': if (await act(function () { return api('contacts.archive', { id: +d.id, restore: !!d.restore }); }, 'Done.')) { closeModal(); loadContacts(); } return;
      case 'import': return importDialog();
      case 'imp-preview': {
        var p1 = await act(function () { return api('import.preview', impBody()); });
        if (!p1) return;
        $('impOut').innerHTML = '<div class="' + (p1.error_count ? 'warnbox' : 'okbox') + '" style="margin-top:10px"><b>' + p1.valid + '</b> valid · <b>' + p1.new + '</b> new · <b>' + p1.existing + '</b> already here (will be updated; unsubscribes kept) · ' + p1.duplicates_in_file + ' duplicate(s) in the file · ' + p1.error_count + ' row(s) with errors' + (p1.out_of_area ? ' · ' + p1.out_of_area + ' outside your area (skipped)' : '') +
          (p1.errors_csv ? ' <button class="btn btn-ghost btn-sm" data-x="imp-errors">Download row errors</button>' : '') + '</div>';
        S._impErr = p1.errors_csv;
        $('impGo').disabled = !p1.valid;
        return;
      }
      case 'imp-errors': return downloadText('import-errors.csv', S._impErr || '');
      case 'imp-commit': {
        var c1 = await act(function () { return api('import.commit', impBody()); });
        if (!c1) return;
        toast('Imported: ' + c1.created + ' new, ' + c1.updated + ' updated' + (c1.errors ? ', ' + c1.errors + ' row(s) skipped' : '') + '.');
        if (c1.errors_csv) S._impErr = c1.errors_csv;
        closeModal();
        if (S._aiImport && (S.tab === 'overview' || S._audTarget === 'camp')) { var li = S._aiImport; S._aiImport = null; return aiReturnWithList(li); }
        lists();
        return;
      }
      case 'export-list': {
        var x1 = await act(function () { return api('export', S.listId ? { kind: 'list', list_id: S.listId } : { kind: 'contacts', scope: S.scope }); });
        if (x1) { location.href = x1.url; toast('Download started. The link expires in 15 minutes.'); }
        return;
      }
      case 'export-recip': {
        var x2 = await act(function () { return api('export', { kind: 'recipients', campaign_id: S.reportCamp, filter: S.rfilter, include_suspected: S.rsusp }); });
        if (x2) location.href = x2.url;
        return;
      }
      case 'tpl-new': S.tplId = null; S.tpl = { id: null, name: 'New template', folder: 'General', version: 0, subject: '', preheader: '', blocks: [MK.newBlock('heading'), MK.newBlock('text')] }; return drawTemplates();
      case 'tpl-save': {
        var v = edValues();
        var r3 = await act(function () { return api('templates.save', Object.assign({ id: S.tpl.id || undefined, scope: S.scope, name: $('eName').value, folder: $('eFolder').value, expected_version: S.tpl.version || undefined }, v)); }, 'Saved as a new version.');
        if (r3) { S.tpl = null; S.tplId = r3.id; templates(); }
        return;
      }
      case 'preview': return preview(d.mode);
      case 'ai-rewrite':
        modal('<h2>AI rewrite</h2><p class="note">Tell the AI what to change. You\'ll see the new draft in the editor before anything is saved. It only uses approved facts.</p><textarea class="inp" id="aiIns" rows="3" placeholder="Shorter, friendlier, mention the winter intake"></textarea><div class="actions"><button class="btn btn-primary" data-x="ai-rw-go">Rewrite</button><button class="btn btn-ghost" data-x="close">Cancel</button></div>');
        return;
      case 'ai-rw-go':
      case 'ed-ai': {
        var ins = d.x === 'ed-ai' ? ($('edAiQ') && $('edAiQ').value.trim()) : $('aiIns').value;
        if (!ins) return;
        t.disabled = true; var tl = t.textContent; t.textContent = 'Writing…';
        var v2 = edValues();
        var r4 = await act(function () { return api('templates.ai', Object.assign({ scope: S.scope, instruction: ins }, v2)); });
        closeModal(); t.disabled = false; t.textContent = tl;
        if (!r4) return;
        if ($('edAiQ')) $('edAiQ').value = '';
        $('eSubj').value = r4.draft.subject; $('ePre').value = r4.draft.preheader; S._ed.blocks = r4.draft.blocks; drawBlocks(); edDirty();
        if (r4.draft.blockers.length) showProblems('Check before saving', r4.draft.blockers); else toast('Draft ready. Review it, then save.');
        return;
      }
      case 'camp-new': if (!S.lists.length) { var ll = await act(function () { return api('lists.list', { scope: S.scope }); }); if (ll) S.lists = ll.lists; } return newCampaign(d.kind);
      case 'camp-create': {
        var lsel = $('nLists') ? Array.from($('nLists').selectedOptions).map(function (o) { return +o.value; }) : [];
        var r5 = await act(function () { return api('campaigns.create', { scope: S.scope, kind: d.kind, name: $('nName').value, list_ids: lsel, topic: $('nTopic').value, timezone: $('nTz').value, language: $('nLang').value }); }, 'Draft created.');
        if (r5) { closeModal(); S.emailId = null; openCampaign(r5.id); }
        return;
      }
      case 'camp-back': { var back = S.camp && S.camp.campaign.kind === 'sequence' ? 'automations' : 'campaigns'; S.campId = null; S.camp = null; S.emailId = null; return go(back); }
      case 'camp-settings': {
        var c2 = S.camp.campaign;
        var lists2 = Object.fromEntries(S.lists.map(function (l) { return [l.id, l.name]; }));
        modal('<h2>Campaign settings</h2><div class="grid2"><label class="f full">Name<input class="inp" id="sName" value="' + esc(c2.name) + '"></label>' + (c2.kind === 'broadcast' ? '<label class="f full">Lists<select class="sel" id="sLists" multiple size="5">' + Object.keys(lists2).map(function (k) { return '<option value="' + k + '"' + (c2.list_ids.indexOf(+k) >= 0 ? ' selected' : '') + '>' + esc(lists2[k]) + '</option>'; }).join('') + '</select></label>' : '') +
          '<label class="f">Topic<select class="sel" id="sTopic">' + opts(Object.fromEntries(S.me.topics.filter(function (x) { return x.scope === c2.scope; }).map(function (x) { return [x.id, x.name]; })), c2.topic, 'Choose…') + '</select></label>' +
          '<label class="f">Timezone<select class="sel" id="sTz">' + opts(Object.fromEntries(TZS.map(function (z) { return [z, z]; })), c2.timezone) + '</select></label></div><div class="actions"><button class="btn btn-primary" data-x="camp-settings-go">Save</button><button class="btn btn-ghost" data-x="close">Cancel</button></div>');
        return;
      }
      case 'camp-settings-go': {
        var c3 = S.camp.campaign;
        var body2 = { id: c3.id, expected_revision: c3.revision, name: $('sName').value, topic: $('sTopic').value, timezone: $('sTz').value };
        if ($('sLists')) body2.list_ids = Array.from($('sLists').selectedOptions).map(function (o) { return +o.value; });
        if (await act(function () { return api('campaigns.save', body2); }, 'Saved.')) { closeModal(); var back3 = S._inReview; await openCampaign(c3.id); if (back3) drawReview(); }
        return;
      }
      case 'camp-generate': {
        var brief = { months: +$('bMonths').value || undefined, per_month: +$('bPer').value || undefined, start_date: $('bStart').value || undefined, send_time: $('bTime').value || undefined,
          tone: $('bTone').value || undefined, cta: $('bCta').value || undefined, objective: $('bObj').value || undefined, notes: $('bNotes').value || undefined, timezone: S.camp.campaign.timezone, language: S.camp.campaign.language };
        var r6 = await act(function () { return api('campaigns.generate', { id: S.campId, prompt: $('bPrompt').value, brief: brief }); });
        if (r6) { toast(r6.slots.length + ' emails planned from ' + r6.slots[0].local_date + ' to ' + r6.slots[r6.slots.length - 1].local_date + '. The AI is writing them now.'); openCampaign(S.campId); kick(S.campId); }
        return;
      }
      case 'camp-revise':
        modal('<h2>Revise with AI</h2><p class="note">Describe the change. By default only emails nobody edited by hand are rewritten; you\'ll see the list before it runs.</p><textarea class="inp" id="rvIns" rows="3"></textarea><label class="f" style="margin-top:8px">Only these email numbers (optional, comma separated)<input class="inp" id="rvSeqs"></label><div class="actions"><button class="btn btn-primary" data-x="camp-revise-check">Show affected emails</button><button class="btn btn-ghost" data-x="close">Cancel</button></div>');
        return;
      case 'camp-revise-check':
      case 'camp-revise-go': {
        var seqs = ($('rvSeqs').value || '').split(',').map(function (x) { return +x.trim(); }).filter(Boolean);
        var r7 = await act(function () { return api('campaigns.revise', { id: S.campId, instruction: $('rvIns').value, seqs: seqs, confirm: d.x === 'camp-revise-go' }); });
        if (!r7) return;
        if (r7.confirm_needed) {
          $('modalCard').insertAdjacentHTML('beforeend', '<div class="warnbox" style="margin-top:10px">Will rewrite: ' + (r7.affected.map(function (a) { return '#' + a.seq; }).join(', ') || 'nothing') + (r7.kept_manual.length ? '<br>Kept (edited by hand): #' + r7.kept_manual.join(', #') : '') + '</div><div class="actions"><button class="btn btn-primary" data-x="camp-revise-go">Rewrite these</button></div>');
          return;
        }
        closeModal(); toast('The AI is revising ' + r7.affected.length + ' email(s).'); openCampaign(S.campId); kick(S.campId);
        return;
      }
      case 'facts': return factsModal();
      case 'fact-save': if (await act(function () { return api('facts.save', { scope: S.scope, key: $('fKey').value, value: $('fVal').value, volatile: $('fVol').checked }); }, 'Fact saved.')) factsModal(); return;
      case 'fact-del': if (await act(function () { return api('facts.delete', { scope: S.scope, key: d.k }); }, 'Removed.')) factsModal(); return;
      case 'email-add': if (await act(function () { return api('emails.add', { campaign_id: S.campId }); }, 'Email added.')) openCampaign(S.campId); return;
      case 'email-dup': if (await act(function () { return api('emails.duplicate', { id: S.emailId }); }, 'Duplicated.')) openCampaign(S.campId); return;
      case 'email-skip': if (await act(function () { return api('emails.skip', { id: S.emailId }); }, 'Skipped.')) openCampaign(S.campId); return;
      case 'email-unskip': if (await act(function () { return api('emails.unskip', { id: S.emailId }); }, 'Unskipped: review and save it.')) openCampaign(S.campId); return;
      case 'email-save': {
        var m = S._ed.m, v3 = edValues();
        var body3 = Object.assign({ id: m.id, expected_revision: m.revision }, v3);
        if ($('eDate')) { body3.local_date = $('eDate').value; body3.local_time = $('eTime').value; }
        if ($('eDelay')) body3.delay_days = +$('eDelay').value;
        if ($('eConfirm') && $('eConfirm').checked) body3.confirm_facts = true;
        if ($('eSubjB')) body3.subject_b = $('eSubjB').value;
        var r8 = await act(function () { return api('emails.save', body3); });
        if (r8) { S._edDirty = false; toast(r8.blockers.length ? 'Saved, with ' + r8.blockers.length + ' thing(s) to fix.' : 'Saved.'); await openCampaign(S.campId); if ($('edState')) $('edState').textContent = 'Saved \u2713'; }
        return;
      }
      case 'email-tpl': {
        var v5 = edValues();
        if (await act(function () { return api('templates.save', Object.assign({ scope: S.scope, name: (S.camp.campaign.name + ' #' + S._ed.m.seq).slice(0, 120), folder: 'From campaigns' }, v5)); }, 'Saved to Templates \u203a From campaigns.')) S._ovTpls = null;
        return;
      }
      case 'email-test': {
        var r9 = await act(function () { return api('emails.test', { id: S.emailId }); });
        if (r9) toast('Test sent to ' + r9.to + '. Save first if you changed something: the test uses the saved version.');
        return;
      }
      case 'auto-save': {
        var tr = { type: $('aType').value, list_id: +$('aList').value || undefined, source_campaign_id: +$('aSrc').value || undefined, after_hours: +$('aHrs').value || 48, include_existing: $('aInc').checked, stop_action: $('aStop').value, action: $('aStop').value };
        if (await act(function () { return api('automations.save', { campaign_id: S.campId, trigger: tr, reentry: $('aRe').checked }); }, 'Trigger saved.')) openCampaign(S.campId);
        return;
      }
      case 'camp-preflight': closeModal(); clearInterval(S.poll); S.poll = null; S.emailId = null; return drawReview();
      case 'rv-back': return openCampaign(S.campId);
      case 'camp-activate': {
        var now1 = !!document.querySelector('input[name=launch][value=now]:checked');
        t.disabled = true;
        var ra = await act(function () { return api('campaigns.activate', { id: S.campId, expected_revision: S.camp.campaign.revision, send_first_now: now1, language_checked: !!($('rvLang') && $('rvLang').checked) }); }, now1 ? 'Launched: the first email goes out within 2 minutes.' : 'Launched: emails are scheduled.');
        if (!ra) { t.disabled = false; return; }
        closeModal(); S.reportCamp = S.campId; S.campId = null; S.camp = null; S.emailId = null; return go('reports');
      }
      case 'camp-pause': if (await act(function () { return api('campaigns.pause', { id: S.campId }); }, 'Paused. Nothing more is sent until you resume.')) openCampaign(S.campId); return;
      case 'camp-resume':
      case 'camp-resume-go': {
        var r10 = await act(function () { return api('campaigns.resume', { id: S.campId, overdue: d.o, days: 1 }); });
        if (!r10) return;
        if (r10.choose_needed) {
          modal('<h2>Some emails are overdue</h2><p class="note">These were due while the campaign was paused:</p><ul class="tl">' + r10.overdue.map(function (o) { return '<li>#' + o.seq + ' ' + esc(o.subject) + ' <span>' + esc(MK.when(o.send_at)) + '</span></li>'; }).join('') + '</ul>' +
            '<div class="actions"><button class="btn btn-ghost" data-x="camp-resume-go" data-o="skip">Skip them</button><button class="btn btn-ghost" data-x="camp-resume-go" data-o="reschedule">Move them to tomorrow</button><button class="btn btn-primary" data-x="camp-resume-go" data-o="send_now">Send them now</button></div>');
          return;
        }
        closeModal(); toast('Resumed.'); openCampaign(S.campId);
        return;
      }
      case 'camp-cancel':
        modal('<h2>Cancel this campaign?</h2><p class="note">Every email not yet sent is cancelled for good. Messages Gmail already accepted can\'t be recalled and stay in the report.</p><div class="actions"><button class="btn btn-danger" data-x="camp-cancel-go">Cancel campaign</button><button class="btn btn-ghost" data-x="close">Keep it</button></div>');
        return;
      case 'camp-cancel-go': if (await act(function () { return api('campaigns.cancel', { id: S.campId }); }, 'Cancelled.')) { closeModal(); openCampaign(S.campId); } return;
      case 'camp-dup': { var r11 = await act(function () { return api('campaigns.duplicate', { id: S.campId }); }, 'Copied as a new draft.'); if (r11) { S.emailId = null; openCampaign(r11.id); } return; }
      case 'grant-new': return grantForm(null, null);
      case 'grant-save': {
        var acts = Array.from(document.querySelectorAll('[data-ga]')).filter(function (x) { return x.checked; }).map(function (x) { return x.dataset.ga; });
        if (await act(function () { return api('grants.save', { user_id: $('gUser').value, scope: $('gScope').value, actions: acts, city: $('gCity').value, country: $('gCountry').value }); }, 'Access saved.')) { closeModal(); access(); }
        return;
      }
      case 'settings-save': {
        var r12 = await act(function () { return api('settings.save', { cap_count: +$('sCap').value, cap_days: +$('sDays').value, attribution_days: +$('sAttr').value, sends_per_tick: +$('sTick').value, postal_address: $('sAddr').value, allow_implied: $('sImpl').checked }); }, 'Settings saved.');
        if (r12) { S.me = await api('me'); access(); }
        return;
      }
      case 'stop-on': case 'stop-off': {
        if (await act(function () { return api('settings.save', { emergency_stop: d.x === 'stop-on' }); }, d.x === 'stop-on' ? 'Emergency stop is on.' : 'Sending is back on.')) { S.me = await api('me'); access(); }
        return;
      }
    }
  });

  boot();
})();
</script>
</body>
</html>
