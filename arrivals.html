try { document.documentElement.setAttribute('data-theme', localStorage.getItem('vm-theme') || 'light'); } catch (e) {}
</script>
<script>
// Synchronous gate, same test as index.html's authGate. After sign-in, index.html bounces back here
// via sessionStorage.vm_next_path (signin.html always lands on index.html).
(function () {
  var ok = false;
  try {
    var s = JSON.parse(localStorage.getItem('sb-recbwmihyinlgxnymcmc-auth-token') || 'null');
    ok = !!(s && s.access_token && (!s.expires_at || s.expires_at * 1000 > Date.now()));
  } catch (e) { ok = false; }
  if (!ok) {
    try { sessionStorage.setItem('vm_next_path', 'arrivals.html'); } catch (e) {}
    location.replace('signin.html');
  }
})();
</script>
<style>
/* ---------- Vanmates brand tokens (verbatim from index.html, via cs.html) ---------- */

}

  --red:#D17262;

  --red-soft:#5C2B25;
  --ink:#F4ECDD;
  --muted:#A89685;
  --line:#3A302A;
  --green:#85A88E;
  --green-soft:#2C3E32;
  --amber:#E5C896;
  --amber-soft:#4A3C20;
  --blue:#6F9DC4;
  --blue-soft:#28394A;

}
/* Badge ink + scrim/toast (same values as cs.html) */

:root[data-theme="dark"]{ --b-green:#B9D3C0; --b-amber:#F0D9AE; --b-blue:#B7D0E6; --scrim:rgba(0,0,0,.55); --toast:#F4ECDD; --toast-ink:#1F1A16; }

* { box-sizing: border-box; }

/* ---------- header (cs.html) ---------- */

/* ---------- page ---------- */
.wrap { padding: 0 12px 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); }

  min-height: 30px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip:hover { background: var(--cream-2); }

.ibtn:hover { color: var(--ink); background: var(--cream-2); }
.ibtn svg { width: 14px; height: 14px; }

.split { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 12px; align-items: start; }
.grp { margin-bottom: 12px; overflow: hidden; }
.ghead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }

  text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 9px 14px; min-height: 48px; }

.frow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.frow .inp { flex: 1 1 140px; }

.eye { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); min-height: 34px; }
.eye:hover { color: var(--ink); }
.pv-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 14px 0 6px; }

/* access */

.erow .inp, .erow .secret { width: 100%; }
.addbtn { margin-top: 6px; }

/* templates */
.tsplit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.tp { padding: 14px 16px; }
.tf { display: grid; gap: 10px; }
.tf label { display: grid; gap: 3px; font-size: 12.5px; font-weight: 700; }
.tf label > span small { font-weight: 500; color: var(--muted); }
.tf .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tf .chk { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.sect { border: 1px solid var(--line); border-radius: 11px; padding: 8px 10px; display: grid; gap: 6px; }
.sect .sbar { display: flex; gap: 4px; justify-content: flex-end; }
.sbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-width: 30px; height: 28px; font-size: 12px; font-weight: 600; color: var(--muted); }
.sbtn:hover { color: var(--ink); background: var(--cream-2); }
.sbtn:disabled { opacity: .4; cursor: default; }
.tbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tpv { position: sticky; top: 12px; }

/* modal + toast (cs.html) */
.modal { position: fixed; inset: 0; background: var(--scrim); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal.show { display: flex; }
.modal .mcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 20px; width: min(500px, 100%); max-height: calc(100dvh - 32px); overflow: auto; }
.modal .mcard > b:first-child { display: block; font-family: var(--serif); font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.modal .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
.modal .btns .btn { min-height: 40px; padding: 8px 16px; font-size: 13px; }

.mlist li { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.mlist .bad { color: var(--red); font-weight: 600; text-align: right; }
.mlist .ok { color: var(--b-green); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--toast); color: var(--toast-ink);
  padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-md); display: none; z-index: 60; max-width: calc(100% - 32px); }
.toast.show { display: block; }
.gate { padding: 60px 20px; text-align: center; color: var(--muted); }
.gate a { color: var(--red); font-weight: 600; }
.gate.card { max-width: 460px; margin: 60px auto; padding: 28px 24px; }
.gate.card > b { display: block; font-family: var(--serif); font-size: 22px; color: var(--ink); margin-bottom: 6px; }

@media (max-width: 1099px) {
  .split { grid-template-columns: minmax(0, 1fr) 400px; }
  .tsplit { grid-template-columns: 1fr; }
  .tpv { position: static; }
}
@media (max-width: 899px) {
  .split { grid-template-columns: 1fr; }
  .panel { position: fixed; inset: 0; top: 0; max-height: none; z-index: 40; border-radius: 0; border: 0; display: none; }
  body[data-panel="open"] .panel { display: block; }
  body[data-panel="open"] { overflow: hidden; }
  .pclose { display: grid; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .erow.b, .erow.u, .erow.r { grid-template-columns: 1fr 1fr; }

}
@media (max-width: 599px) {
  .top .lbl, #me { display: none; }
  .tabrow { order: 10; flex: 1 1 100%; }
  .arow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who chip" "room date"; }

<script src="arrivals-core.js?v=2026-10-06-needhints1"></script>
<script>
(function () {
  'use strict';
  var A = window.ArrCore;
  var esc = A.escapeHtml;
  var ARRIVALS_SEND_URL = 'https://adr23.app.n8n.cloud/webhook/arrivals-send';
  var ARRIVALS_UPLOAD_URL = 'https://adr23.app.n8n.cloud/webhook/arrivals-upload';
  var UPLOAD_MAX_BYTES = 2200000;   // base64 of it stays under Roster Actions' 3,000,000-char limit (checked AFTER stripping)
  var UPLOAD_MAX_PICK_BYTES = 20000000;   // the file as picked (Kaplan rosters are ~9 MB before stripping)
  // fflate for A.stripExternalLinks: loaded on the first upload only. Same pinned version as Limpio's package.json.
  var FFLATE_URL = 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js';
  var FFLATE_SRI = 'sha384-DT0Ls0mO7JmjTnT+oBuMhEJzYJO1zUqzuuMXNdnOmOQRIpN2BgSjvBV/j50NngIT';
  var CITIES = ['Toronto', 'Vancouver', 'Montréal'];
  var PAGE = 1000;   // PostgREST answers with at most 1,000 rows per request
  var sb = window.supabase.createClient(window.VM_SUPABASE_URL, window.VM_SUPABASE_KEY,
    { auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false } });
  var NARROW = window.matchMedia('(max-width: 899px)');

  var S = { me: null, tab: 'arrivals', wk: A.weekendOf(new Date()), city: '', filter: 'all', rows: [], openId: null, seq: 0, busy: false,
    acc: null, accSeq: 0, accOpen: {}, accNew: {}, tpl: null, tplDirty: false,
    mo: { wk: A.weekendOf(new Date()), city: '', filter: 'all', rows: [], nodate: [], openId: null, seq: 0, busy: false, setup: true },
    tk: 'checkin', cot: null, coTpls: null,
    fu: [], fuBy: {}, fuErr: '', fuRules: undefined, fur: null, furPick: null };

  function $(id) { return document.getElementById(id); }
  function initials(n) { var p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase(); }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 3500); }
  function str(v) { return v === null || v === undefined ? '' : String(v).trim(); }
  function clock(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  var DAY3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function ymdUtc(v) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(str(v)); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null; }
  function shortDate(v) { var d = ymdUtc(v); return d ? DAY3[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MON3[d.getUTCMonth()] : str(v); }
  function addDaysYmd(v, n) { var d = ymdUtc(v); if (!d) return ''; d = new Date(d.getTime() + n * 86400000); return d.toISOString().slice(0, 10); }
  function todayYmd() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function cityOpts(sel, blank) {
    return (blank ? '<option value="">' + esc(blank) + '</option>' : '') + CITIES.map(function (c) { return '<option' + (c === sel ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('');
  }
  function secret(name, value, label) {
    return '<span class="secret"><input class="inp" type="password" autocomplete="new-password" spellcheck="false" name="' + name + '" value="' + esc(value) + '" placeholder="' + esc(label) + '" aria-label="' + esc(label) + '" /><button type="button" class="eye" data-eye>Show</button></span>';
  }
  async function token() { try { var s = await sb.auth.getSession(); return (s.data && s.data.session && s.data.session.access_token) || ''; } catch (e) { return ''; } }

  // Client RPCs answer {ok:true,...} or {ok:false,error}. Returns the data on success, else null (after a toast).
  async function rpc(name, args) {
    try {
      var r = await sb.rpc(name, args);
      if (r.error) { toast(r.error.message || 'Not saved.'); return null; }
      if (!r.data || !r.data.ok) { toast((r.data && r.data.error) || 'Not saved.'); return null; }
      return r.data;
    } catch (e) { toast('Can’t reach the server — check your connection.'); return null; }
  }
  // Every table read is paged (1,000-row PostgREST ceiling).
  async function selectAll(table, cols, mod) {
    var out = [];
    for (var from = 0; ; from += PAGE) {
      var q = sb.from(table).select(cols);
      if (mod) q = mod(q);
      var r = await q.range(from, from + PAGE - 1);
      if (r.error) throw r.error;
      out = out.concat(r.data || []);
      if (!r.data || r.data.length < PAGE) return out;
    }
  }

  // ───────── modal ─────────
  var _modalResolve = null;
  function openModal(html) { $('modalCard').innerHTML = html; $('modal').classList.add('show'); }
  function closeModal(v) { $('modal').classList.remove('show'); var r = _modalResolve; _modalResolve = null; if (r) r(!!v); }
  function confirmSheet(title, bodyHtml, okLabel) {
    return new Promise(function (resolve) {
      if (_modalResolve) _modalResolve(false);
      _modalResolve = resolve;
      openModal('<b>' + esc(title) + '</b>' + bodyHtml + '<div class="btns"><button type="button" class="btn btn-ghost" data-m="0">Cancel</button><button type="button" class="btn btn-primary" data-m="1">' + esc(okLabel) + '</button></div>');
    });
  }
  function infoSheet(title, bodyHtml) {
    if (_modalResolve) { _modalResolve(false); _modalResolve = null; }
    openModal('<b>' + esc(title) + '</b>' + bodyHtml + '<div class="btns"><button type="button" class="btn btn-primary" data-m="0">Close</button></div>');
  }

  // ───────── boot ─────────
  function isAuthError(err) { return err.name === 'AuthSessionMissingError' || err.status === 400 || err.status === 401 || err.status === 403; }
  function isMember(m) {
    if (!m) return false;
    if (m.role === 'admin') return true;
    var p = m.allowed_pages;
    if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { p = []; } }
    return Array.isArray(p) && (p.indexOf('arrivals') !== -1 || p.indexOf('cs') !== -1);
  }
  async function boot() {
    var u = await sb.auth.getUser();
    if (u && u.error && (navigator.onLine === false || !isAuthError(u.error))) {
      $('groups').innerHTML = '<div class="gate"><p>Can’t reach the server — check your connection</p><button class="btn btn-primary" id="reloadBtn">Reload</button></div>';
      $('reloadBtn').addEventListener('click', function () { location.reload(); });
      return;
    }
    var user = u && u.data && u.data.user;
    if (!user) { try { sessionStorage.setItem('vm_next_path', 'arrivals.html'); } catch (e) {} location.replace('signin.html'); return; }
    var tm = await sb.from('team_members').select('id,email,name,role,allowed_pages').eq('id', user.id);
    if (tm.error) { $('groups').innerHTML = '<div class="gate">Could not load your team profile: ' + esc(tm.error.message) + '</div>'; return; }
    S.me = (tm.data || [])[0] || null;
    if (!isMember(S.me)) {
      document.body.innerHTML = '<div class="gate card"><b>No access</b><p>Your account does not have Arrivals access.</p><p>Ask an admin to add the <b>Arrivals</b> page to your profile in Team.</p><p><a href="index.html">Back to the portal</a></p></div>';
      return;
    }
    $('me').textContent = S.me.name || S.me.email;
    $('meAv').textContent = initials(S.me.name || S.me.email);
    wire();
    var h = (location.hash || '').replace('#', '');
    setTab(h === 'access' || h === 'templates' || h === 'moveouts' ? h : 'arrivals');
    if (S.tab !== 'moveouts') loadMoBadge();
  }

  function setTab(t) {
    if (S.tab === 'templates' && t !== 'templates' && S.tplDirty && !window.confirm('Leave the template without saving?')) return;
    if (t !== 'templates') S.tplDirty = false;
    S.tab = t;
    document.body.dataset.tab = t;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
    $('v-arrivals').hidden = t !== 'arrivals';
    $('v-moveouts').hidden = t !== 'moveouts';
    $('v-access').hidden = t !== 'access';
    $('v-templates').hidden = t !== 'templates';
    try { history.replaceState(null, '', location.pathname + location.search + (t === 'arrivals' ? '' : '#' + t)); } catch (e) {}
    document.body.dataset.panel = '';
    if (t === 'arrivals') loadArrivals();
    else if (t === 'moveouts') loadMoveouts();
    else loadAccess();
  }

  // ───────── Arrivals tab ─────────
  async function loadArrivals() {
    var seq = ++S.seq;
    renderWeek();
    if (!S.rows.length) $('groups').innerHTML = '<div class="empty card">Loading…</div>';
    var rows, fu;
    try {
      var res = await Promise.all([
        selectAll('arrivals_v', '*', function (q) {
          q = q.gte('arrival_date', S.wk.start).lte('arrival_date', S.wk.end);
          if (S.city) q = q.eq('city', S.city);
          return q.order('arrival_date', { ascending: true }).order('id', { ascending: true });
        }),
        fuLoadWeek()
      ]);
      rows = res[0]; fu = res[1];
    } catch (e) {
      if (seq !== S.seq) return;
      $('groups').innerHTML = '<div class="gate card">Could not load arrivals: ' + esc(e && e.message) + '</div>';
      return;
    }
    if (seq !== S.seq) return;
    S.rows = rows;
    fuIndex(fu);
    if (S.openId && !byId(S.openId)) S.openId = null;
    renderArrivals();
  }
  function byId(id) { for (var i = 0; i < S.rows.length; i++) if (S.rows[i].id === id) return S.rows[i]; return null; }
  function renderWeek() {
    var w = S.wk;
    $('wkLabel').innerHTML = esc(w.title) + '<small>' + esc(w.range) + '</small>';
    $('wkLabel').title = w.label;
  }
  function notOpened24(r) { return r.status === 'sent' && !r.opened_at && !!r.sent_at && Date.now() - Date.parse(r.sent_at) > 86400000; }
  var FILTERS = [['all', 'All'], ['missing', 'Missing'], ['ready', 'Ready'], ['sent', 'Sent'], ['notopened', 'Not opened 24h'], ['failed', 'Failed'], ['dropped', 'Not in latest roster']];
  function matches(r, f) {
    if (f === 'all') return true;
    if (f === 'notopened') return notOpened24(r);
    if (f === 'dropped') return !!r.not_in_latest_roster && r.status !== 'cancelled' && r.status !== 'handled';
    return r.status === f;
  }
  function canSend(r) { return (r.status === 'ready' || r.status === 'failed') && !(r.missing && r.missing.length); }
  function roomText(r) {
    var p = [];
    if (str(r.unit)) p.push('Unit ' + str(r.unit));
    if (str(r.room_label)) p.push(str(r.room_label)); else if (str(r.bed)) p.push('Room ' + str(r.bed));
    return p.join(' · ') || '—';
  }
  function chipHtml(r) { var c = A.statusChip(r); return '<span class="st st-' + esc(c.cls) + '" title="' + esc(c.label) + '">' + esc(c.label) + '</span>'; }
  function openText(r) {
    if (r.opened_at) return 'Opened ' + clock(r.opened_at) + (r.open_count > 1 ? ' (' + r.open_count + '×)' : '');
    if (r.status === 'sent') return notOpened24(r) ? 'Not opened in 24h' : 'Not opened yet';
    return '';
  }
  var INFO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>';

  function renderArrivals() {
    var c = A.counts(S.rows);
    $('kpis').innerHTML = [
      ['Arriving', c.arriving], ['Ready', c.ready], ['Missing', c.missing], ['Sent', c.sent],
      ['Opened', c.opened, true], ['Failed', c.failed]
    ].map(function (k) {
      return '<div class="kpi card"><div class="k">' + esc(k[0]) + (k[2] ? ' <button type="button" class="ibtn" id="openInfo" aria-label="About open tracking" title="About open tracking">' + INFO_SVG + '</button>' : '') + '</div><div class="v">' + esc(k[1]) + '</div></div>';
    }).join('');
    $('chips').innerHTML = FILTERS.map(function (f) {
      var n = S.rows.filter(function (r) { return matches(r, f[0]); }).length;
      return '<button type="button" class="chip' + (S.filter === f[0] ? ' on' : '') + '" data-f="' + f[0] + '">' + esc(f[1]) + ' <span class="n">' + n + '</span></button>';
    }).join('');
    var ready = A.batchReady(S.rows);
    $('sendAll').textContent = 'Send all ready (' + ready.length + ')';
    $('sendAll').disabled = !ready.length || S.busy;

    var list = S.rows.filter(function (r) { return matches(r, S.filter); });
    if (!list.length) {
      $('groups').innerHTML = '<div class="empty card"><b>' + (S.rows.length ? 'Nothing in this filter' : 'No arrivals this weekend') + '</b>' +
        (S.rows.length ? 'Try another status.' : 'Rosters land here when the school emails them.') + '</div>';
    } else {
      $('groups').innerHTML = A.groupByBuilding(list).map(function (g) {
        var unreviewed = g.arrivals.some(function (r) { return !r.template_reviewed; });
        var n = g.arrivals.filter(function (r) { return r.status !== 'cancelled'; }).length;
        return '<section class="grp card"><div class="ghead"><b>' + esc(g.building) + '</b><span class="muted">' + esc(g.city) + ' · ' + n + ' arriving</span>' +
          (unreviewed ? '<span class="tag warn">Template not reviewed</span>' : '') + '</div>' +
          g.arrivals.map(function (r) {
            return '<button type="button" class="arow' + (r.id === S.openId ? ' on' : '') + '" data-id="' + esc(r.id) + '">' +
              '<span class="c-who"><b>' + esc(r.student_name || '(no name)') + '</b><small>' + esc(r.school || '—') + '</small></span>' +
              '<span class="c-room">' + esc(roomText(r)) + '</span>' +
              '<span class="c-date">' + esc(shortDate(r.arrival_date)) + (str(r.arrival_time) ? ' · ' + esc(r.arrival_time) : '') + '</span>' +
              '<span class="c-chip">' + chipHtml(r) + (openText(r) ? '<span class="c-open">' + esc(openText(r)) + '</span>' : '') + fuChipsHtml(r) + '</span></button>';
          }).join('') + '</section>';
      }).join('');
    }
    renderPanel();
  }

  function fxBlock(kind, title, missing, inner, hint) {
    return '<form class="fx' + (missing ? ' miss' : '') + '" data-fx="' + kind + '"><div class="fh"><span>' + esc(title) + '</span>' + (missing ? '<small>Missing</small>' : '') + '</div>' +
      inner + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</form>';
  }
  function renderPanel() {
    var r = S.openId ? byId(S.openId) : null;
    document.body.dataset.panel = r ? 'open' : '';
    if (!r) {
      $('panel').innerHTML = '<div class="empty"><b>Pick an arrival</b>See the email it will get, fill what’s missing and send.</div>';
      return;
    }
    var miss = Array.isArray(r.missing) ? r.missing : [];
    var has = function (k) { return miss.indexOf(k) !== -1; };
    var facts = [
      ['Arrives', A.longDate(r.arrival_date) + (str(r.arrival_time) ? ' · ' + str(r.arrival_time) : '')],
      ['Checks out', r.checkout_date ? A.longDate(r.checkout_date) : ''],
      ['Room', str(r.building) + ' · ' + roomText(r)],
      ['Roster', str(r.roster_filename)],
      ['Sent', r.sent_at ? clock(r.sent_at) + (r.sent_by ? ' by ' + r.sent_by : '') : ''],
      ['Opened', r.opened_at ? clock(r.opened_at) + (r.open_count > 1 ? ' · ' + r.open_count + ' opens, last ' + clock(r.last_opened_at) : '') : (r.status === 'sent' ? 'Not yet' : '')],
      ['Error', r.status === 'failed' || (r.last_error && r.status === 'sent') ? str(r.last_error) : '']
    ].filter(function (f) { return str(f[1]); });

    var acts = [];
    if (canSend(r)) acts.push('<button type="button" class="btn btn-primary" data-act="send">' + (r.status === 'failed' ? 'Retry send' : 'Send this one') + '</button>');
    if (r.status === 'sent') acts.push('<button type="button" class="btn btn-ghost" data-act="resend">Resend</button>');
    if (r.status !== 'handled' && r.status !== 'cancelled') acts.push('<button type="button" class="btn btn-ghost" data-act="handled">Mark handled</button>');
    else acts.push('<button type="button" class="btn btn-ghost" data-act="reopen">Reopen</button>');

    var warn = '';
    if (r.status === 'cancelled') warn = '<p class="warnbox">Cancelled' + (r.cancelled_by ? ' by ' + esc(r.cancelled_by) : ' — no longer on the roster') + '.</p>';
    else if (r.not_in_latest_roster && r.status !== 'handled') warn = '<p class="warnbox">Not in the latest roster from ' + esc(r.school || 'the school') + '. Check with the school before ' + (r.sent_at ? 'acting on it' : 'sending') + ' — it is left out of “Send all ready”' + (r.sent_at ? '' : ', but “Send” here still works') + '.</p>';
    else if (r.changed_after_send) warn = '<p class="warnbox">The roster changed after this email was sent. Check the details and resend if needed.</p>';
    else if (miss.length) warn = '<p class="warnbox">Held — missing ' + esc(miss.map(A.missingLabel).join(', ')) + '. It won’t be sent with blanks.</p>';

  // ───────── Upload roster (n8n Portal - Arrivals Upload -> Limpio Roster Actions manual_upload) ─────────
  function rosterFileError(file) {
    if (!file) return 'Choose a roster file.';
    if (!/\.(xlsx|xls|csv)$/i.test(String(file.name || ''))) return 'Choose an .xlsx, .xls or .csv roster.';
    if (!(file.size > 0)) return 'The file is empty.';
    if (file.size > UPLOAD_MAX_PICK_BYTES) return 'File too large (20 MB max)';
    return '';
  }
  // end rosterFileError
  var fflateP = null;
  function loadFflate() {
    if (window.fflate && window.fflate.unzipSync) return Promise.resolve(window.fflate);
    if (!fflateP) fflateP = new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = FFLATE_URL; sc.integrity = FFLATE_SRI; sc.crossOrigin = 'anonymous';
      sc.onload = function () { if (window.fflate && window.fflate.unzipSync) resolve(window.fflate); else reject(new Error('fflate missing')); };
      sc.onerror = function () { fflateP = null; sc.remove(); reject(new Error('Could not load fflate')); };
      document.head.appendChild(sc);
    });
    return fflateP;
  }
  // The picked file's bytes; an .xlsx loses its linked-workbook cache (Kaplan). If fflate can't load, the
  // file goes as it is and the 2.2 MB check below decides.
  async function readRosterBytes(file) {
    var bytes = new Uint8Array(await file.arrayBuffer());
    if (!/\.xlsx$/i.test(String(file.name || ''))) return bytes;
    try { return A.stripExternalLinks(await loadFflate(), bytes); } catch (e) { return bytes; }
  }
  async function uploadRoster(file) {
    var bad = rosterFileError(file);
    if (bad) { infoSheet('Upload failed', '<p>' + esc(bad) + '</p>'); return; }
    if (S.uploading) return;
    S.uploading = true;
    var btn = $('uploadRoster');
    btn.disabled = true; btn.textContent = 'Uploading…';
    var j = null, err = '';
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 95000);
    try {
      var bytes = await readRosterBytes(file);
      var tok = '';
      if (bytes.length > UPLOAD_MAX_BYTES) { err = 'File too large (2 MB max)'; }
      else if (!(tok = await token())) { err = 'Your session expired — reload the page.'; }
      else {
        var b64 = A.bytesToBase64(bytes);
        var res = await fetch(ARRIVALS_UPLOAD_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok },
          body: JSON.stringify({ file_b64: b64, filename: file.name }), signal: ctl.signal });
        try { j = await res.json(); } catch (e) { j = { ok: false, error: 'Bad response from the upload service (HTTP ' + res.status + ').' }; }
      }
    } catch (e) {
      err = e && e.name === 'AbortError' ? 'The upload took too long. It may still go through — refresh in a minute before trying again.'
        : 'Upload service unreachable — check your connection and try again.';
    } finally {
      clearTimeout(timer);
      S.uploading = false; btn.disabled = false; btn.textContent = 'Upload roster';
    }
    if (!err && (!j || j.ok !== true)) err = (j && j.error) || 'The upload service refused the file.';
    if (err) { infoSheet('Upload failed', '<p>' + esc(err) + '</p>'); return; }
    if (j.unreadable) infoSheet('Roster saved, not read', '<p>The file was saved, but Limpio could not read it as a school roster. Check it in Limpio’s roster uploads.</p>');
    else toast('Roster uploaded — arrivals appear in about a minute');

  }

  var CHECKOUT_SEND_URL = 'https://adr23.app.n8n.cloud/webhook/checkout-send';
  // The view or table isn't there yet (SQL moveout-messages-2026-10-02.sql not applied): Postgres 42P01 or

  function moSetupMissing(e) {
    if (!e) return false;
    if (e.code === '42P01' || e.code === 'PGRST205' || e.code === 'PGRST200') return true;

  }

  var MO_MISS = { email: 'email', checkout_date: 'check-out date', template: 'template' };
  // One checkout_messages_v row -> { cls, label } for the status chip.
  function moChip(r) {
    r = r || {};
    var s = r.live_status || r.status;
    if (s === 'sent') {
      if (r.changed_after_send) return { cls: 'changed', label: 'Changed after send' };
      return r.opened_at ? { cls: 'opened', label: 'Opened ' + clock(r.opened_at) } : { cls: 'sent', label: 'Sent ' + clock(r.sent_at) };
    }
    if (s === 'scheduled') return { cls: 'scheduled', label: 'Scheduled · sends ' + shortDate(r.due_date) };
    if (s === 'due') return { cls: 'due', label: 'Due — sends at the next run (9:00/13:00/17:00)' };
    if (s === 'needs_attention') {
      var m = Array.isArray(r.missing) ? r.missing : [];
      return { cls: 'missing', label: 'Needs attention' + (m.length ? ': ' + m.map(function (k) { return MO_MISS[k] || String(k); }).join(', ') : '') };
    }
    if (s === 'held') return { cls: 'held', label: 'Held' };
    if (s === 'failed') return { cls: 'failed', label: 'Failed' };
    if (s === 'skipped') {
      if (r.arrival_status === 'cancelled' || r.arrival_status === 'handled') return { cls: 'skipped', label: 'Skipped (' + r.arrival_status + ')' };
      return { cls: 'skipped', label: 'Skipped (move-out passed)' };
    }
    return { cls: 'held', label: String(s || 'Unknown') };
  }
  // end moChip
  // moving = rows whose arrival is still open; scheduled includes due; sent includes opened.
  function moCounts(rows) {
    var c = { moving: 0, scheduled: 0, attention: 0, sent: 0, opened: 0, held: 0 };
    (rows || []).forEach(function (r) {
      if (r.arrival_status === 'cancelled' || r.arrival_status === 'handled') return;
      c.moving++;
      var s = r.live_status;
      if (s === 'scheduled' || s === 'due') c.scheduled++;
      else if (s === 'needs_attention') c.attention++;
      else if (s === 'held') c.held++;
      else if (s === 'sent') { c.sent++; if (r.opened_at) c.opened++; }
    });
    return c;
  }

  async function loadAccess() {

          selectAll('access_rooms', '*', function (q) { return q.order('building').order('room_key'); }),
          selectAll('arrival_templates', '*', function (q) { return q.order('building'); }),
          selectAll('arrivals_v', 'id,building,city,unit,bed,room_key,arrival_date,status', function (q) { return q.gte('arrival_date', since).order('arrival_date').order('id'); }),
          // null = the move-out messages SQL isn't applied yet (the check-in editor keeps working)
          selectAll('checkout_templates', '*', function (q) { return q.order('building'); }).catch(function (e) { if (moSetupMissing(e)) return null; throw e; }),
          // null = the after-hours follow-ups SQL isn't applied yet

        ]);
        if (seq !== S.accSeq) return;
        S.coTpls = res[5];
        S.fuRules = res[6];
        S.acc = buildModel(res[0], res[1], res[2], res[3], res[4], res[5] || [], res[6] || []);
      } catch (e) {
        if (seq !== S.accSeq) return;
        var msg = '<div class="gate card">Could not load access lists: ' + esc(e && e.message) + '</div>';
        $('accBody').innerHTML = msg; $('tplBody').innerHTML = msg;
        return;
      }
    }
    if (S.tab === 'access') renderAccess(); else if (S.tab === 'templates') renderTemplates();
  }
  // building → { city, address, house_code, units{}, rooms{}, tpl, upcoming }
  function buildModel(bs, us, rs, ts, arr, cos, fus) {
    var M = {}, today = todayYmd();
    function B(name, city) {
      name = str(name); if (!name) return null;
      if (!M[name]) M[name] = { building: name, city: '', address: '', house_code: '', saved: false, units: {}, rooms: {}, tpl: null, co: null, upcoming: 0 };
      if (city && !M[name].city) M[name].city = city;
      return M[name];
    }
    bs.forEach(function (b) { var m = B(b.building, b.city); if (!m) return; m.address = str(b.address); m.house_code = str(b.house_code); m.city = str(b.city) || m.city; m.saved = true; });
    us.forEach(function (u) { var m = B(u.building); if (!m) return; m.units[u.unit] = { unit: u.unit, wifi_name: str(u.wifi_name), wifi_password: str(u.wifi_password), saved: true, upcoming: 0 }; });
    rs.forEach(function (r) { var m = B(r.building); if (!m) return; m.rooms[r.room_key] = { room_key: r.room_key, unit: str(r.unit), room_label: str(r.room_label), door_code: str(r.door_code), bed: '', saved: true, upcoming: 0 }; });
    ts.forEach(function (t) { var m = B(t.building, t.city); if (m) m.tpl = t; });
    (cos || []).forEach(function (t) { var m = B(t.building, t.city); if (m) m.co = t; });
    (fus || []).forEach(function (f) { B(f.building, f.city); });
    arr.forEach(function (a) {
      var m = B(a.building, a.city); if (!m) return;
      var up = a.arrival_date >= today && a.status !== 'cancelled' && a.status !== 'handled' ? 1 : 0;
      m.upcoming += up;
      if (str(a.unit)) {
        if (!m.units[a.unit]) m.units[a.unit] = { unit: a.unit, wifi_name: '', wifi_password: '', saved: false, upcoming: 0 };
        m.units[a.unit].upcoming += up;
      }
      if (str(a.room_key)) {
        if (!m.rooms[a.room_key]) m.rooms[a.room_key] = { room_key: a.room_key, unit: str(a.unit), room_label: '', door_code: '', bed: str(a.bed), saved: false, upcoming: 0 };
        if (!m.rooms[a.room_key].bed) m.rooms[a.room_key].bed = str(a.bed);
        m.rooms[a.room_key].upcoming += up;
      }
    });
    return M;
  }
  function natSort(a, b) { return String(a).localeCompare(String(b), 'en', { numeric: true, sensitivity: 'base' }); }

    var out = [], keys = m.tpl && m.tpl.keys_only;

    if (nu) out.push(nu + ' unit' + (nu === 1 ? '' : 's') + ' without Wi-Fi');
    var nr = keys ? 0 : Object.keys(m.rooms).filter(function (k) { return m.rooms[k].upcoming && !m.rooms[k].door_code; }).length;
    if (nr) out.push(nr + ' room' + (nr === 1 ? '' : 's') + ' without a door code');

  }
  function furSection(op, i) {
    var s = S.fur.sections;
    if (op === 'add') s.push({ title: '', text: '' });
    else if (op === 'del') s.splice(i, 1);
    else if (op === 'up' && i > 0) s.splice(i - 1, 0, s.splice(i, 1)[0]);
    else if (op === 'down' && i < s.length - 1) s.splice(i + 1, 0, s.splice(i, 1)[0]);
    S.tplDirty = true;
    renderFurForm();
  }
  function furPickRule(id) {
    if (S.fur && (S.fur.id || 'new') === id) return;
    if (S.tplDirty && !window.confirm('Leave this follow-up without saving?')) return;
    S.tplDirty = false; S.fur = null; S.furPick = id;
    renderFur($('tplB').value);
  }
  async function saveFur(reviewed) {
    var f = S.fur; if (!f) return;
    if (!str(f.name)) { toast('Give the follow-up a name.'); return; }
    if (!/^\d{1,2}:\d{2}/.test(str(f.send_time))) { toast('Pick a send time.'); return; }
    var bad = ['rules_url', 'docs_url'].filter(function (k) { return str(f[k]) && !/^https?:\/\//i.test(str(f[k])); });
    if (bad.length) { toast('Links must start with https://'); return; }
    var hours = parseInt(f.secret_valid_hours, 10);
    if (!(hours >= 1 && hours <= 168)) { toast('The link must work between 1 and 168 hours.'); return; }
    var sections = f.sections.filter(function (s) { return str(s.title) || str(s.text); }).map(function (s) { return { title: str(s.title), text: String(s.text).trim() }; });
    var ok = await rpc('followup_save', { p_id: f.id || null, p_building: f.building, p_city: f.city || null, p_name: str(f.name),
      p_send_time: str(f.send_time).slice(0, 5), p_enabled: !!f.enabled, p_subject: f.subject.trim(), p_intro: f.intro.trim(), p_sections: sections,
      p_rules_url: str(f.rules_url), p_docs_url: str(f.docs_url), p_show_codes: !!f.show_codes, p_also_buildings: f.also_buildings,
      p_secret_label: str(f.secret_label), p_secret_value: str(f.secret_value) !== str(f.code_saved) ? str(f.secret_value) : null,
      p_secret_valid_hours: hours, p_reviewed: reviewed });
    if (!ok) return;
    toast(reviewed === true ? 'Saved and marked reviewed' : reviewed === false ? 'Marked not reviewed'
      : ok.unreviewed ? 'Changes saved — mark reviewed again to send' : 'Saved');
    S.tplDirty = false; S.tplPick = f.building; S.furPick = ok.id || f.id; S.fur = null; S.acc = null;
    await loadAccess();
  }
  // end saveFur
  async function deleteFur() {
    var f = S.fur; if (!f || !f.id) return;
    if (!(await confirmSheet('Delete ' + (str(f.name) || 'this follow-up') + '?', '<p class="note">Nothing more will be sent from it. If it was already sent to students, switch it off instead.</p>', 'Delete'))) return;
    if (!(await rpc('followup_delete', { p_id: f.id }))) return;
    toast('Deleted');
    S.tplDirty = false; S.tplPick = f.building; S.fur = null; S.furPick = null; S.acc = null;
    await loadAccess();
  }
  // end after-hours

  // ───────── wiring ─────────
  function wire() {
    $('tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) setTab(b.getAttribute('data-tab')); });
    $('wkPrev').addEventListener('click', function () { S.wk = A.shiftWeekend(S.wk, -1); S.openId = null; S.rows = []; loadArrivals(); });
    $('wkNext').addEventListener('click', function () { S.wk = A.shiftWeekend(S.wk, 1); S.openId = null; S.rows = []; loadArrivals(); });
    $('cityF').addEventListener('change', function () { S.city = this.value; S.openId = null; loadArrivals(); });
    $('chips').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (b) { S.filter = b.getAttribute('data-f'); renderArrivals(); } });
    $('kpis').addEventListener('click', function (e) { if (e.target.closest('#openInfo')) openInfo(); });
    $('sendAll').addEventListener('click', sendAll);
    $('uploadRoster').addEventListener('click', function () { if (!S.uploading) $('rosterFile').click(); });
    $('rosterFile').addEventListener('change', function () { var f = this.files && this.files[0]; $('rosterFile').value = ''; if (f) uploadRoster(f); });
    $('uploadRefresh').addEventListener('click', function () { clearTimeout(S.uploadReload); $('uploadRefresh').hidden = true; loadArrivals(); });
    $('groups').addEventListener('click', function (e) { var b = e.target.closest('.arow'); if (b) openRow(b.getAttribute('data-id')); });
    $('panel').addEventListener('click', function (e) {
      var f = e.target.closest('[data-fu]');
      if (f) { if (!f.disabled) fuAct(f.getAttribute('data-fu'), +f.getAttribute('data-fk')); return; }
      var b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.getAttribute('data-act'));
    });
    $('panel').addEventListener('submit', function (e) { e.preventDefault(); saveFx(e.target); });
    // show/hide a masked code (Access tab and side panel)
    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-eye]'); if (!b) return;
      var inp = b.parentNode.querySelector('input'); var show = inp.type === 'password';
      inp.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show';
    });
    $('accQ').addEventListener('input', function () { if (S.acc) renderAccess(); });
    $('accCity').addEventListener('change', function () { if (S.acc) renderAccess(); });
    $('accBody').addEventListener('submit', function (e) { e.preventDefault(); saveAccessForm(e.target); });
    $('accBody').addEventListener('toggle', function (e) { var d = e.target; if (d.classList && d.classList.contains('bcard')) S.accOpen[d.getAttribute('data-b')] = d.open; }, true);
    $('accBody').addEventListener('click', function (e) {
      var g = e.target.closest('[data-goto]');
      if (g) {
        var name = g.getAttribute('data-goto'); S.accOpen[name] = true; renderAccess();
        var el = Array.prototype.filter.call(document.querySelectorAll('.bcard'), function (d) { return d.getAttribute('data-b') === name; })[0];
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      var a = e.target.closest('[data-add]');
      if (a) {
        var b = a.getAttribute('data-b'); var n = S.accNew[b] || (S.accNew[b] = { units: 0, rooms: 0 });
        n[a.getAttribute('data-add')]++; S.accOpen[b] = true; renderAccess();
      }
    });
    $('moPrev').addEventListener('click', function () { S.mo.wk = A.shiftWeekend(S.mo.wk, -1); S.mo.openId = null; S.mo.rows = []; loadMoveouts(); });
    $('moNext').addEventListener('click', function () { S.mo.wk = A.shiftWeekend(S.mo.wk, 1); S.mo.openId = null; S.mo.rows = []; loadMoveouts(); });
    $('moCity').addEventListener('change', function () { S.mo.city = this.value; S.mo.openId = null; loadMoveouts(); });
    $('moChips').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (b) { S.mo.filter = b.getAttribute('data-f'); renderMoveouts(); } });
    $('moKpis').addEventListener('click', function (e) { if (e.target.closest('[data-oinfo]')) openInfo(); });
    $('moGroups').addEventListener('click', function (e) { var b = e.target.closest('.arow'); if (b) moOpenRow(b.getAttribute('data-id')); });
    $('moPanel').addEventListener('click', function (e) { var b = e.target.closest('[data-mo]'); if (b && !b.disabled) moAct(b.getAttribute('data-mo')); });
    $('moPanel').addEventListener('submit', function (e) { e.preventDefault(); moSaveFx(e.target); });
    $('tplB').addEventListener('change', function () {
      var cur = S.tk === 'checkout' ? S.cot : S.tk === 'afterhours' ? S.fur : S.tpl;
      if (S.tplDirty && cur && !window.confirm('Discard unsaved changes to the ' + cur.building + ' template?')) { this.value = cur.building; return; }
      S.tplDirty = false; S.tplPick = this.value; S.tpl = null; S.cot = null; S.fur = null; S.furPick = null; renderTemplates();
    });
    $('tplKind').addEventListener('click', function (e) { var b = e.target.closest('[data-tk]'); if (b) setTplKind(b.getAttribute('data-tk')); });
    var tplIn = function (e) { if (S.tk === 'checkout') cotInput(e); else if (S.tk === 'afterhours') furInput(e); else tplInput(e); };
    $('tplBody').addEventListener('input', tplIn);
    $('tplBody').addEventListener('change', tplIn);
    $('tplBody').addEventListener('submit', function (e) { e.preventDefault(); if (S.tk === 'checkout') saveCot(null); else if (S.tk === 'afterhours') saveFur(null); else saveTpl(null); });
    $('tplBody').addEventListener('click', function (e) {
      var s = e.target.closest('[data-sec]');
      if (s && !s.disabled) { var box = s.closest('.sect'); (S.tk === 'checkout' ? cotSection : S.tk === 'afterhours' ? furSection : tplSection)(s.getAttribute('data-sec'), box ? +box.getAttribute('data-i') : -1); return; }
      var fr = e.target.closest('[data-fur]');
      if (fr) { furPickRule(fr.getAttribute('data-fur')); return; }
      var fa = e.target.closest('[data-fua]');
      if (fa) { var k = fa.getAttribute('data-fua'); if (k === 'delete') deleteFur(); else saveFur(k === 'review'); return; }
      var t = e.target.closest('[data-tpl]');
      if (t) { saveTpl(t.getAttribute('data-tpl') === 'review'); return; }
      var c = e.target.closest('[data-cot]');
      if (c) saveCot(c.getAttribute('data-cot') === 'review');
    });
    $('modal').addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]');
      if (b) closeModal(b.getAttribute('data-m') === '1');
      else if (e.target === this) closeModal(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if ($('modal').classList.contains('show')) closeModal(false);
      else if (S.tab === 'arrivals' && S.openId && NARROW.matches) act('close');
      else if (S.tab === 'moveouts' && S.mo.openId && NARROW.matches) moAct('close');
    });
    window.addEventListener('beforeunload', function (e) { if (S.tplDirty) { e.preventDefault(); e.returnValue = ''; } });
  }

  boot().catch(function (e) { console.error('[arrivals] boot failed', e); $('groups').innerHTML = '<div class="gate">Something went wrong loading Arrivals. Reload the page.</div>'; });
})();
</script>
</body>
</html>
